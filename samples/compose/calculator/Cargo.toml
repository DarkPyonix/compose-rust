[package]
name = "sample-calculator-compose"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The calculator sample written with compose-rust's own API: composables, state and the
# widget composables, and no Dioxus. The same screen as samples/calculator, which is how
# the two authoring paths are checked against each other and measured against each other.
[lib]
name = "sample_calculator_compose"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
bench = false

[dependencies]
compose-rust = { path = "../../../dioxus-compose" }

[[bin]]
name = "sample-calculator-compose"
path = "src/main.rs"
bench = false
