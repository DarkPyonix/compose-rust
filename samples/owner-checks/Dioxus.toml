# dx project configuration for the Owner-checks sample.
#
# The samples are ordinary dx projects on purpose. Someone reading one should see the
# layout they would get from `dx new`, not a special arrangement that only works inside
# this repository, because the point of a sample is to be copied.
#
# The identifier has no hyphen because Android takes it as a package name, which allows
# none.

[application]
name = "Owner-checks"
asset_dir = "assets"

[bundle]
identifier = "dev.darkpyonix.composerust.samples.ownerchecks"
publisher = "DarkPyonix"
short_description = "The hand checks before a release, one screen each."
long_description = "Notifications, a platform view inside the window, a caption strip the application draws, five controls for a screen reader and two fields for an input method, each with what to do and what must be seen."

[macos]
bundle_name = "Owner-checks"

# The sample's windows check opens several windows, which on an iPad are
# scenes. A bundle that lists no scene manifest gets one scene, and the system makes a scene
# from a dragged tab only for an activity type the bundle names. With the manifest the
# renderer starts every launch through its scene delegate, the single-window screens of this
# sample included, where one scene draws the one window as before. Only this sample asks for
# it, so the other samples start the way they always have.
[ios.plist]
NSUserActivityTypes = ["dev.darkpyonix.composerust.window"]

[ios.plist.UIApplicationSceneManifest]
UIApplicationSupportsMultipleScenes = true
