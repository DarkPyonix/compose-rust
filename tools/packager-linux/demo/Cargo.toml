[package]
name = "packager-linux-demo"
# The packaging workflow builds this twice with different versions in
# DIOXUS_COMPOSE_APP_VERSION and shows the older one updating itself to the newer.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "A small program that shows a packaged dioxus-compose application updating itself"

[[bin]]
name = "update-demo"
path = "src/main.rs"
bench = false

[dependencies]
# No renderer: this program draws nothing, so it needs neither the renderer download nor
# a display, and it builds inside a Flatpak sandbox with no network.
dioxus-compose = { path = "../../../dioxus-compose", default-features = false }
