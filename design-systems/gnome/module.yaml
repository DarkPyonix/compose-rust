# GNOME 50 (Adwaita).
#
# What `adaptive` picks on Linux when the session is GNOME (SPEC FR-14.3). GNOME ships no
# Compose library, so this is ours: the Adwaita palette, its typography and its flat,
# high contrast controls.

product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

# Compose is thisisthepy/compose-multiplatform-core-extended's, which nothing public has yet:
# renderer/scripts/build-compose.sh publishes it into the local repository.
repositories:
  - mavenLocal

dependencies:
  - //core: exported
  - $libs.compose.runtime
  - $libs.compose.foundation
  - $libs.compose.ui

test-dependencies:
  - $kotlin.test
