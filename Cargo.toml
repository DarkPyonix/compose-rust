[workspace]
members = [
    "dioxus-compose",
    "adapters/dioxus",
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# The Dioxus adapter, for everything in this workspace that is written with rsx!.
dioxus-compose-adapter = { path = "adapters/dioxus" }
dioxus-core = "0.7.10"
dioxus-core-macro = "0.7.10"
dioxus-hooks = "0.7"
dioxus-signals = "0.7"
