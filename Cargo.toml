[workspace]
members = [
    "compose-rust",
    "compose-rust-macros",
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/compose/calculator",
    "samples/compose/chat",
    "samples/compose/minimal",
    "samples/compose/todo",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
dioxus-core = "0.7.10"
dioxus-core-macro = "0.7.10"
dioxus-hooks = "0.7"
dioxus-signals = "0.7"
