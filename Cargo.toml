[workspace]
members = [
    "compose-rust",
    "compose-rust/macros",
    # The sample applications, written on the compose-rust authoring API, and the library
    # their recording tests draw their screens through.
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
    "scripts/packager-windows",
    "tools/msix",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
