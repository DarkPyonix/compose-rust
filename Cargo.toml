[workspace]
members = [
    "compose-rust",
    "compose-rust/macros",
    # The samples ported to the compose-rust authoring API. The rest of samples/ is
    # excluded below until it is ported too; a listed member is built even so.
    "samples/compose/calculator",
    "samples/compose/chat",
    "samples/compose/minimal",
    "samples/compose/todo",
]
# The samples are being rewritten on the compose-rust authoring API (#85) and are kept out of
# the workspace until then; they still name the Dioxus adapter, which moved to dioxus-compose.
exclude = ["samples"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
