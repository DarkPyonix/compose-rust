[workspace]
members = [
    "compose-rust",
    "compose-rust/macros",
    "compose-rust-preview",
    # The sample applications, written on the compose-rust authoring API, and the library
    # their recording tests draw their screens through.
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/owner-checks",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
    "scripts/packager-linux",
    "scripts/packager-linux/demo",
    "scripts/packager-windows",
]
resolver = "2"

[workspace.dependencies]
# Velopack's SDK, which the desktop samples use to answer the installer's and updater's
# hooks. Pinned to the vpk the packaging workflows install (VPK_VERSION), because Velopack
# asks for the two to be the same version.
velopack = "=1.2.161"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(compose_rust_preview)'] }
