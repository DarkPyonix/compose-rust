[package]
name = "packager-linux-demo"
# The packaging workflow builds this twice with different versions in
# COMPOSE_RUST_APP_VERSION and packages both.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "A small program that the packaging workflow wraps as an AppImage and a Flatpak"

[[bin]]
name = "update-demo"
path = "src/main.rs"
bench = false

[dependencies]
# No renderer: this program draws nothing, so it needs neither the renderer download nor
# a display, and it builds inside a Flatpak sandbox with no network.
compose-rust = { path = "../../../compose-rust", default-features = false }
