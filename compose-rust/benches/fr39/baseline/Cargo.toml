[package]
name = "fr39-baseline"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Dioxus side: dioxus-compose's benches/dioxus-baseline, the rsx! screens of the
# samples, taken whole at a fixed commit together with the dioxus-compose they were written
# against and the compose-rust under it. Pinning the crate rather than only the adapter pins
# the screens as well, so neither half of the baseline can move under the comparison.
#
# The rev is the one scripts/bench/fr39-baseline.env pins, and run.sh refuses to measure
# when the two disagree. Changing it means changing both and measuring every scenario again.
[dependencies]
fr39-scenarios = { path = "../scenarios" }
dioxus-baseline = { git = "https://github.com/DarkPyonix/dioxus-compose", rev = "dd1af76bd67282100de20ea7ffe5843b50886869" }
# The same dioxus-compose the baseline crate resolves at that rev, named here only to turn
# the renderer download off: these runs drive the boundary with no window.
dioxus-compose = { git = "https://github.com/DarkPyonix/dioxus-compose", rev = "dd1af76bd67282100de20ea7ffe5843b50886869", default-features = false, features = ["mock-renderer"] }
