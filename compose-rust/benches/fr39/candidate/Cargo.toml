[package]
name = "fr39-candidate"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The slot table side, from this checkout: today's runtime, and the screens the scenarios
# were frozen against, kept in ../screens and written in today's call form. Not the shipped
# samples: those were redrawn after the scenarios were frozen and no longer build the trees
# the pinned Dioxus path builds.
[dependencies]
fr39-scenarios = { path = "../scenarios" }
compose-rust = { path = "../../..", default-features = false, features = ["mock-renderer"] }
fr39-screen-calculator = { path = "../screens/calculator" }
fr39-screen-chat = { path = "../screens/chat" }
fr39-screen-minimal = { path = "../screens/minimal" }
fr39-screen-todo = { path = "../screens/todo" }
