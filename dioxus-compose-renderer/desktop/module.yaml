product: jvm/app

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

# Compose is thisisthepy/compose-multiplatform-core-extended's, which nothing public has yet:
# scripts/build-compose.sh publishes it into the local repository.
repositories:
  - mavenLocal

dependencies:
  # Compose for desktop, and skiko's native half for each desktop system a build script here
  # supports. The toolchain's `$compose.desktop.currentOs` picked the one system, but only for
  # JetBrains' coordinate. Each loads only its own library at run time, and the native-image
  # scripts take the one jar for the system they build.
  - $libs.compose.desktop
  - $libs.skiko.awt.runtime.macos.arm64
  - $libs.skiko.awt.runtime.macos.x64
  - $libs.skiko.awt.runtime.linux.x64
  - $libs.skiko.awt.runtime.linux.arm64
  - $libs.skiko.awt.runtime.windows.x64
  # FR-11's example extension draws a Material 3 progress indicator.
  - $libs.compose.material3
  - $libs.kotlinx.coroutines.swing
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.lifecycle.viewmodel.compose
  # Annotations and C interop types for @CEntryPoint. Supplied by the native-image
  # builder at image build time, so it is not bundled into the jar.
  - org.graalvm.sdk:nativeimage:25.0.1: compile-only

test-dependencies:
  - $libs.compose.ui.test.junit4
  - $kotlin.test

settings:
  jvm:
    # Used only for JVM runs that collect reachability metadata with the tracing agent.
    # The native image is built as a shared library and is entered through C entry points.
    mainClass: dioxus.compose.ui.platform.MetadataCollectionMainKt
