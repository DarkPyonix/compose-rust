# The renderer for Linux, without a virtual machine in it.
#
# The same renderer the desktop native image builds, compiled for the platform directly:
# `src/shared/` holds symlinks into `desktop/src/`, so there is one copy of the interpreter
# and one copy of the generated protocol. The boundary is the iOS one, which is Kotlin
# native and POSIX and names neither platform, so it is shared rather than written twice.
#
# What this is for: the native image carries a Java runtime, and most of what a Linux
# distribution of it weighs is that runtime rather than anything drawn. It also carries AWT
# and its X11 toolkit, which is a second window system underneath the one the renderer opens.
#
# The window is `src/LinuxWindow.kt`: Xlib, GLX and the sync extension reached through
# `cinterop/x11.def`. Windows has no Kotlin/Native Compose target and keeps the native image
# path, which is why `desktop/c/x11_window.c` is still there: Windows links it for the names
# it answers, and it is the window the native image opens.
product:
  type: lib
  platforms: [ linuxX64 ]

# Where Compose comes from. Compose Multiplatform publishes no Kotlin/Native target for
# Linux at all, so every module below is built from source here: a fork of Compose adds what
# the target needs that upstream does not have, publishes it under its own coordinates,
# org.thisisthepy.compose.*, and `scripts/build-compose.sh --target linuxX64` builds and
# publishes it into the local repository. skiko has a published linuxX64 target and is
# resolved normally, as a dependency of Compose UI.
repositories:
  - mavenLocal

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

# Named by the coordinate of the target rather than by the module's root, so that what is
# linked is exactly the klib built for this target. The list is what `scripts/build-compose.sh`
# publishes; the two have to agree and `linux-native-window.test.sh` says so when they stop
# agreeing.
#
# The runtime and runtime-saveable are named by their root. The fork's are empty klibs that
# point at androidx.compose.runtime, which androidx publishes for linuxX64 itself, and it is the
# root's metadata that brings that in.
dependencies:
  - org.thisisthepy.compose.runtime:runtime:1.11.1-ext.1
  - org.thisisthepy.compose.runtime:runtime-saveable:1.11.1-ext.1
  - org.thisisthepy.compose.animation:animation-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.animation:animation-core-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.foundation:foundation-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.foundation:foundation-layout-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.material:material-ripple-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.material3:material3-linuxx64:1.11.0-alpha07-ext.1
  - org.thisisthepy.compose.ui:ui-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-backhandler-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-geometry-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-graphics-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-text-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-tooling-preview-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-unit-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-util-linuxx64:1.11.1-ext.1

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi
