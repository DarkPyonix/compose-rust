# The Dioxus side of the comparison the compose-rust runtime is measured against.
#
# The rsx! versions of the sample applications, gathered under one name. They are not the
# public samples any more: those are being rewritten on the compose-rust API, and these
# stay behind as the thing the rewrite is compared with, screen for screen.
#
# Outside compose-rust's dependency graph by construction: compose-rust depends on nothing
# here, and `scripts/tests/core-has-no-dioxus.test.sh` checks that it stays that way.
#
# The Dioxus path is the workspace's `dioxus-compose-adapter` dependency, one line in the
# root Cargo.toml. Freezing the baseline is changing that line from a path to a git rev.
[package]
name = "dioxus-baseline"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
bench = false

[dependencies]
dioxus-compose-adapter.workspace = true
sample-academic = { path = "../../samples/academic" }
sample-calculator = { path = "../../samples/calculator" }
sample-chat = { path = "../../samples/chat" }
sample-minimal = { path = "../../samples/minimal" }
sample-notepad = { path = "../../samples/notepad" }
sample-podcast = { path = "../../samples/podcast" }
sample-selfcare = { path = "../../samples/selfcare" }
sample-social = { path = "../../samples/social" }
sample-statistics = { path = "../../samples/statistics" }
sample-store = { path = "../../samples/store" }
sample-todo = { path = "../../samples/todo" }
