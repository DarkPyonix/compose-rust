# The vocabulary every design system speaks: roles in, styles out.
#
# This module defines the contract and nothing else. It has no opinion about how a
# Primary colour looks; that is what the three implementations are for. It must stay free
# of any dependency on dioxus-compose-renderer, which is what lets this project ship on
# its own.

product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

# Compose is thisisthepy/compose-multiplatform-core-extended's, which nothing public has yet:
# dioxus-compose-renderer/scripts/build-compose.sh publishes it into the local repository.
repositories:
  - mavenLocal

dependencies:
  - $libs.compose.runtime
  - $libs.compose.foundation
  - $libs.compose.ui
