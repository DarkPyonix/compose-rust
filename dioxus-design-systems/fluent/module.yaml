# Fluent 2, implemented here rather than delegated.
#
# Microsoft ships no Compose implementation of Fluent, so unlike the Material module this
# one resolves every role from the published Fluent 2 token set itself.
# Konyaco/compose-fluent-ui is a useful cross check for the same values and is
# deliberately not listed below: it describes its own API as experimental and subject to
# change without notice, and this project has to keep every dependency reachable under
# GraalVM native image.
product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, wasmJs ]

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

# Compose is thisisthepy/compose-multiplatform-core-extended's, which nothing public has yet:
# dioxus-compose-renderer/scripts/build-compose.sh publishes it into the local repository.
repositories:
  - mavenLocal

dependencies:
  - //core: exported
  - $libs.compose.runtime
  - $libs.compose.foundation
  - $libs.compose.ui

test-dependencies:
  - $kotlin.test
