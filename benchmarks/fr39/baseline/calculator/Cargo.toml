[package]
name = "fr39-baseline-calculator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# One binary per sample: every sample exports the same platform entry points, so no two
# of them can be linked into one executable.
[dependencies]
fr39-baseline-driver = { path = "../driver" }
fr39-scenarios = { path = "../../scenarios" }
sample-calculator = { git = "https://github.com/DarkPyonix/compose-rust", rev = "ab73fb45b416d1a143b1593cd03aee8af186c12a" }
