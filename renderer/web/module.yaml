# The renderer for the web (M7).
#
# The interpreter sources are the same files the desktop renderer builds: `src/shared/`
# holds symlinks into `desktop/src/`, so there is one copy of the interpreter and one copy
# of the generated protocol. Everything else under `src/` is the web half of the boundary:
# the generated wasm imports instead of the GraalVM declarations, a `java.nio` shim over
# wasm linear memory, and the browser's own `Intl` tables for the pickers.
#
# The module cannot depend on `desktop` instead, because that one is a `jvm/app`.
product: wasm-js/app

repositories:
  - mavenLocal
  - https://maven-central.storage-download.googleapis.com/maven2/

# The fork's browser overlay exposes the state of a Checkbox, Switch and RadioButton.
# Publish the pinned Wasm artifacts with `scripts/build-compose.sh --target wasmJs`.
apply:
  - ../compose.module-template.yaml

dependencies:
  - org.thisisthepy.compose.runtime:runtime:1.11.1-ext.6
  - org.thisisthepy.compose.foundation:foundation:1.11.1-ext.6
  - org.thisisthepy.compose.material3:material3:1.11.1-ext.6
  - org.thisisthepy.compose.ui:ui:1.11.1-ext.6

test-dependencies:
  - $kotlin.test
