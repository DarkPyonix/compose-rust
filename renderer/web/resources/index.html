<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComposeRust</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <!--
      The Host's loader, `compose-rust-host.gen.mjs`, has no script tag of its own. The
      renderer's module imports it by name, because its boundary calls are wasm imports bound
      to the trampoline the loader creates, so the loader is always evaluated first. By the
      time the renderer starts, the trampoline exists and the Host's module is compiled and
      waiting. It cannot be instantiated yet: it imports the linear memory, and that memory
      does not exist until the renderer's module is instantiated. The renderer's `main`
      closes the circle and puts the Host's exports in the trampoline's table.

      A page with no Host beside it still comes up. The loader says so on the console and
      the renderer draws its development host.
    -->
    {{kotlin.scripts}}
</body>
</html>
