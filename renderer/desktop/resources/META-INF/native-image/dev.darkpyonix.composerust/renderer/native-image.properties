# The classes that hold a CEntryPointLiteral, the address of a function in the image that
# the window calls while its edge is dragged. The X11 and AppKit ones are the Compose fork's
# window modules, and the Windows one is this renderer's own until that window moves too.
# Native Image fills a literal in only while it builds, so each is initialised then, on every
# desktop. A class reachable on a platform it
# is not meant for (the Windows window class is reachable from the platform switch on macOS
# and Linux too) still has its literal, and a literal created at run time is not possible.
Args = --initialize-at-build-time=org.thisisthepy.compose.window.graalvm.linux.X11Upcalls,org.thisisthepy.compose.window.graalvm.macos.AppKitUpcalls,dev.darkpyonix.composerust.ui.platform.Win32DrawCallback,dev.darkpyonix.composerust.ui.platform.ToolkitWindow,androidx.compose.ui.internal.ExtendedAwt
