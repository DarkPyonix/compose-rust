# The renderer for Linux, without a virtual machine in it.
#
# The same renderer the desktop native image builds, compiled for the platform directly:
# `src/shared/` holds symlinks into `desktop/src/`, so there is one copy of the interpreter
# and one copy of the generated protocol. The boundary is the iOS one, which is Kotlin
# native and POSIX and names neither platform, so it is shared rather than written twice.
#
# What this is for: the native image carries a Java runtime, and most of what a Linux
# distribution of it weighs is that runtime rather than anything drawn. It also carries AWT
# and its X11 toolkit, which is a second window system underneath the one the renderer opens.
#
# arm64 is the same module for the other architecture. Kotlin/Native has no arm64 Linux
# host, so it is cross compiled on x86-64, and the coordinates differ only in their suffix.
#
# The window is the Compose fork's `extended/window/native/linux` module: Xlib, GLX, the sync
# extension, XIM and AT-SPI, reached through its own cinterop. `src/LinuxWindow.kt` is the
# Compose half that draws the renderer's content in it. The native image path opens its X11
# window from the fork's `graalvm-linux` module, and Windows, which has no Kotlin/Native Compose
# target, keeps the native image path too.
product:
  type: lib
  platforms: [ linuxX64, linuxArm64 ]

# Where Compose comes from. Compose Multiplatform publishes no Kotlin/Native target for Linux at
# all, so every module below is built from source here: a fork of Compose adds what the target
# needs that upstream does not have, and `scripts/build-compose.sh --target linux` builds and
# publishes them under the fork's own coordinates, org.thisisthepy.compose.*. skiko has a
# published linuxX64 target and is resolved normally, as a dependency of Compose UI.
repositories:
  - mavenLocal

# Named by the coordinate of the target rather than by the shorthand. The shorthand asks
# for a module's root, whose metadata lists which targets it has, and the root is published
# by a task the toolchain skips on a machine that is not building every target at once. The
# target's own coordinate carries the klib and says what it is, which is the whole of what
# is needed here. The runtime is the fork's too, a stub with no classes that points at
# androidx.compose.runtime, which has this target.
#
# Every module is named, not only the four the renderer draws with, because a coordinate
# that points at one target carries no list of what it needs and nothing is brought in
# behind it. The list is what `scripts/build-compose.sh` publishes; the two have to agree
# and `linux-native-window.test.sh` says so when they stop agreeing.
# Compose's compiler plugin through the template rather than `compose: enabled`, which would add
# JetBrains' runtime and components-resources and with them JetBrains' Compose next to the fork's.
apply:
  - ../compose.module-template.yaml

dependencies:
  # Named rather than left to arrive behind Compose, so its version is the catalog's. The
  # renderer installs its own `Dispatchers.Main` through an internal kotlinx.coroutines
  # function (src/MainDispatcherInstall.kt), and an upgrade has to be a decision taken here
  # rather than one a Compose update makes for it.
  - $libs.kotlinx.coroutines.core
  # The window and what every window decides the same way. Published by
  # scripts/publish-window.sh from the pinned fork commit, next to the patched Compose.
  - org.thisisthepy.compose.window:common:0.1.0

dependencies@linuxX64:
  - org.thisisthepy.compose.runtime:runtime-linuxx64:1.11.1-ext.1
  - org.thisisthepy.compose.runtime:runtime-saveable-linuxx64:1.11.1-ext.1
