# Compose comes from thisisthepy/compose-multiplatform-core-extended, published as
# org.thisisthepy.compose.* at <upstream version>-ext.<N> (that repository's
# extended/COORDINATES.md). Nothing public has it yet: renderer/scripts/
# build-compose.sh builds the pinned commit into the local Maven repository, and the versions
# here are the ones it publishes (scripts/tests/compose-coordinates.test.sh holds them equal).
#
# Not the toolchain's own `$compose.*` catalog, and not `settings: compose: enabled`: both
# name JetBrains' coordinates, and the second adds JetBrains' Compose runtime to every module
# behind the build's back. The compiler plugin is applied by compose.module-template.yaml.
[versions]
logback = "1.6.2"
androidx-activity-compose = "1.13.0"
kotlinx-coroutines = "1.11.0"
# The Kotlin the toolchain compiles with (renderer/kotlin pins the toolchain,
# and Kotlin 2.4.10 is its default). The Compose compiler plugin is released with Kotlin and
# has to be the same version.
kotlin = "2.4.10"
compose = "1.11.1-ext.1"
compose-material3 = "1.11.0-alpha07-ext.1"
compose-lifecycle = "2.11.0-beta01-ext.1"
# What the fork's Compose asks for, and what a JVM build needs the native half of.
skiko = "0.144.6"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.thisisthepy.compose.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "compose-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.thisisthepy.compose.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "compose-lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

compose-compiler-plugin = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable", version.ref = "kotlin" }
compose-runtime = { module = "org.thisisthepy.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.thisisthepy.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.thisisthepy.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.thisisthepy.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "org.thisisthepy.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.thisisthepy.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-material3 = { module = "org.thisisthepy.compose.material3:material3", version.ref = "compose-material3" }
# What `$compose.desktop.currentOs` was: Compose for desktop, and skiko's native half for the
# system it runs on. The toolchain only knows how to pick the system for JetBrains' own
# coordinate, so every desktop system a build script here supports is named, and each loads
# only its own library at run time.
compose-desktop = { module = "org.thisisthepy.compose.desktop:desktop", version.ref = "compose" }
skiko-awt-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-awt-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64", version.ref = "skiko" }
skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
