# The renderer for macOS, without a virtual machine in it (SPEC NFR-4).
#
# The same renderer the desktop native image builds, compiled for the platform directly:
# `src/shared/` holds symlinks into `desktop/src/`, so there is one copy of the interpreter
# and one copy of the generated protocol. The boundary is the iOS one, which is Kotlin
# native and POSIX and names nothing of either platform, so it is shared rather than
# written twice.
#
# What this is for: the desktop image carries a Java runtime, and most of what it weighs is
# that runtime rather than anything drawn. Compose publishes this target, so on this
# platform none of it is needed.
#
# Windows and Linux have no such target and keep the native image path.
product:
  type: lib
  platforms: [ macosArm64 ]

# Where Compose comes from. The macOS context menu, the entries a selection offers and the
# keys that copy are all empty in the published build for this platform, and none of them can
# be answered from outside the module that holds them. They are commits in a fork of Compose,
# which publishes under its own coordinates, org.thisisthepy.compose.*;
# `scripts/build-compose.sh` builds the whole of what this module reaches and publishes it
# into the local repository.
repositories:
  - mavenLocal

# Compose's compiler plugin; the template says why it is not `compose: enabled`.
apply:
  - ../compose.module-template.yaml

dependencies:
  - $libs.compose.runtime
  - $libs.compose.foundation
  - $libs.compose.material3
  - $libs.compose.ui

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi
