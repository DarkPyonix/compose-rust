# The renderer for macOS, without a virtual machine in it (SPEC NFR-4).
#
# The same renderer the desktop native image builds, compiled for the platform directly:
# `src/shared/` holds symlinks into `desktop/src/`, so there is one copy of the interpreter
# and one copy of the generated protocol. The boundary is the iOS one, which is Kotlin
# native and POSIX and names nothing of either platform, so it is shared rather than
# written twice.
#
# What this is for: the desktop image carries a Java runtime, and most of what it weighs is
# that runtime rather than anything drawn. Compose publishes this target, so on this
# platform none of it is needed.
#
# The window itself, AppKit and the Metal surface, is the fork's `extended/window/native/macos`
# module; this module draws the renderer's content in it. Windows has no such target and keeps
# the native image path.
product:
  type: lib
  platforms: [ macosArm64 ]

# Where Compose comes from. The macOS context menu, the entries a selection offers and the
# keys that copy are all empty in the published build for this platform, and none of them can
# be answered from outside the module that holds them. They are commits in a fork of Compose;
# `scripts/build-compose.sh` builds it and publishes it under the fork's own coordinates,
# org.thisisthepy.compose.*, which nothing JetBrains publishes can stand in for.
repositories:
  - mavenLocal

# Compose's compiler plugin through the template rather than `compose: enabled`, which would add
# JetBrains' runtime and components-resources and with them JetBrains' Compose next to the fork's.
apply:
  - ../compose.module-template.yaml

dependencies:
  # The fork's runtime: a stub with no classes that points at androidx.compose.runtime.
  - org.thisisthepy.compose.runtime:runtime:1.11.1-ext.2
  # The fork's Compose. Not `$compose.foundation` and the rest: those are JetBrains', and the two
  # side by side would be the same classes twice under two groups.
  - org.thisisthepy.compose.foundation:foundation:1.11.1-ext.2
  - org.thisisthepy.compose.material3:material3:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui:1.11.1-ext.2
  # The window: AppKit and Metal, and what every window decides the same way. Published by
  # scripts/publish-window.sh from the pinned fork commit, next to the patched Compose.
  - org.thisisthepy.compose.window:common:1.11.1-ext.2
  - org.thisisthepy.compose.window:native-macos:1.11.1-ext.2

test-dependencies:
  - $kotlin.test

settings:
  kotlin:
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi
