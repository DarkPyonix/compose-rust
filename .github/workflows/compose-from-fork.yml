# Compose from the fork: build it, and build the renderer against it.
#
# scripts/build-compose.sh fetches one pinned commit of
# thisisthepy/compose-multiplatform-core-extended and publishes the modules the renderer
# reaches into the local Maven repository, under the fork's own coordinates
# (org.thisisthepy.compose.* at <upstream version>-ext.<N>). This workflow does that from an
# empty repository on both platforms the Kotlin/Native renderer is built for, and then builds
# the renderer's platform module and its static library against it, the way
# desktop/scripts/build-linux.sh and build-macos.sh build them, and keeps the static library
# as an artifact. An empty repository is the point: a module build-compose.sh forgot to
# publish fails here, not on a machine that still has it from an earlier build.
#
# It used to compare that publication, file by file, with the one the old patches produced,
# to show the fork was the same build before the patches were dropped. That showing was made
# for the pin it was made for. Under the fork's own group and version no path and no klib
# manifest can match the old build's, so the comparison would only ever report that they
# differ; it is gone rather than left to fail.
#
# The Gradle build cache is turned off, so that what is built is built from the pinned
# source and not taken from an earlier run's outputs.
#
# Nothing else in CI builds Compose from scratch: the other workflows keep the result in the
# cache (.github/actions/compose-fork). Building Compose is slow, so this runs on demand and
# when the pin or the build script changes, not on every push.

name: Compose from fork

on:
  workflow_dispatch:
  pull_request:
    paths:
      - renderer/scripts/build-compose.sh
      - renderer/scripts/compose-fork.changes
      - .github/workflows/compose-from-fork.yml
      - .github/actions/compose-fork/action.yml

concurrency:
  group: compose-from-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linuxX64
            renderer_script: build-linux.sh
            renderer_out: linux
            toolchain_cache: ~/.cache/JetBrains/Kotlin
            gradle_heap: 11g
            gradle_workers: 4
          - name: macOS arm64
            runner: macos-latest
            target: macosArm64
            renderer_script: build-macos.sh
            renderer_out: macos
            toolchain_cache: ~/Library/Caches/JetBrains/Kotlin
            gradle_heap: 5g
            gradle_workers: 2
    env:
      COMPOSE_WORK: ${{ github.workspace }}/../compose-build
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          # The Android SDK stays: the Compose build configures its Android targets even
          # when it only publishes a native one.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Report the machine
        run: |
          uname -a
          # Both runner images carry an Android SDK, which the Compose build configures its
          # Android targets against even when it publishes a native one only.
          echo "ANDROID_HOME=${ANDROID_HOME:?the runner image has no Android SDK}"
          df -h "$GITHUB_WORKSPACE"
          if [[ "$RUNNER_OS" == macOS ]]; then
            sysctl -n hw.memsize hw.ncpu
            xcodebuild -version
          else
            free -h
            nproc
          fi

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Point the Compose build at the JDK
        # The Compose build turns toolchain auto-detection off and takes its JDK 21 from this
        # variable, the way its own CI does.
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Kotlin/Native for the Compose build
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('renderer/scripts/build-compose.sh') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache the Kotlin toolchain the renderer builds with
        uses: actions/cache@v4
        with:
          path: ${{ matrix.toolchain_cache }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the X11, Xext, GL, fontconfig and FreeType development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The module's test executable links against skiko, which needs fontconfig and
          # FreeType as well as the libraries the window itself uses.
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Configure Gradle for this runner
        # The user-level file overrides the checkout's gradle.properties. The heap the Compose
        # build asks for is sized for a workstation; the build cache is off so that the second
        # Compose build cannot reuse the first one's outputs.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=${{ matrix.gradle_workers }}
          org.gradle.jvmargs=-Xmx${{ matrix.gradle_heap }} -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF
          cat ~/.gradle/gradle.properties

      - name: Build Compose from the fork
        run: |
          rm -rf ~/.m2/repository
          DXC_COMPOSE_BUILD="$COMPOSE_WORK" \
            ./renderer/scripts/build-compose.sh --target ${{ matrix.target }} --clean
          find ~/.m2/repository/org/thisisthepy -type f | wc -l
          du -sh ~/.m2/repository/org/thisisthepy
          df -h "$GITHUB_WORKSPACE"

      - name: Build the renderer and its static library against it
        run: ./renderer/desktop/scripts/${{ matrix.renderer_script }}

      - name: Report the static library
        run: |
          ls -la renderer/build/${{ matrix.renderer_out }}
          du -sh renderer/build/${{ matrix.renderer_out }}

      - name: Keep the static library
        uses: actions/upload-artifact@v4
        with:
          name: renderer-staticlib-${{ matrix.target }}
          path: renderer/build/${{ matrix.renderer_out }}
          retention-days: 14
