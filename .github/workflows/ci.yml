name: CI

on:
  workflow_dispatch:
    inputs:
      suites:
        # all (the default, what a release check runs, every job that gates a merge), fast (the
        # Rust, JVM and script tests, the Windows C compile and the GraalVM renderer smoke,
        # about two hours), measure (the resize timings, which test_windows_resize reports only
        # when asked), owner_checks (the owner-checks sample alone, on the desktop, uploaded as
        # owner-checks-<os> downloads), memory_report (the blank window's memory on Linux and
        # Windows, reported only and never part of all), publish_schema_renderer (builds the
        # renderers for this commit's schema and uploads them to the renderer-dev release, on
        # develop only, never part of all; dispatch it alone, since it builds its own Windows
        # kit and renderers under the same artifact names the other jobs use), or a comma list
        # of these and job names. scripts/ci-suites.sh says which jobs each runs.
        description: 'all, fast, measure, owner_checks, memory_report, publish_schema_renderer, or suites and job names separated by commas'
        type: string
        default: all

concurrency:
  group: dev-ci
  cancel-in-progress: false

# A called workflow may not ask for more than this: test-samples' release job needs actions: write.
permissions:
  contents: write
  actions: write

jobs:
  plan:
    name: Choose the suites
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.choose.outputs.test }}
      test_graalvm_renderer: ${{ steps.choose.outputs.test_graalvm_renderer }}
      windows_static_kit: ${{ steps.choose.outputs.windows_static_kit }}
      windows_static_consumer: ${{ steps.choose.outputs.windows_static_consumer }}
      test_windows_resize: ${{ steps.choose.outputs.test_windows_resize }}
      test_native_renderer: ${{ steps.choose.outputs.test_native_renderer }}
      test_windows_c: ${{ steps.choose.outputs.test_windows_c }}
      package_windows_host: ${{ steps.choose.outputs.package_windows_host }}
      packager_linux: ${{ steps.choose.outputs.packager_linux }}
      test_kn_desktop_renderer: ${{ steps.choose.outputs.test_kn_desktop_renderer }}
      package_windows: ${{ steps.choose.outputs.package_windows }}
      packager_macos: ${{ steps.choose.outputs.packager_macos }}
      test_compose_from_fork: ${{ steps.choose.outputs.test_compose_from_fork }}
      test_samples: ${{ steps.choose.outputs.test_samples }}
      test_memory_report: ${{ steps.choose.outputs.test_memory_report }}
      publish_schema_renderer: ${{ steps.choose.outputs.publish_schema_renderer }}
      measure: ${{ steps.choose.outputs.measure }}
      samples: ${{ steps.choose.outputs.samples }}
      samples_desktop_only: ${{ steps.choose.outputs.samples_desktop_only }}
    steps:
      - uses: actions/checkout@v4
      - id: choose
        env:
          SUITES: ${{ inputs.suites }}
        run: scripts/ci-suites.sh "$SUITES" | tee -a "$GITHUB_OUTPUT"
  test:
    if: needs.plan.outputs.test == 'true'
    needs: plan
    uses: ./.github/workflows/test.yml
    secrets: inherit
  test_graalvm_renderer:
    if: needs.plan.outputs.test_graalvm_renderer == 'true'
    needs: plan
    uses: ./.github/workflows/test-graalvm-renderer.yml
    secrets: inherit
  # The Windows static renderer is the longest job of a run, and six jobs below need it.
  # It is built here once, and they take it from this run instead of each building the same
  # commit again; the application checks against it run beside them.
  windows_static_kit:
    if: needs.plan.outputs.windows_static_kit == 'true'
    needs: plan
    uses: ./.github/workflows/windows-static.yml
    with:
      part: kit
    secrets: inherit
  windows_static_consumer:
    if: needs.plan.outputs.windows_static_consumer == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/windows-static.yml
    with:
      part: consumer
    secrets: inherit
  # The resize gate drags the kit's renderer, the release build that ships, rather than
  # building a debug one of its own, which took almost two hours of its three.
  test_windows_resize:
    if: needs.plan.outputs.test_windows_resize == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/test-windows-resize-metrics.yml
    secrets: inherit
    with:
      metrics: ${{ needs.plan.outputs.measure == 'true' }}
  test_native_renderer:
    if: needs.plan.outputs.test_native_renderer == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/test-native-renderer.yml
    with:
      windows_kit_built: true
    secrets: inherit
  test_windows_c:
    if: needs.plan.outputs.test_windows_c == 'true'
    needs: plan
    uses: ./.github/workflows/test-windows-c.yml
    secrets: inherit
  package_windows_host:
    if: needs.plan.outputs.package_windows_host == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/package-windows-host.yml
    with:
      windows_kit_built: true
    secrets: inherit
  packager_linux:
    if: needs.plan.outputs.packager_linux == 'true'
    needs: plan
    uses: ./.github/workflows/packager-linux.yml
    secrets: inherit
  test_kn_desktop_renderer:
    if: needs.plan.outputs.test_kn_desktop_renderer == 'true'
    needs: plan
    uses: ./.github/workflows/test-kn-desktop-renderer.yml
    secrets: inherit
  package_windows:
    if: needs.plan.outputs.package_windows == 'true'
    needs: plan
    uses: ./.github/workflows/package-windows.yml
    secrets: inherit
  packager_macos:
    if: needs.plan.outputs.packager_macos == 'true'
    needs: plan
    uses: ./.github/workflows/packager-macos.yml
    secrets: inherit
  test_compose_from_fork:
    if: needs.plan.outputs.test_compose_from_fork == 'true'
    needs: plan
    uses: ./.github/workflows/test-compose-from-fork.yml
    secrets: inherit
  test_samples:
    if: needs.plan.outputs.test_samples == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/test-samples.yml
    with:
      windows_kit_built: true
      samples: ${{ needs.plan.outputs.samples }}
      desktop_only: ${{ needs.plan.outputs.samples_desktop_only == 'true' }}
    secrets: inherit
  # The blank window's memory on Linux and Windows, which reports and gates nothing. Only a
  # dispatch that names memory_report (or this job) runs it; all does not.
  test_memory_report:
    if: needs.plan.outputs.test_memory_report == 'true'
    needs: [plan, windows_static_kit]
    uses: ./.github/workflows/test-memory-report.yml
    secrets: inherit
  # The renderers for this commit's schema, uploaded to the renderer-dev release. It
  # publishes, so only a dispatch that names it runs it; all does not. It builds every
  # renderer itself, so it takes nothing from windows_static_kit.
  publish_schema_renderer:
    if: needs.plan.outputs.publish_schema_renderer == 'true'
    needs: plan
    uses: ./.github/workflows/publish-schema-renderer.yml
    secrets: inherit
