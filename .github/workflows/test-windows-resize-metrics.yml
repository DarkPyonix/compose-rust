# Resize metrics -- the Kotlin/Native renderers, Windows and macOS, measured the same way:
# the hand-check application with DXC_METRICS=1, which reports memory and the collector,
# dirties the heap and then takes the window through 100 scripted sizes, printing every
# frame's time and the collections among them. Builds as windows-static.yml does. Run by
# hand, once per question; the Compose builds behind it are long.
#
# The probe job then drags the hand-check this run built, from another process, on Windows
# Server 2022 and 2025, at 100% and at 200%: its right, bottom and left edges and its bottom
# right corner at three mouse rates, and the window states (maximise, restore, the left half
# of the screen, back), with resize frames on the CPU (the default) and on the GPU
# (DXC_RASTER_RESIZE=0), and the same for resize-control, a window 50 ms late on purpose.
# hand-check draws its marker scene (DXC_RESIZE_MARKER=1), so the probe judges every frame
# against the window's own border: a marker that does not reach it is an area not drawn, a
# marker of another width or a ruler line off its grid a stretched picture. The job fails
# when the control passes anywhere (the probe could not tell a late frame from a prompt one
# there, so nothing it says about hand-check counts) and when hand-check's CPU path shows any
# fault. The frames it kept, and contact sheets of them, are the resize-probe-frames artifact.
# The runners draw with WARP on the Basic Render Driver.

name: Resize metrics

on:
  workflow_dispatch:
  # A new workflow cannot be dispatched until it is on the default branch, so it also runs
  # on the pull request that changes it.
  pull_request:
    # Only when asked: the run-heavy-ci label going on, or a push or reopen while it is on.
    # The request job below decides; heavy-checks.yml holds the merge until it has passed.
    types: [synchronize, reopened, labeled]
    paths:
      - ".github/workflows/test-windows-resize-metrics.yml"
      - ".github/scripts/resize-metrics-run.sh"
      - ".github/scripts/resize-real-drag-run.sh"
      - ".github/scripts/resize-probe.c"
      - ".github/scripts/resize-control.c"
      - ".github/scripts/resize-os-version.h"
      - ".github/scripts/resize-probe.manifest"
      - ".github/scripts/resize-probe-README.txt"
      - ".github/scripts/resize-probe-match.sh"
      - ".github/scripts/resize-contact-sheet.ps1"
      - ".github/scripts/run-probe-v2.ps1"
      - ".github/scripts/run-probe-v2.cmd"
      - ".github/scripts/set-display-scale.c"
      - "compose-rust/tests/fixtures/hand-check/**"
      # WINDOW_REVISION, the fork commit the Windows window code is compiled from, is set
      # here: moving it has to drag the window it builds.
      - "renderer/scripts/build-compose.sh"

concurrency:
  # One run per pull request: a new commit cancels the older run. Pushes to develop,
  # dispatches and tag runs are never cancelled.
  group: test-windows-resize-metrics-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-heavy-ci' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Heavy: runs only when asked for (the run-heavy-ci label on a pull request, or any other
  # event). Every job below needs this one, so a run nobody asked for is skipped whole, and
  # heavy-checks.yml does not count it.
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  compose:
    needs: requested
    name: Compose and skiko for mingwX64 (built on Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Restore Compose and skiko for mingwX64
        id: kit-cache
        # Restored and saved as two steps, so a run that fails after they are built still
        # keeps them, and the next attempt does not spend an hour on them again.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            .scratch/skiko-build/out/windows-x64/skiko-bridges.lib
            .scratch/skiko-build/out/windows-x64/skia
            .scratch/skiko-build/out/windows-x64/embedded_icu.obj
          key: compose-mingwx64-${{ hashFiles('renderer/scripts/build-compose.sh', 'renderer/scripts/compose-fork-mingw.changes') }}

      - name: Make room for the Compose build
        if: steps.kit-cache.outputs.cache-hit != 'true'
        # The Android SDK stays, because Compose's Gradle build reads it.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install a JDK 17 for the Compose and skiko builds
        if: steps.kit-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Lay out the MSVC runtime and Windows SDK headers
        if: steps.kit-cache.outputs.cache-hit != 'true'
        # skiko's C++ half has to match Skia's ABI, which is MSVC's, so it is compiled with
        # clang in MSVC mode against these. xwin is what cargo-xwin uses to fetch them, and
        # the layout it writes is the one the skiko build looks for.
        run: |
          set -euo pipefail
          version=0.10.0
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$version/xwin-$version-x86_64-unknown-linux-musl.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xwin-$version-x86_64-unknown-linux-musl/xwin" --accept-license \
            splat --output "$HOME/.cache/cargo-xwin/xwin"
          ls "$HOME/.cache/cargo-xwin/xwin" "$HOME/.cache/cargo-xwin/xwin/sdk/include"

      - name: Fetch Kotlin/Native's LLVM and MinGW toolchain
        if: steps.kit-cache.outputs.cache-hit != 'true'
        # The skiko build compiles its C++ half with Kotlin/Native's clang and looks for it
        # before anything else runs, and Kotlin/Native downloads it only when it first links
        # something. Linking one empty program for mingwX64 is that first time.
        run: |
          set -euo pipefail
          version=2.2.20
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-native-prebuilt-linux-x86_64-$version.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo 'fun main() {}' > "$RUNNER_TEMP/empty.kt"
          "$RUNNER_TEMP/kotlin-native-prebuilt-linux-x86_64-$version/bin/konanc" \
            -target mingw_x64 "$RUNNER_TEMP/empty.kt" -o "$RUNNER_TEMP/empty"
          ls ~/.konan/dependencies
          ls ~/.konan/dependencies/llvm-*-essentials*/bin | head -50

      - name: Build skiko and Compose for mingwX64 from the fork
        if: steps.kit-cache.outputs.cache-hit != 'true'
        run: ./renderer/scripts/build-compose.sh --target mingwX64

      - name: Keep them for the next run
        if: github.event_name != 'pull_request' && (steps.kit-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            .scratch/skiko-build/out/windows-x64/skiko-bridges.lib
            .scratch/skiko-build/out/windows-x64/skia
            .scratch/skiko-build/out/windows-x64/embedded_icu.obj
          key: ${{ steps.kit-cache.outputs.cache-primary-key }}

      - name: Report what was published
        run: |
          find ~/.m2/repository -name '*mingwx64*' -maxdepth 5 | sort
          ls -la .scratch/skiko-build/out/windows-x64 .scratch/skiko-build/out/windows-x64/skia
          du -sh ~/.m2/repository .scratch/skiko-build/out/windows-x64

      - name: Hand them to the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: compose-mingwx64
          # The local Maven repository holds only what these builds published: Gradle keeps
          # what it downloads in its own cache, not here. Both directories are hidden ones,
          # which the upload leaves out unless told.
          include-hidden-files: true
          path: |
            ~/.m2/repository
            .scratch/skiko-build/out/windows-x64/skiko-bridges.lib
            .scratch/skiko-build/out/windows-x64/skia
            .scratch/skiko-build/out/windows-x64/embedded_icu.obj
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Kotlin/Native renderer, hand-check under a scripted resize (Windows, x64)
    needs: compose
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check symbolic links out as links
        # The renderer module reaches the shared interpreter through symlinks, and Git for
        # Windows checks them out as small text files unless told otherwise. The runner is an
        # administrator, which is what creating one needs.
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Confirm the links are links
        run: |
          set -euo pipefail
          link=renderer/windows/src/shared/HostButton.kt
          head -3 "$link"
          grep -q '^package ' "$link" || { echo "$link was checked out as a file holding its target" >&2; exit 1; }

      - name: Install a JDK 17 for the Kotlin/Native compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Receive Compose and skiko for mingwX64
        uses: actions/download-artifact@v4
        with:
          name: compose-mingwx64
          path: ${{ runner.temp }}/compose-mingwx64

      - name: Put them where the builds look
        run: |
          set -euo pipefail
          kit="$(cygpath -u "$RUNNER_TEMP")/compose-mingwx64"
          find "$kit" -maxdepth 3 | head -20
          # The artifact keeps the paths below the common root of what was uploaded.
          m2="$(find "$kit" -type d -path '*/.m2/repository' | head -1)"
          skiko="$(find "$kit" -type d -path '*/out/windows-x64' | head -1)"
          [[ -n "$m2" && -n "$skiko" ]] || { echo "the artifact holds no Maven repository or skiko output" >&2; exit 1; }
          mkdir -p ~/.m2 .scratch/skiko-build/out
          rm -rf ~/.m2/repository .scratch/skiko-build/out/windows-x64
          mv "$m2" ~/.m2/repository
          mv "$skiko" .scratch/skiko-build/out/windows-x64
          ls ~/.m2/repository/org/thisisthepy/compose/ui | head
          ls -la .scratch/skiko-build/out/windows-x64

      - name: Restore the Kotlin toolchain
        id: toolchain-cache
        # Restored and saved as two steps, so a run that fails after the toolchain is in place
        # still keeps it for the next one.
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            ~/.konan
          key: kotlin-native-windows-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-windows-

      - name: Enter the Visual Studio developer environment
        # The headers clang compiles our C against, and dumpbin.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          # The tools of the same toolset the headers above belong to: a cl.exe from an older
          # toolset refuses this one's C++ library (STL1001).
          $tools = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"

      - name: Report the machine
        run: |
          uname -a
          echo "CPU: $(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name') x $(nproc) logical"
          java -version 2>&1
          rustc -vV
          python --version || true
          command -v clang && clang --version || true
          df -h . || true

      - name: Build the static renderer
        id: renderer
        run: ./renderer/desktop/scripts/build-windows.sh

      - name: Keep the Kotlin toolchain for the next run
        if: github.event_name != 'pull_request' && (always() && steps.toolchain-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/JetBrains/Kotlin
            ~/.konan
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Show what the renderer build left behind
        if: failure()
        run: |
          ls renderer/build/tasks 2>/dev/null | grep -i windows || true
          tail -n 120 renderer/build/windows-logs/*-build.log 2>/dev/null || true
          tail -n 120 renderer/build/windows-logs/*-link.log 2>/dev/null || true

      - name: Keep the renderer build's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-static-renderer-logs
          path: renderer/build/windows-logs/
          retention-days: 7

      - name: Report the renderer kit
        run: |
          ls -la renderer/build/windows renderer/build/windows/*/
          du -sh renderer/build/windows

      - name: Release link, diagnosed
        # Why a release build of an application fails to link the renderer object
        # (LNK1223, invalid .pdata contributions) while a debug build links. rustc passes
        # /OPT:REF,ICF to a release link and /OPT:REF,NOICF to one with debug info, so the
        # same release build is linked three ways, and the object's unwind sections are
        # counted by kind.
        continue-on-error: true
        run: |
          set -uo pipefail
          export DXC_WINDOWS_NATIVE_LIB="$(cygpath -w "$PWD/renderer/build/windows")"
          manifest=compose-rust/tests/fixtures/hand-check/Cargo.toml
          for variant in default noicf noref; do
            case "$variant" in
              default) flags="" ;;
              noicf) flags="-Clink-arg=/OPT:NOICF" ;;
              noref) flags="-Clink-arg=/OPT:NOREF" ;;
            esac
            if RUSTFLAGS="$flags" CARGO_TARGET_DIR="target/release-link-$variant" \
                cargo build --release --manifest-path "$manifest" > "release-link-$variant.log" 2>&1; then
              echo "release link [$variant: $flags]: ok"
            else
              echo "release link [$variant: $flags]: FAIL"
              grep -m3 -E "LNK1[0-9]+" "release-link-$variant.log" || tail -5 "release-link-$variant.log"
            fi
          done
          archive="$(cygpath -w "$PWD/renderer/build/windows/libcompose_rust_renderer.a")"
          dumpbin -nologo -headers "$archive" > renderer-headers.txt 2>&1 || true
          echo "-- unwind sections in the renderer object, by name and COMDAT kind"
          grep -c "^SECTION HEADER" renderer-headers.txt || true
          grep -A1 "^SECTION HEADER" renderer-headers.txt | grep -oE "\.pdata[^ ]*" | sed 's/\$.*/$NAME/' | sort | uniq -c
          grep -B2 -A12 "^SECTION HEADER" renderer-headers.txt | grep -B3 -A10 " \.pdata$" | head -40

      - name: Keep the renderer object for the LNK1223 analysis
        uses: actions/upload-artifact@v4
        with:
          name: renderer-object-windows-kn
          path: renderer/build/windows/libcompose_rust_renderer.a
          retention-days: 5

      - name: Build hand-check against the renderer
        # Release: the link that LNK1223 broke (see fix-mingw-objects.py, point 3).
        run: |
          set -euo pipefail
          export DXC_WINDOWS_NATIVE_LIB="$(cygpath -w "$PWD/renderer/build/windows")"
          cargo build --release --manifest-path compose-rust/tests/fixtures/hand-check/Cargo.toml

      - name: Package hand-check for a check by hand
        run: |
          set -euo pipefail
          package="$(cygpath -u "$RUNNER_TEMP")/hand-check-windows"
          mkdir -p "$package"
          cp compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$package/"
          cat > "$package/README.txt" <<'TEXT'
          hand-check, Kotlin/Native renderer, resize frames on the CPU (commit ${{ github.sha }})

          Run from PowerShell in this folder, keeping the log:

              $env:DXC_REPORT_LATENCY = "1"
              .\hand-check.exe 2>&1 | Tee-Object hand-check.log

          Then check by eye, at 100% and at 200% display scale:
            1. Drag the right edge out and back in, slowly and fast.
            2. Drag the bottom-right corner diagonally out and back in.
            3. Maximise, restore, and snap to half the screen (Win+Left).
            4. Move the window to the other monitor, back again, then repeat 1 to 3.
          A pass is no black, no transparent area and no stretched picture at any edge, in
          any frame. Send hand-check.log with the verdict. To compare with GPU-only resize
          frames, run again with $env:DXC_RASTER_RESIZE = "0".
          TEXT
          sed -i 's/^          //' "$package/README.txt"

      - name: Keep the package
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: hand-check-windows-kn
          path: ${{ runner.temp }}/hand-check-windows/
          retention-days: 30

      - name: The executable is the Kotlin/Native renderer
        run: |
          exe=compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe
          ls -la "$exe"
          echo "graal_create_isolate occurrences: $(grep -a -c graal_create_isolate "$exe" || true)"
          echo "Kotlin/Native runtime strings (kotlin.native): $(grep -a -c 'kotlin.native' "$exe" || true)"
          echo "DLLs it loads:"; dumpbin -nologo -dependents "$(cygpath -w "$exe")" | grep -i "\.dll" || true

      - name: Build the resize probe
        # The probe drags the window from another process and records every composed frame.
        # Built with the MSVC tools entered above; kept as an artifact to run by hand as well.
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/resize-probe"
          mkdir -p "$dir"
          source="$(cygpath -w "$PWD/.github/scripts/resize-probe.c")"
          (cd "$dir" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$source")
          cp .github/scripts/resize-probe-README.txt "$dir/README.txt"
          rm -f "$dir"/*.obj
          ls -la "$dir"

      - name: Keep the resize probe
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-windows
          path: ${{ runner.temp }}/resize-probe/
          retention-days: 30

      - name: Scripted resize, measured
        env:
          DXC_D3D12_WARP: '1'
          DXC_PIXEL_COMPARE: '1'
          DXC_CAPTURE_CHECK: '1'
          DXC_HITTEST_CHECK: '1'
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn
          cat "$out/windows-kn.md" >> "$GITHUB_STEP_SUMMARY"
          # Variants: paced (one more composition before each capture, in the test hook),
          # and a real modal drag from posted mouse input at 16 ms and at 1 ms.
          DXC_CAPTURE_PACE=1 ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn-paced
          # Real modal drags from another process at three mouse rates: 16 ms / 8 px,
          # 8 ms / 4 px and 1 ms / 1 px. The runner has "show window contents while dragging"
          # off, which makes the sizing loop resize only on release, so the probe turns it on
          # for each drag and back off after.
          probe="$(cygpath -u "$RUNNER_TEMP")/resize-probe/resize-probe.exe"
          for rate in "16 8" "8 4" "1 1"; do
            set -- $rate
            ./.github/scripts/resize-real-drag-run.sh \
              compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$probe" "$out" \
              "windows-kn-real-$1" "$1" "$2"
          done
          # The same drag with resize frames on the GPU, for comparison.
          DXC_RASTER_RESIZE=0 ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn-gpu
          for label in windows-kn windows-kn-paced windows-kn-gpu; do
            echo "### $label: on-screen capture and hit tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "capture step|capture-check|hit-test" "$out/$label.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          for label in windows-kn-real-16 windows-kn-real-8 windows-kn-real-1; do
            echo "### $label: real drag from another process" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -hE "resize-probe: (window|client|move-size|summary|verdict)|real drag (ready|done)" \
              "$out/$label-probe.log" "$out/$label.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Resize frames on the CPU at 200%, each way of drawing them
        # Times the scene at the sizes a drag at 200% passes (density 2, 961 to 1157 by 1400
        # pixels), drawn each way the renderer offers, and compares each with the GPU frame.
        # Run a second time with every node's measuring timed by kind, which slows layout
        # and so is kept out of the first run's numbers.
        run: |
          set -uo pipefail
          out="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          mkdir -p "$out"
          cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name') x $(nproc) logical"
          status=0
          for profile in 0 1; do
            log="$out/draw-bench-$profile.log"
            DXC_DRAW_BENCH=1 DXC_LAYOUT_PROFILE=$profile \
              compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 600); do
              grep -q "draw-bench done" "$log" 2>/dev/null && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
            {
              echo "### CPU resize frame draw at 200% (layout profile: $profile)"
              echo "CPU: $cpu"
              echo '```'
              grep "draw-bench" "$log" || tail -40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CPU: $cpu"
            grep "draw-bench" "$log" || tail -40 "$log"
            grep -q "draw-bench done" "$log" || status=1
          done
          exit $status

      - name: What is on screen during a resize must be the frame drawn for it
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          # The verdict comes from the real modal drags, driven from another process at three
          # mouse rates, which step at the rate DefWindowProc's sizing loop does. The probe
          # judges every frame the compositor showed during the drag: no desktop and no black
          # inside the window, and the window must have changed size. The window must have
          # drawn at least one step. The scripted drags are reported in the summary, not
          # judged here.
          for label in windows-kn-real-16 windows-kn-real-8 windows-kn-real-1; do
            grep -E "resize-probe: verdict" "$dir/$label-probe.log" || { echo "$label: the probe gave no verdict" >&2; exit 1; }
            grep -q "resize-probe: verdict PASS" "$dir/$label-probe.log" || { echo "$label: the probe saw a failure" >&2; exit 1; }
            grep -qE "real drag done steps=[1-9][0-9]* verdict PASS" "$dir/$label.log" ||
              { echo "$label: the window drew no step of the drag" >&2; exit 1; }
          done
          log="$dir/windows-kn-real-16.log"
          grep -E "hit-test verdict" "$dir/windows-kn.log" || { echo "the hit test did not run" >&2; exit 1; }
          ! grep -q "hit-test verdict FAIL" "$dir/windows-kn.log" || exit 1
          # Every CPU resize step: nothing presented since the size change began, the
          # swapchain's child hidden, the frame copied into the window and validated.
          grep -q "resize-proof step" "$log" || { echo "no resize-proof lines" >&2; exit 1; }
          if grep "resize-proof step" "$log" | grep -vE "presents=0 child_visible=0 blit=1 validated=1$"; then
            echo "a resize step presented, left the child visible, or did not copy and validate" >&2
            exit 1
          fi

      - name: CPU and GPU frames must match
        run: |
          log="$(cygpath -u "$RUNNER_TEMP")/resize-metrics/windows-kn.log"
          grep "pixel-compare" "$log" || { echo "no pixel comparison ran" >&2; exit 1; }
          ! grep -q "pixel-compare verdict FAIL" "$log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-metrics-windows-kn
          path: ${{ runner.temp }}/resize-metrics/
          retention-days: 14

  probe:
    # hand-check as the windows job above built it in this run, so what is dragged is the
    # window code at this commit's pin and never an artifact of an older run.
    needs: windows
    name: Real drags of every edge from the resize probe at 100% and 200% (Windows, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Receive the Kotlin/Native hand-check from this run
        uses: actions/download-artifact@v4
        with:
          name: hand-check-windows-kn
          path: ${{ runner.temp }}/hand-check

      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $tools = $null
          $sdkbin = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
            if ($_ -match '^WindowsSdkVerBinPath=(.*)$') { $sdkbin = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # mt.exe, which the linker runs to embed the probe's manifest.
          Join-Path $sdkbin "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"
          Write-Output "Windows SDK tools: $(Join-Path $sdkbin 'x64')"

      - name: Build the resize probe, the control window and the display scale tool, and lay out the kit
        # The probe's manifest makes it per-monitor DPI aware before any of its code runs; the
        # control window takes the same one, as hand-check is per-monitor aware too.
        run: |
          set -euo pipefail
          kit="$(cygpath -u "$RUNNER_TEMP")/probe-kit"
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          mkdir -p "$kit" "$tools"
          scripts="$(cygpath -w "$PWD/.github/scripts")"
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-probe.c" \
            /link /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          # A GUI program, so that starting it opens no console window: on Server 2025 the
          # console opened beside the window and covered the backdrop the probe looks for.
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-control.c" \
            /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          (cd "$tools" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\set-display-scale.c")
          rm -f "$kit"/*.obj "$tools"/*.obj
          cp "$(cygpath -u "$RUNNER_TEMP")/hand-check/hand-check.exe" "$kit/"
          cp .github/scripts/run-probe-v2.ps1 .github/scripts/run-probe-v2.cmd .github/scripts/resize-contact-sheet.ps1 "$kit/"
          cp .github/scripts/resize-probe-README.txt "$kit/README.txt"
          {
            echo
            echo "This kit, all from commit $GITHUB_SHA (run $GITHUB_RUN_ID)"
            echo "  resize-probe.exe               the probe"
            echo "  resize-control.exe             the control window (50 ms late on purpose)"
            echo "  hand-check.exe                 the Kotlin/Native renderer, built in this run, with the"
            echo "                                 window code of the fork commit renderer/scripts/build-compose.sh pins"
            echo "  run-probe-v2.cmd / .ps1        every drag, the table and the contact sheets"
            echo "  resize-contact-sheet.ps1       the PNG frames and contact sheets, which run-probe-v2 makes"
            echo
            echo "sha256"
            (cd "$kit" && sha256sum hand-check.exe resize-probe.exe resize-control.exe)
          } >> "$kit/README.txt"
          ls -la "$kit"
          sha256sum "$kit"/*.exe

      - name: Keep the probe kit
        # hand-check, the control and the probe, for run-probe-v2.cmd on a real machine. One kit,
        # from one runner: the executables are the same on both.
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-kit-windows
          path: ${{ runner.temp }}/probe-kit/
          if-no-files-found: error
          retention-days: 30

      - name: Real drags at 100%
        # The kit's own script, as a person runs it. The runner has no graphics card, so
        # hand-check and the control draw with WARP.
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/1x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -Out "$out"

      - name: Set the display to 200%
        # The runner's display is 1024x768, where Windows offers no scale but 100%, and
        # 1920x1080 stops at 175%: the scale tool picks the largest mode that offers 200%.
        id: scale
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          mkdir -p "$out"
          set +e
          "$tools/set-display-scale.exe" 200 --fit > "$out/set-display-scale.log" 2>&1
          status=$?
          cat "$out/set-display-scale.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "set-display-scale exit $status"

      - name: Real drags at 200%
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/2x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -Out "$out"

      - name: Report the drags
        # The table run-probe-v2 wrote for each scale, then each drag's own lines.
        if: always()
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          results="$out/results-${{ matrix.os }}.md"
          {
            echo "## ${{ matrix.os }}"
            for scale in 1x 2x; do
              echo
              echo "### $scale"
              echo
              cat "$out/$scale/summary.md" 2>/dev/null | tr -d '\r' | sed 's/^\xEF\xBB\xBF//' || echo "no summary"
            done
          } > "$results"
          {
            cat "$results"
            echo
            echo "### Display scale"
            echo '```'
            cat "$out/set-display-scale.log" 2>/dev/null || echo "no set-display-scale log"
            echo '```'
            for scale in 1x 2x; do
              dir="$out/$scale"
              for probe in "$dir"/*-probe.log; do
                [ -f "$probe" ] || continue
                label="$(basename "$probe" -probe.log)"
                echo "### $scale $label"
                echo '```'
                grep -hE "resize-probe: (os|dpi awareness|duplicating|placed|moved|window|  |client|scan box|stale reference|markers|move-size|state|minimise|lag|summary|verdict)" \
                  "$probe" 2>/dev/null || echo "no probe log"
                cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null |
                  grep -E "a window of our own|Compose scene created|first frame drawn|marker scene|resize-mode: (monitor|resize frames)|real drag (ready|done)|resize-control: (os|start|swapchain|ready|drag done)" |
                  sort | uniq -c || true
                cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null > "$dir/$label.all.log"
                case "$label" in
                  kn-*-right-*) bash .github/scripts/resize-probe-match.sh "$dir/$label.all.log" "$probe" 2>/dev/null | tail -3 ;;
                esac
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report memory
        # From outside each app (the probe reads its private bytes, working set and the GPU
        # process counters) before the right edge drag, at its peak and settled after it, and
        # from inside it the window's own breakdown (DXC_METRICS memory-breakdown lines).
        if: always()
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          num() { sed -n "s/.*resize-probe: memory $2 .*$3=\([-0-9.]*\).*/\1/p" "$1" | head -1; }
          {
            echo "### Memory, MB (private / working set / GPU local), from outside the app, right edge drags"
            echo "| scale | app | path | rate | start | peak during the drag | settled |"
            echo "|---|---|---|---|---|---|---|"
            for scale in 1x 2x; do
              for path in new old; do
                for rate in 16 8 1; do
                  f="$out/$scale/kn-$path-right-$rate-probe.log"
                  [ -f "$f" ] || continue
                  row="| $scale | kn | $path | $rate ms"
                  for when in start "peak during the drag" settled; do
                    row="$row | $(num "$f" "$when" private_mb) / $(num "$f" "$when" working_set_mb) / $(num "$f" "$when" gpu_local_mb)"
                  done
                  echo "$row |"
                done
              done
            done
            for scale in 1x 2x; do
              echo "### $scale kn (new, right edge, 16 ms): the window's own breakdown"
              echo '```'
              cat "$out/$scale/kn-new-right-16.log" "$out/$scale/kn-new-right-16.log.err" 2>/dev/null |
                grep -E "memory-breakdown|metrics memory|draw texture ->|raster bitmap ->|swapchain on" || echo "none"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-logs/
          retention-days: 14

      - name: Keep the frames and the contact sheets
        # For a person to look at: every frame a verdict is about, as PNG, a contact sheet per
        # drag (frames/<drag>/contact.png) and one frame of each drag (contact-sheet.png).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-frames-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/probe-logs/*/contact-sheet.png
            ${{ runner.temp }}/probe-logs/*/frames/
            ${{ runner.temp }}/probe-logs/*/summary.md
          retention-days: 30

      - name: The probe can tell late from prompt, and the CPU path shows no fault
        # Every check here counts and goes on, so the step lists every failure, not the first.
        #
        # Every drag ran: a verdict that is not ERROR, the Windows version logged, the window
        # at the scale asked for, the move-size loop entered and the lag measured (or, for the
        # window states, each state sent).
        #
        # The control (50 ms late on purpose) must FAIL in every drag, at every rate and scale.
        # Where it passes, the probe cannot tell a late frame from a prompt one on that runner,
        # and nothing it says about hand-check there means anything: that fails the job, it is
        # not reported and passed over. Its frames must also have been late as asked.
        #
        # hand-check with resize frames on the CPU (the default) must PASS every drag: no hole,
        # black, torn, stale, marker gap or stretched frame, judged by the markers, and every
        # CPU step blitted and validated in the same words from the same C. With resize frames
        # on the GPU it must have taken that path; its verdicts are in the summary, not gated.
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          status=0
          [ "${{ steps.scale.outputs.status }}" = 0 ] || { echo "the display did not go to 200%"; status=1; }
          grep -q "effective dpi 192" "$out/set-display-scale.log" || { echo "the display is not at 192 dpi"; status=1; }
          labels=""
          for app_path in kn-new kn-old control-late; do
            for edge in right bottom corner left; do
              for rate in 16 8 1; do labels="$labels $app_path-$edge-$rate"; done
            done
            labels="$labels $app_path-states"
          done
          for scale in 1x 2x; do
            want="$([ $scale = 1x ] && echo "dpi 96 (1.00x)" || echo "dpi 192 (2.00x)")"
            for label in $labels; do
              dir="$out/$scale"
              probe="$dir/$label-probe.log"
              log="$dir/$label.all.log"
              [ -f "$log" ] || cat "$dir/$label.log" "$dir/$label.log.err" > "$log" 2>/dev/null
              verdict="$(grep -h "resize-probe: verdict" "$probe" 2>/dev/null || echo "no verdict")"
              echo "$scale $label: $verdict"
              case "$verdict" in *"verdict PASS"*|*"verdict FAIL"*) ;; *) echo "  the probe did not run"; status=1 ;; esac
              grep -q "^resize-probe: os windows [1-9]" "$probe" 2>/dev/null || { echo "  no Windows version in the probe log"; status=1; }
              grep -qF "px, $want" "$probe" 2>/dev/null || { echo "  the window was not at $want"; status=1; }
              grep -q "^resize-probe: markers at rest" "$probe" 2>/dev/null || { echo "  the markers were not found at rest"; status=1; }
              case "$label" in
                *-states)
                  for state in maximise restore; do
                    grep -qE "^resize-probe: state $state qpc=[0-9]+ sent" "$probe" 2>/dev/null || { echo "  $state was not sent"; status=1; }
                  done
                  for state in left-half back; do
                    grep -qE "^resize-probe: state $state qpc=.* set$" "$probe" 2>/dev/null || { echo "  $state was not set"; status=1; }
                  done
                  ;;
                *)
                  grep -q "move-size loop entered" "$probe" 2>/dev/null || { echo "  no move-size loop"; status=1; }
                  grep -q "^resize-probe: lag frames=[1-9]" "$probe" 2>/dev/null || { echo "  no lag measured"; status=1; }
                  ;;
              esac
              case "$label" in
                kn-new-*)
                  case "$verdict" in *"verdict PASS"*) ;; *) echo "  FAULT: the CPU resize path shows a fault (see the frames)"; status=1 ;; esac
                  grep -qF "hand-check: marker scene" "$log" || { echo "  hand-check did not draw the marker scene"; status=1; }
                  grep -qF "resize-mode: resize frames on the CPU (Skia raster, GDI blit)" "$log" ||
                    { echo "  hand-check did not take the CPU resize path"; status=1; }
                  steps="$(grep -c "resize-proof step" "$log" || true)"
                  bad="$(grep "resize-proof step" "$log" | grep -vcE "presents=0 child_visible=0 blit=1 validated=1$" || true)"
                  echo "  resize-proof steps: $steps, not blitted and validated: $bad"
                  { [ "$steps" -gt 0 ] && [ "$bad" = 0 ]; } || status=1
                  ;;
                kn-old-*)
                  grep -qF "resize-mode: resize frames on the GPU" "$log" ||
                    { echo "  hand-check did not take the GPU resize path"; status=1; }
                  ! grep -q "resize-proof step" "$log" || { echo "  hand-check drew CPU steps with DXC_RASTER_RESIZE=0"; status=1; }
                  ;;
                control-late-*)
                  case "$verdict" in
                    *"verdict FAIL"*) ;;
                    *) echo "  NO DISCRIMINATION: the 50 ms late control passed, so this runner cannot tell late frames from prompt ones here"; status=1 ;;
                  esac
                  steps="$(grep -c "resize-control: step n=" "$log" || true)"
                  prompt="$(grep "resize-control: step n=" "$log" | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^late_ms=/) { split($i, v, "="); if (v[2] + 0 < 45) n++ } } END { print n + 0 }')"
                  echo "  control steps: $steps, less than 45 ms late: $prompt"
                  { [ "$steps" -gt 0 ] && [ "$prompt" = 0 ]; } || status=1
                  ;;
              esac
            done
          done
          exit $status

  macos:
    needs: requested
    name: Kotlin/Native renderer, hand-check under a scripted resize (macOS, arm64)
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restore Compose for macosArm64
        id: kit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-macosarm64-${{ hashFiles('renderer/scripts/build-compose.sh', 'renderer/scripts/compose-fork.changes') }}

      - name: Install a JDK 17 for the Compose build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Compose for macosArm64 from the fork
        if: steps.kit-cache.outputs.cache-hit != 'true'
        run: ./renderer/scripts/build-compose.sh --target macosArm64

      - name: Keep it for the next run
        if: github.event_name != 'pull_request' && (steps.kit-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.kit-cache.outputs.cache-primary-key }}

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the static renderer
        run: ./renderer/desktop/scripts/build-macos.sh

      - name: Build hand-check against the renderer
        run: |
          set -euo pipefail
          export DXC_MACOS_NATIVE_LIB="$PWD/renderer/build/macos"
          cargo build --release --manifest-path compose-rust/tests/fixtures/hand-check/Cargo.toml

      - name: Scripted resize, measured
        run: |
          ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check \
            "$RUNNER_TEMP/resize-metrics" macos-kn
          cat "$RUNNER_TEMP/resize-metrics/macos-kn.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-metrics-macos-kn
          path: ${{ runner.temp }}/resize-metrics/
          retention-days: 14
