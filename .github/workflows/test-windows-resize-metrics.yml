# Windows resize probe and resize metrics. Two parts, told apart by the metrics input.
#
# The gate always runs: every dispatch of ci.yml builds hand-check against the Windows
# renderer kit its windows_static_kit job built in the same run, checks it under a scripted
# resize (windows), then drags that same hand-check from another process (probe). Beside it,
# the GraalVM native image renderer is built from this commit and dragged the same way
# (graalvm-fork-desktop, graalvm, probe-graalvm). Those jobs run, and nothing here can skip
# them except the heavy-checks request that every job waits for. The Kotlin/Native probe job
# fails the suite on a fault; the GraalVM one reports its faults (see probe-graalvm below).
#
# The renderer is not built here. windows-static.yml builds it once per ci.yml run (release,
# as the windows-x64 release asset is built) and uploads it as the windows-static-renderer-kit
# artifact, and this workflow takes that artifact, so what is resized and dragged is the
# renderer that ships rather than a second build of the same commit. Building it here as well
# took almost two hours of a three hour suite. A caller has to have run windows-static.yml
# (part kit or all) in the same run first: ci.yml is the only caller, and its
# test_windows_resize job needs windows_static_kit. Called without that kit, the windows job
# fails at "Receive the renderer kit".
#
# The measurements run only with metrics: true: the timings and summaries that fail
# nothing (the paced and GPU scripted runs, the CPU resize frame draw bench, the release
# link diagnosis, the probe's drag and memory tables) and the macOS job, which only times its
# own scripted resize.
#
# windows: hand-check with DXC_METRICS=1 dirties the heap and takes the window through 100
# scripted sizes, then real modal drags at three mouse rates; the job fails on a probe
# failure, a hit test failure, a CPU resize step that presented or did not validate, or CPU
# and GPU frames that differ. Links hand-check as windows-static.yml's consumer job links an
# application against the kit.
#
# probe: drags the hand-check this run built, on Windows
# Server 2022 and 2025, at 100% and at 200%: its right, bottom and left edges and its bottom
# right corner at three mouse rates, and the window states (maximise, restore, the left half
# of the screen, back), with resize frames on the CPU (the default) and on the GPU
# (DXC_RASTER_RESIZE=0), and the same for resize-control, a window 50 ms late on purpose.
# hand-check draws its marker scene (DXC_RESIZE_MARKER=1), so the probe judges every frame
# against the window's own border: a marker that does not reach it is an area not drawn, a
# marker of another width or a ruler line off its grid a stretched picture. The job fails
# when the control passes anywhere (the probe could not tell a late frame from a prompt one
# there, so nothing it says about hand-check counts) and when hand-check's CPU path shows any
# fault. The frames it kept, and contact sheets of them, are the resize-probe-frames artifact.
# The runners draw with WARP on the Basic Render Driver.
#
# probe-graalvm: the same drags, at the same scales, of the GraalVM native image renderer,
# judged by the same script (.github/scripts/resize-probe-gate.sh) against the same control,
# but REPORTED, not gating (--report-only; compose-rust#687 is the tracker). The GraalVM
# Windows window is not the one a release ships: the Kotlin/Native renderer is, and its probe
# job above stays a gate. Today the GraalVM window prints none of the CPU resize path lines
# (resize-mode, resize-proof step) the gate looks for, and the drags show an occasional
# one-frame gap. The jobs print every verdict, keep the frames and count the drags that showed
# a fault; they still fail when the probe did not run or the control passes, since a report of
# nothing must not pass. They turn strict (the flag comes out) when the window takes and logs
# the CPU resize path as the Kotlin/Native one does and the drags show no faulty frame.
# compose-rust's build links only the static Kotlin/Native kit on Windows, so hand-check cannot
# link the GraalVM image. The C smoke host (renderer/desktop/c/smoke_host.c) can, and with
# DXC_RESIZE_MARKER=1 it draws hand-check's marker scene, record for record, and stays open
# until it is closed. graalvm builds the image with build-native-windows.ps1, from the Compose
# fork's desktop modules graalvm-fork-desktop builds (fork-desktop-modules.yml), links the
# smoke host to it as graalvm\bin\hand-check.exe, where run-probe-v2.ps1 drags it, and keeps
# it as the hand-check-windows-graalvm artifact. That artifact unpacked into the kit's graalvm
# folder adds the GraalVM renderer to a hand run of the kit. Its frames and contact sheets are
# the resize-probe-frames-graalvm artifact. This chain does not wait for the renderer kit, so it
# runs beside the Kotlin/Native one.

name: Resize probe and metrics

on:
  workflow_call:
    inputs:
      metrics:
        description: >-
          Also run the jobs and steps that only measure and report resize timings. The probe
          and the builds it needs run either way.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The toolchain windows-static.yml builds the kit's consumer with, so hand-check links the
  # kit with the same Rust the shipped check links it with.
  RUST_TOOLCHAIN: 1.100.0

jobs:
  # Heavy: runs only when asked for (the run-heavy-ci label on a pull request, or any other
  # event). Every job below needs this one, so a run nobody asked for is skipped whole, and
  # heavy-checks.yml does not count it.
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  windows:
    name: Kotlin/Native renderer, hand-check under a scripted resize (Windows, x64)
    needs: requested
    runs-on: windows-latest
    # Without the renderer build: a release build of hand-check, the scripted resize and three
    # real drags. With metrics, three more release builds of hand-check (the link diagnosis)
    # and the draw bench, up to five minutes for each profile.
    timeout-minutes: ${{ inputs.metrics && 120 || 60 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check symbolic links out as links
        # The renderer module reaches the shared interpreter through symlinks, and Git for
        # Windows checks them out as small text files unless told otherwise. The runner is an
        # administrator, which is what creating one needs.
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"

      - name: Receive the renderer kit
        # Built by windows-static.yml's renderer job in this run (ci.yml's windows_static_kit):
        # the release build the windows-x64 release asset is packaged from.
        uses: actions/download-artifact@v4
        with:
          name: windows-static-renderer-kit
          path: renderer/build/windows

      - name: Enter the Visual Studio developer environment
        # The headers clang compiles our C against, and dumpbin.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          # The tools of the same toolset the headers above belong to: a cl.exe from an older
          # toolset refuses this one's C++ library (STL1001).
          $tools = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"

      - name: Report the machine
        run: |
          uname -a
          echo "CPU: $(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name') x $(nproc) logical"
          rustc -vV
          command -v clang && clang --version || true
          df -h . || true

      - name: Report the renderer kit
        run: |
          ls -la renderer/build/windows renderer/build/windows/*/
          du -sh renderer/build/windows

      - name: Release link, diagnosed
        # Why a release build of an application fails to link the renderer object
        # (LNK1223, invalid .pdata contributions) while a debug build links. rustc passes
        # /OPT:REF,ICF to a release link and /OPT:REF,NOICF to one with debug info, so the
        # same release build is linked three ways, and the object's unwind sections are
        # counted by kind. A diagnosis that judges nothing, and three more builds of
        # hand-check, so only with metrics. The object it reads is the kit's, which the
        # windows-static-renderer-kit artifact keeps.
        if: inputs.metrics
        continue-on-error: true
        run: |
          set -uo pipefail
          export DXC_WINDOWS_NATIVE_LIB="$(cygpath -w "$PWD/renderer/build/windows")"
          manifest=compose-rust/tests/fixtures/hand-check/Cargo.toml
          for variant in default noicf noref; do
            case "$variant" in
              default) flags="" ;;
              noicf) flags="-Clink-arg=/OPT:NOICF" ;;
              noref) flags="-Clink-arg=/OPT:NOREF" ;;
            esac
            if RUSTFLAGS="$flags" CARGO_TARGET_DIR="target/release-link-$variant" \
                cargo build --release --manifest-path "$manifest" > "release-link-$variant.log" 2>&1; then
              echo "release link [$variant: $flags]: ok"
            else
              echo "release link [$variant: $flags]: FAIL"
              grep -m3 -E "LNK1[0-9]+" "release-link-$variant.log" || tail -5 "release-link-$variant.log"
            fi
          done
          archive="$(cygpath -w "$PWD/renderer/build/windows/libcompose_rust_renderer.a")"
          dumpbin -nologo -headers "$archive" > renderer-headers.txt 2>&1 || true
          echo "-- unwind sections in the renderer object, by name and COMDAT kind"
          grep -c "^SECTION HEADER" renderer-headers.txt || true
          grep -A1 "^SECTION HEADER" renderer-headers.txt | grep -oE "\.pdata[^ ]*" | sed 's/\$.*/$NAME/' | sort | uniq -c
          grep -B2 -A12 "^SECTION HEADER" renderer-headers.txt | grep -B3 -A10 " \.pdata$" | head -40 || true

      - name: Build hand-check against the renderer
        # Release: the link that LNK1223 broke (see fix-mingw-objects.py, point 3). The
        # renderer is the kit received above, a release build, so this is the renderer an
        # application links from the windows-x64 release asset.
        run: |
          set -euo pipefail
          export DXC_WINDOWS_NATIVE_LIB="$(cygpath -w "$PWD/renderer/build/windows")"
          cargo build --release --manifest-path compose-rust/tests/fixtures/hand-check/Cargo.toml

      - name: Package hand-check for a check by hand
        run: |
          set -euo pipefail
          package="$(cygpath -u "$RUNNER_TEMP")/hand-check-windows"
          mkdir -p "$package"
          cp compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$package/"
          cat > "$package/README.txt" <<'TEXT'
          hand-check, Kotlin/Native renderer, resize frames on the CPU (commit ${{ github.sha }})

          Run from PowerShell in this folder, keeping the log:

              $env:DXC_REPORT_LATENCY = "1"
              .\hand-check.exe 2>&1 | Tee-Object hand-check.log

          Then check by eye, at 100% and at 200% display scale:
            1. Drag the right edge out and back in, slowly and fast.
            2. Drag the bottom-right corner diagonally out and back in.
            3. Maximise, restore, and snap to half the screen (Win+Left).
            4. Move the window to the other monitor, back again, then repeat 1 to 3.
          A pass is no black, no transparent area and no stretched picture at any edge, in
          any frame. Send hand-check.log with the verdict. To compare with GPU-only resize
          frames, run again with $env:DXC_RASTER_RESIZE = "0".
          TEXT
          sed -i 's/^          //' "$package/README.txt"

      - name: Keep the package
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: hand-check-windows-kn
          path: ${{ runner.temp }}/hand-check-windows/
          retention-days: 30

      - name: The executable is the Kotlin/Native renderer
        run: |
          exe=compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe
          ls -la "$exe"
          echo "graal_create_isolate occurrences: $(grep -a -c graal_create_isolate "$exe" || true)"
          echo "Kotlin/Native runtime strings (kotlin.native): $(grep -a -c 'kotlin.native' "$exe" || true)"
          echo "DLLs it loads:"; dumpbin -nologo -dependents "$(cygpath -w "$exe")" | grep -i "\.dll" || true

      - name: Build the resize probe
        # The probe drags the window from another process and records every composed frame.
        # Built with the MSVC tools entered above; kept as an artifact to run by hand as well.
        run: |
          set -euo pipefail
          dir="$(cygpath -u "$RUNNER_TEMP")/resize-probe"
          mkdir -p "$dir"
          source="$(cygpath -w "$PWD/.github/scripts/resize-probe.c")"
          (cd "$dir" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$source")
          cp .github/scripts/resize-probe-README.txt "$dir/README.txt"
          rm -f "$dir"/*.obj
          ls -la "$dir"

      - name: Keep the resize probe
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-windows
          path: ${{ runner.temp }}/resize-probe/
          retention-days: 30

      - name: Scripted resize, measured
        env:
          DXC_D3D12_WARP: '1'
          DXC_PIXEL_COMPARE: '1'
          DXC_CAPTURE_CHECK: '1'
          DXC_HITTEST_CHECK: '1'
          METRICS: ${{ inputs.metrics }}
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn
          if [ "$METRICS" = true ]; then
            cat "$out/windows-kn.md" >> "$GITHUB_STEP_SUMMARY"
            # Paced: one more composition before each capture, in the test hook. Timings only.
            DXC_CAPTURE_PACE=1 ./.github/scripts/resize-metrics-run.sh \
              compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn-paced
          fi
          # Real modal drags from another process at three mouse rates: 16 ms / 8 px,
          # 8 ms / 4 px and 1 ms / 1 px. The runner has "show window contents while dragging"
          # off, which makes the sizing loop resize only on release, so the probe turns it on
          # for each drag and back off after.
          probe="$(cygpath -u "$RUNNER_TEMP")/resize-probe/resize-probe.exe"
          for rate in "16 8" "8 4" "1 1"; do
            set -- $rate
            ./.github/scripts/resize-real-drag-run.sh \
              compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$probe" "$out" \
              "windows-kn-real-$1" "$1" "$2"
          done
          # Everything below reports and judges nothing; the gate reads windows-kn and the
          # real drags only.
          [ "$METRICS" = true ] || exit 0
          # The same drag with resize frames on the GPU, for comparison.
          DXC_RASTER_RESIZE=0 ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe "$out" windows-kn-gpu
          for label in windows-kn windows-kn-paced windows-kn-gpu; do
            echo "### $label: on-screen capture and hit tests" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "capture step|capture-check|hit-test" "$out/$label.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          for label in windows-kn-real-16 windows-kn-real-8 windows-kn-real-1; do
            echo "### $label: real drag from another process" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -hE "resize-probe: (window|client|move-size|summary|verdict)|real drag (ready|done)" \
              "$out/$label-probe.log" "$out/$label.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Resize frames on the CPU at 200%, each way of drawing them
        if: inputs.metrics
        # Times the scene at the sizes a drag at 200% passes (density 2, 961 to 1157 by 1400
        # pixels), drawn each way the renderer offers, and compares each with the GPU frame.
        # Run a second time with every node's measuring timed by kind, which slows layout
        # and so is kept out of the first run's numbers.
        run: |
          set -uo pipefail
          out="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          mkdir -p "$out"
          cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name') x $(nproc) logical"
          status=0
          for profile in 0 1; do
            log="$out/draw-bench-$profile.log"
            DXC_DRAW_BENCH=1 DXC_LAYOUT_PROFILE=$profile \
              compose-rust/tests/fixtures/hand-check/target/release/hand-check.exe > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 600); do
              grep -q "draw-bench done" "$log" 2>/dev/null && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.5
            done
            kill "$pid" 2>/dev/null || true
            sleep 1
            kill -9 "$pid" 2>/dev/null || true
            {
              echo "### CPU resize frame draw at 200% (layout profile: $profile)"
              echo "CPU: $cpu"
              echo '```'
              grep "draw-bench" "$log" || tail -40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CPU: $cpu"
            grep "draw-bench" "$log" || tail -40 "$log"
            grep -q "draw-bench done" "$log" || status=1
          done
          exit $status

      - name: What is on screen during a resize must be the frame drawn for it
        run: |
          dir="$(cygpath -u "$RUNNER_TEMP")/resize-metrics"
          # The verdict comes from the real modal drags, driven from another process at three
          # mouse rates, which step at the rate DefWindowProc's sizing loop does. The probe
          # judges every frame the compositor showed during the drag: no desktop and no black
          # inside the window, and the window must have changed size. The window must have
          # drawn at least one step. The scripted drags are reported in the summary, not
          # judged here.
          for label in windows-kn-real-16 windows-kn-real-8 windows-kn-real-1; do
            grep -E "resize-probe: verdict" "$dir/$label-probe.log" || { echo "$label: the probe gave no verdict" >&2; exit 1; }
            grep -q "resize-probe: verdict PASS" "$dir/$label-probe.log" || { echo "$label: the probe saw a failure" >&2; exit 1; }
            grep -qE "real drag done steps=[1-9][0-9]* verdict PASS" "$dir/$label.log" ||
              { echo "$label: the window drew no step of the drag" >&2; exit 1; }
          done
          log="$dir/windows-kn-real-16.log"
          grep -E "hit-test verdict" "$dir/windows-kn.log" || { echo "the hit test did not run" >&2; exit 1; }
          ! grep -q "hit-test verdict FAIL" "$dir/windows-kn.log" || exit 1
          # Every CPU resize step: nothing presented since the size change began, the
          # swapchain's child hidden, the frame copied into the window and validated.
          # The window ends the line with when the step ran (" at <ms> ms") since the fork's
          # restore and snap work; both forms are read.
          grep -q "resize-proof step" "$log" || { echo "no resize-proof lines" >&2; exit 1; }
          if grep "resize-proof step" "$log" | grep -vE "presents=0 child_visible=0 blit=1 validated=1( at [0-9.]+ ms)?$"; then
            echo "a resize step presented, left the child visible, or did not copy and validate" >&2
            exit 1
          fi

      - name: CPU and GPU frames must match
        run: |
          log="$(cygpath -u "$RUNNER_TEMP")/resize-metrics/windows-kn.log"
          grep "pixel-compare" "$log" || { echo "no pixel comparison ran" >&2; exit 1; }
          ! grep -q "pixel-compare verdict FAIL" "$log"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-metrics-windows-kn
          path: ${{ runner.temp }}/resize-metrics/
          retention-days: 14

  probe:
    # hand-check as the windows job above built it in this run, so what is dragged is the
    # window code at this commit's pin and never an artifact of an older run.
    needs: windows
    name: Real drags of every edge from the resize probe at 100% and 200% (Windows, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Receive the Kotlin/Native hand-check from this run
        uses: actions/download-artifact@v4
        with:
          name: hand-check-windows-kn
          path: ${{ runner.temp }}/hand-check

      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $tools = $null
          $sdkbin = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
            if ($_ -match '^WindowsSdkVerBinPath=(.*)$') { $sdkbin = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # mt.exe, which the linker runs to embed the probe's manifest.
          Join-Path $sdkbin "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"
          Write-Output "Windows SDK tools: $(Join-Path $sdkbin 'x64')"

      - name: Build the resize probe, the control window and the display scale tool, and lay out the kit
        # The probe's manifest makes it per-monitor DPI aware before any of its code runs; the
        # control window takes the same one, as hand-check is per-monitor aware too.
        run: |
          set -euo pipefail
          kit="$(cygpath -u "$RUNNER_TEMP")/probe-kit"
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          mkdir -p "$kit" "$tools"
          scripts="$(cygpath -w "$PWD/.github/scripts")"
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-probe.c" \
            /link /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          # A GUI program, so that starting it opens no console window: on Server 2025 the
          # console opened beside the window and covered the backdrop the probe looks for.
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-control.c" \
            /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          (cd "$tools" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\set-display-scale.c")
          rm -f "$kit"/*.obj "$tools"/*.obj
          cp "$(cygpath -u "$RUNNER_TEMP")/hand-check/hand-check.exe" "$kit/"
          cp .github/scripts/run-probe-v2.ps1 .github/scripts/run-probe-v2.cmd .github/scripts/resize-contact-sheet.ps1 "$kit/"
          cp .github/scripts/resize-probe-README.txt "$kit/README.txt"
          {
            echo
            echo "This kit, all from commit $GITHUB_SHA (run $GITHUB_RUN_ID)"
            echo "  resize-probe.exe               the probe"
            echo "  resize-control.exe             the control window (50 ms late on purpose)"
            echo "  hand-check.exe                 the Kotlin/Native renderer, built in this run, with the"
            echo "                                 window code of the fork commit renderer/scripts/build-compose.sh pins"
            echo "  run-probe-v2.cmd / .ps1        every drag, the table and the contact sheets"
            echo "  resize-contact-sheet.ps1       the PNG frames and contact sheets, which run-probe-v2 makes"
            echo
            echo "sha256"
            (cd "$kit" && sha256sum hand-check.exe resize-probe.exe resize-control.exe)
          } >> "$kit/README.txt"
          ls -la "$kit"
          sha256sum "$kit"/*.exe

      - name: Keep the probe kit
        # hand-check, the control and the probe, for run-probe-v2.cmd on a real machine. One kit,
        # from one runner: the executables are the same on both.
        if: matrix.os == 'windows-2025'
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-kit-windows
          path: ${{ runner.temp }}/probe-kit/
          if-no-files-found: error
          retention-days: 30

      - name: Real drags at 100%
        # The kit's own script, as a person runs it. The runner has no graphics card, so
        # hand-check and the control draw with WARP.
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/1x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -StatesRuns 25 -Out "$out"

      - name: Set the display to 200%
        # The runner's display is 1024x768, where Windows offers no scale but 100%, and
        # 1920x1080 stops at 175%: the scale tool picks the largest mode that offers 200%.
        id: scale
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          mkdir -p "$out"
          set +e
          "$tools/set-display-scale.exe" 200 --fit > "$out/set-display-scale.log" 2>&1
          status=$?
          cat "$out/set-display-scale.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "set-display-scale exit $status"

      - name: Real drags at 200%
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/2x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -StatesRuns 25 -Out "$out"

      - name: Report the drags
        # The table run-probe-v2 wrote for each scale, then each drag's own lines.
        if: always() && inputs.metrics
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          results="$out/results-${{ matrix.os }}.md"
          {
            echo "## ${{ matrix.os }}"
            for scale in 1x 2x; do
              echo
              echo "### $scale"
              echo
              cat "$out/$scale/summary.md" 2>/dev/null | tr -d '\r' | sed 's/^\xEF\xBB\xBF//' || echo "no summary"
            done
          } > "$results"
          {
            cat "$results"
            echo
            echo "### Display scale"
            echo '```'
            cat "$out/set-display-scale.log" 2>/dev/null || echo "no set-display-scale log"
            echo '```'
            for scale in 1x 2x; do
              dir="$out/$scale"
              for probe in "$dir"/*-probe.log; do
                [ -f "$probe" ] || continue
                label="$(basename "$probe" -probe.log)"
                echo "### $scale $label"
                echo '```'
                grep -hE "resize-probe: (os|dpi awareness|duplicating|placed|moved|window|  |client|scan box|stale reference|markers|move-size|state|minimise|lag|summary|verdict)" \
                  "$probe" 2>/dev/null || echo "no probe log"
                cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null |
                  grep -E "a window of our own|Compose scene created|first frame drawn|marker scene|resize-mode: (monitor|resize frames)|real drag (ready|done)|resize-control: (os|start|swapchain|ready|drag done)" |
                  sort | uniq -c || true
                cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null > "$dir/$label.all.log"
                case "$label" in
                  kn-*-right-*) bash .github/scripts/resize-probe-match.sh "$dir/$label.all.log" "$probe" 2>/dev/null | tail -3 ;;
                esac
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report memory
        # From outside each app (the probe reads its private bytes, working set and the GPU
        # process counters) before the right edge drag, at its peak and settled after it, and
        # from inside it the window's own breakdown (DXC_METRICS memory-breakdown lines).
        if: always() && inputs.metrics
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          num() { sed -n "s/.*resize-probe: memory $2 .*$3=\([-0-9.]*\).*/\1/p" "$1" | head -1; }
          {
            echo "### Memory, MB (private / working set / GPU local), from outside the app, right edge drags"
            echo "| scale | app | path | rate | start | peak during the drag | settled |"
            echo "|---|---|---|---|---|---|---|"
            for scale in 1x 2x; do
              for path in new old; do
                for rate in 16 8 1; do
                  f="$out/$scale/kn-$path-right-$rate-probe.log"
                  [ -f "$f" ] || continue
                  row="| $scale | kn | $path | $rate ms"
                  for when in start "peak during the drag" settled; do
                    row="$row | $(num "$f" "$when" private_mb) / $(num "$f" "$when" working_set_mb) / $(num "$f" "$when" gpu_local_mb)"
                  done
                  echo "$row |"
                done
              done
            done
            for scale in 1x 2x; do
              echo "### $scale kn (new, right edge, 16 ms): the window's own breakdown"
              echo '```'
              cat "$out/$scale/kn-new-right-16.log" "$out/$scale/kn-new-right-16.log.err" 2>/dev/null |
                grep -E "memory-breakdown|metrics memory|draw texture ->|raster bitmap ->|swapchain on" || echo "none"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-logs/
          retention-days: 14

      - name: Keep the frames and the contact sheets
        # For a person to look at: every frame a verdict is about, as PNG, a contact sheet per
        # drag (frames/<drag>/contact.png) and one frame of each drag (contact-sheet.png).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-frames-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/probe-logs/*/contact-sheet.png
            ${{ runner.temp }}/probe-logs/*/frames/
            ${{ runner.temp }}/probe-logs/*/summary.md
          retention-days: 30

      - name: The probe can tell late from prompt, and the CPU path shows no fault
        # The control (50 ms late on purpose) must FAIL every drag, at every rate and scale, or
        # nothing the probe says about hand-check on this runner counts. hand-check with resize
        # frames on the CPU must PASS every drag, and its window states must show a faulty frame
        # on at most 10% of 25 runs of 4 size changes at each scale. The script says what each
        # check is and why, and lists every failure, not the first.
        env:
          RUNNER_OS_LABEL: ${{ matrix.os }}
          SCALE_STATUS: ${{ steps.scale.outputs.status }}
        run: bash .github/scripts/resize-probe-gate.sh kn

  # The Compose fork's desktop modules, which the GraalVM renderer's desktop module asks for by
  # version. Under a name of their own: other workflows ci.yml calls into the same run upload
  # compose-fork-desktop, and a run holds one artifact of a name.
  graalvm-fork-desktop:
    needs: requested
    name: Build the Compose fork's desktop modules for the GraalVM renderer
    uses: ./.github/workflows/fork-desktop-modules.yml
    with:
      artifact: compose-fork-desktop-resize-probe

  graalvm:
    # Built as test-native-renderer.yml's Windows job builds it, from this commit, so what is
    # dragged is the window code at this commit's pin.
    needs: graalvm-fork-desktop
    name: GraalVM renderer and the smoke host with the marker scene (Windows, x64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check symbolic links out as links
        # The renderer module reaches the shared interpreter through symlinks, and
        # build-native-windows.ps1 stops when they are text files.
        shell: bash
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Install upstream GraalVM 25
        # As test-native-renderer.yml's Windows job does.
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the Compose fork's desktop modules
        uses: actions/download-artifact@v4
        with:
          name: compose-fork-desktop-resize-probe
          path: ${{ runner.temp }}/compose-fork-desktop

      - name: Put them where the renderer's build looks
        shell: bash
        run: |
          mkdir -p ~/.m2/repository/org/jetbrains
          cp -R "$RUNNER_TEMP/compose-fork-desktop/." ~/.m2/repository/org/

      - name: Build the GraalVM Windows renderer
        id: renderer-build
        shell: powershell
        run: .\renderer\desktop\scripts\build-native-windows.ps1

      - name: Non-interactive Windows smoke test
        # The smoke host's default tree on this image: it starts, draws, measures and exits 0,
        # so the marker scene below is the only thing the probe run adds.
        shell: powershell
        run: .\renderer\desktop\scripts\smoke-test-windows.ps1

      - name: The linked image carries no toolkit
        # Run whatever the smoke test said, so a run shows every way it fails.
        if: ${{ !cancelled() && steps.renderer-build.outcome == 'success' }}
        shell: bash
        run: bash scripts/tests/renderer/windows-image-has-no-awt.test.sh renderer/build/native-image/dist/bin

      - name: The image's ways into the toolkit
        # The check is Python, and Windows' Python is python.exe only.
        if: ${{ !cancelled() && steps.renderer-build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/python3"
          cp "$(command -v python)" "$RUNNER_TEMP/python3/python3.exe"
          PATH="$RUNNER_TEMP/python3:$PATH" bash scripts/tests/renderer/linux-image-toolkit-boundary.test.sh renderer/build/native-image/dist/bin

      - name: The renderer holds the resize code the probe judges
        # The lines the gate reads from the application's log, compiled in from the fork's
        # window C.
        shell: bash
        run: |
          set -euo pipefail
          dll=renderer/build/native-image/dist/bin/libcompose_rust_renderer.dll
          ls -la "$dll"
          for text in "on the CPU (Skia raster, GDI blit)" "resize-proof step"; do
            echo "\"$text\" in the renderer: $(grep -a -c -F "$text" "$dll" || true)"
            grep -a -q -F "$text" "$dll"
          done

      - name: Enter the Visual Studio developer environment
        # cl.exe and link.exe ahead of Git Bash's own link, and mt.exe, which the linker runs
        # to embed the manifest.
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $tools = $null
          $sdkbin = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
            if ($_ -match '^WindowsSdkVerBinPath=(.*)$') { $sdkbin = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Join-Path $sdkbin "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"

      - name: Link the smoke host to the renderer as graalvm\bin\hand-check.exe
        # bin\ holds the renderer, its libraries and the smoke host; lib\ beside bin\ is where
        # the renderer looks for the files java.home names. The smoke host is a GUI program, so
        # that starting it opens no console window over the backdrop the probe looks for, and
        # takes the probe's manifest, per-monitor DPI aware from the start, as hand-check's
        # window is. Its exports make a .lib and .exp beside it, which nothing needs; the
        # build's analysis reports are left out too.
        shell: bash
        run: |
          set -euo pipefail
          package="$(cygpath -u "$RUNNER_TEMP")/graalvm"
          dist=renderer/build/native-image/dist
          mkdir -p "$package/bin" "$package/lib"
          cp -r "$dist/bin/." "$package/bin/"
          [ ! -d "$dist/lib" ] || cp -r "$dist/lib/." "$package/lib/"
          rm -rf "$package/bin/reports"
          bin="$(cygpath -w "$PWD/$dist/bin")"
          source="$(cygpath -w "$PWD/renderer/desktop/c/smoke_host.c")"
          manifest="$(cygpath -w "$PWD/.github/scripts/resize-probe.manifest")"
          (cd "$package/bin" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 /Fehand-check.exe "$source" \
            /link "/LIBPATH:$bin" libcompose_rust_renderer.lib \
            /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup /MANIFEST:EMBED "/MANIFESTINPUT:$manifest")
          rm -f "$package/bin"/*.obj "$package/bin/hand-check.lib" "$package/bin/hand-check.exp"
          {
            echo "graalvm\\bin\\hand-check.exe: the C smoke host (renderer/desktop/c/smoke_host.c) linked to"
            echo "the GraalVM native image renderer, both from commit $GITHUB_SHA (run $GITHUB_RUN_ID)."
            echo "With DXC_RESIZE_MARKER=1 it draws hand-check's marker scene. Unpack this artifact into"
            echo "the resize probe kit's graalvm folder, and run-probe-v2.cmd drags it as well."
          } > "$package/README.txt"
          ls -la "$package/bin" "$package/lib"
          du -sh "$package"
          sha256sum "$package/bin/hand-check.exe" "$package/bin/libcompose_rust_renderer.dll"

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: hand-check-windows-graalvm
          path: ${{ runner.temp }}/graalvm/
          if-no-files-found: error
          retention-days: 14

  probe-graalvm:
    # The GraalVM renderer graalvm built in this run, dragged exactly as the probe job drags
    # hand-check: the same kit script, edges, rates, scales and window state runs, beside the
    # same control, judged by the same script.
    needs: graalvm
    name: GraalVM renderer, real drags of every edge from the resize probe at 100% and 200%, reported, not gating (Windows, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Receive the GraalVM renderer and the smoke host from this run
        uses: actions/download-artifact@v4
        with:
          name: hand-check-windows-graalvm
          path: ${{ runner.temp }}/probe-kit/graalvm

      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $tools = $null
          $sdkbin = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
            if ($_ -match '^WindowsSdkVerBinPath=(.*)$') { $sdkbin = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # mt.exe, which the linker runs to embed the probe's manifest.
          Join-Path $sdkbin "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"
          Write-Output "Windows SDK tools: $(Join-Path $sdkbin 'x64')"

      - name: Build the resize probe, the control window and the display scale tool, and lay out the kit
        # As the probe job builds them. The kit holds no hand-check.exe, so run-probe-v2.ps1
        # drags graalvm\bin\hand-check.exe and the control, all that are present.
        run: |
          set -euo pipefail
          kit="$(cygpath -u "$RUNNER_TEMP")/probe-kit"
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          mkdir -p "$kit" "$tools"
          scripts="$(cygpath -w "$PWD/.github/scripts")"
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-probe.c" \
            /link /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-control.c" \
            /link /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          (cd "$tools" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\set-display-scale.c")
          rm -f "$kit"/*.obj "$tools"/*.obj
          cp .github/scripts/run-probe-v2.ps1 .github/scripts/run-probe-v2.cmd .github/scripts/resize-contact-sheet.ps1 "$kit/"
          [ ! -e "$kit/hand-check.exe" ] || { echo "the GraalVM kit must not hold the Kotlin/Native hand-check.exe" >&2; exit 1; }
          [ -f "$kit/graalvm/bin/hand-check.exe" ] || { echo "graalvm/bin/hand-check.exe is missing" >&2; exit 1; }
          ls -la "$kit" "$kit/graalvm/bin" | head -60
          sha256sum "$kit"/*.exe "$kit/graalvm/bin/hand-check.exe"

      - name: Real drags at 100%
        # The runner has no graphics card, so the renderer and the control draw with WARP.
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/1x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -StatesRuns 25 -Apps graalvm,control -Out "$out"

      - name: Set the display to 200%
        id: scale
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          mkdir -p "$out"
          set +e
          "$tools/set-display-scale.exe" 200 --fit > "$out/set-display-scale.log" 2>&1
          status=$?
          cat "$out/set-display-scale.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "set-display-scale exit $status"

      - name: Real drags at 200%
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/2x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -StatesRuns 25 -Apps graalvm,control -Out "$out"

      - name: Report the drags
        # The table run-probe-v2 wrote for each scale.
        if: always() && inputs.metrics
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          {
            echo "## GraalVM, ${{ matrix.os }}"
            for scale in 1x 2x; do
              echo
              echo "### $scale"
              echo
              cat "$out/$scale/summary.md" 2>/dev/null | tr -d '\r' | sed 's/^\xEF\xBB\xBF//' || echo "no summary"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-logs-graalvm-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-logs/
          retention-days: 14

      - name: Keep the frames and the contact sheets
        # Every frame a verdict is about, as PNG, a contact sheet per drag
        # (frames/<drag>/contact.png) and one frame of each drag (contact-sheet.png).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-frames-graalvm-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/probe-logs/*/contact-sheet.png
            ${{ runner.temp }}/probe-logs/*/frames/
            ${{ runner.temp }}/probe-logs/*/summary.md
          retention-days: 30

      - name: The probe can tell late from prompt, and the GraalVM CPU path shows no fault
        # The same verdict as the probe job's, for the GraalVM renderer, but reported: the
        # window's faults are printed and counted and do not fail the job (--report-only). A
        # probe that did not run, or a control that passes, still fails it. The script says
        # what each check is and why.
        env:
          RUNNER_OS_LABEL: ${{ matrix.os }}
          SCALE_STATUS: ${{ steps.scale.outputs.status }}
        run: bash .github/scripts/resize-probe-gate.sh graalvm --report-only

  # Measurement only: times the same scripted resize on macOS and asserts nothing.
  macos:
    needs: requested
    if: inputs.metrics
    name: Kotlin/Native renderer, hand-check under a scripted resize (macOS, arm64)
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restore Compose for macosArm64
        id: kit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-macosarm64-${{ hashFiles('renderer/scripts/build-compose.sh', 'renderer/scripts/compose-fork.changes') }}

      - name: Install a JDK 17 for the Compose build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the fork build's Gradle downloads
        id: gradle-downloads
        # What the fork's Gradle build fetched, so a miss on the published Compose does not
        # fetch it all again from Maven Central, which rate-limits runners (429). An older key
        # is taken when build-compose.sh changed: Gradle then fetches only what moved.
        if: steps.kit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-downloads-macosarm64-${{ hashFiles('renderer/scripts/build-compose.sh') }}
          restore-keys: |
            gradle-downloads-macosarm64-

      - name: Build Compose for macosArm64 from the fork
        if: steps.kit-cache.outputs.cache-hit != 'true'
        run: ./renderer/scripts/build-compose.sh --target macosArm64

      - name: Keep the fork build's Gradle downloads for the next run
        if: github.event_name != 'pull_request' && steps.gradle-downloads.outputs.cache-hit != 'true' && steps.kit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-downloads.outputs.cache-primary-key }}

      - name: Keep it for the next run
        if: github.event_name != 'pull_request' && (steps.kit-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.kit-cache.outputs.cache-primary-key }}

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the static renderer
        run: ./renderer/desktop/scripts/build-macos.sh

      - name: Build hand-check against the renderer
        run: |
          set -euo pipefail
          export DXC_MACOS_NATIVE_LIB="$PWD/renderer/build/macos"
          cargo build --release --manifest-path compose-rust/tests/fixtures/hand-check/Cargo.toml

      - name: Scripted resize, measured
        run: |
          ./.github/scripts/resize-metrics-run.sh \
            compose-rust/tests/fixtures/hand-check/target/release/hand-check \
            "$RUNNER_TEMP/resize-metrics" macos-kn
          cat "$RUNNER_TEMP/resize-metrics/macos-kn.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-metrics-macos-kn
          path: ${{ runner.temp }}/resize-metrics/
          retention-days: 14
