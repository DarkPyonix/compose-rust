# The Compose fork's desktop modules and its patched skiko-awt, built once and handed to the
# jobs that compile the renderer's desktop module. They are published under the fork's own
# coordinates (org.thisisthepy.compose, and skiko-awt at a version of its own; see
# renderer/scripts/build-compose.sh), and the desktop module asks for those by name, so every
# job that builds it needs them in ~/.m2 first. Call this as a job and download the artifact
# `compose-fork-desktop` into ~/.m2/repository/org.
#
# A run holds one artifact of a name, and ci.yml calls several workflows into one run, so a
# caller that may share a run with another one passes `artifact` to upload under a name of its
# own, and downloads that name.
#
# The same steps run in the compose-desktop job of test-graalvm-renderer.yml, which keeps its
# own copy so that its check keeps its name.
name: Build the fork's desktop modules

on:
  workflow_call:
    inputs:
      artifact:
        description: The name the modules are uploaded under
        type: string
        default: compose-fork-desktop

permissions:
  contents: read

jobs:
  build:
    name: Build the Compose fork's desktop modules (reusable)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Report the machine
        run: echo "ANDROID_HOME=${ANDROID_HOME:?the runner image has no Android SDK}"

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Point the Compose build at the JDK
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Configure Gradle for this runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          systemProp.org.gradle.internal.repository.max.retries=6
          systemProp.org.gradle.internal.repository.initial.backoff=1000
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          EOF

      - name: Build and publish the desktop modules
        env:
          DXC_COMPOSE_BUILD: ${{ github.workspace }}/../compose-build
        run: |
          rm -rf ~/.m2/repository
          for attempt in 1 2 3; do
            if ./renderer/scripts/build-compose.sh --target desktop --clean; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "build-compose.sh failed on attempt $attempt; retrying in $((attempt * 15))s..." >&2
            sleep $((attempt * 15))
          done
          # skiko-awt with the switch that keeps UIManager out of a toolkit-free image.
          # The fork publishes it under a version of its own, so no cache of upstream's can shadow it.
          ./scripts/publish-skiko-awt.sh "$RUNNER_TEMP/skiko-awt"
          find ~/.m2/repository/org/thisisthepy/compose -name '*.jar' | sort

      - name: Mark the artifact root
        # upload-artifact roots the artifact at the common parent of its paths. skiko-awt now
        # sits inside org/thisisthepy/compose, so this marker keeps the root at org, and the
        # download into ~/.m2/repository/org restores the org/thisisthepy/compose prefix.
        run: touch ~/.m2/repository/org/.compose-fork-desktop

      - name: Keep the published modules
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          include-hidden-files: true
          path: |
            ~/.m2/repository/org/thisisthepy/compose
            ~/.m2/repository/org/.compose-fork-desktop
          retention-days: 7
