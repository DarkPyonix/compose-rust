# The Compose fork's desktop modules and its patched skiko-awt, built once and handed to the
# jobs that compile the renderer's desktop module. They are published under versions of their
# own (see renderer/scripts/build-compose.sh), and the desktop module asks for those by name,
# so every job that builds it needs them in ~/.m2 first. Call this as a job and download the
# artifact `compose-fork-desktop` into ~/.m2/repository/org/jetbrains.
#
# The same steps run in the compose-desktop job of test-graalvm-renderer.yml, which keeps its
# own copy so that its check keeps its name.
name: Build the fork's desktop modules

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build the Compose fork's desktop modules (reusable)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Report the machine
        run: echo "ANDROID_HOME=${ANDROID_HOME:?the runner image has no Android SDK}"

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Point the Compose build at the JDK
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Configure Gradle for this runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build and publish the desktop modules
        env:
          DXC_COMPOSE_BUILD: ${{ github.workspace }}/../compose-build
        run: |
          rm -rf ~/.m2/repository
          ./renderer/scripts/build-compose.sh --target desktop --clean
          # skiko-awt with the switch that keeps UIManager out of a toolkit-free image.
          # It is published under a version of its own, so no cache of upstream's can shadow it.
          ./scripts/publish-skiko-awt.sh "$RUNNER_TEMP/skiko-awt"
          find ~/.m2/repository/org/jetbrains/compose -name '*.jar' | sort

      - name: Keep the published modules
        uses: actions/upload-artifact@v4
        with:
          name: compose-fork-desktop
          path: |
            ~/.m2/repository/org/jetbrains/compose
            ~/.m2/repository/org/jetbrains/skiko/skiko-awt
          retention-days: 7
