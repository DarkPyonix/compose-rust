# Static renderer: one platform's Kotlin/Native renderer, built and packaged exactly as the
# release carries it.
#
# Called, not run on its own. native-renderer.yml calls it for the release and for the
# check that an application built on it is one executable; samples.yml calls it so that
# every sample on macOS and Linux is one executable too. One definition, so the two cannot
# drift into building different things.
#
#   macos-aarch64  Kotlin/Native over AppKit and Metal, built on macOS.
#   linux-x64      Kotlin/Native over Xlib and GLX.
#   linux-arm64    the same, cross compiled on x86-64: Kotlin/Native publishes no arm64 Linux
#                  host. The module's test executable is linked as part of the build, against
#                  arm64 X11, GL and font libraries from Ubuntu's arm64 ports archive.
#
# Compose is built first from the pinned fork, for the modules each platform needs that
# JetBrains does not publish, and cached on exactly the inputs that decide it. Linux builds
# it for both architectures at once, because the renderer's Linux module declares both and
# the toolchain resolves every platform a module declares, even when it builds one.
#
# The artifact is uploaded under the release asset's own name,
# compose-rust-renderer-v<crate version>-<target>, holding the .tar.gz and its .sha256.

name: Static renderer

on:
  workflow_call:
    inputs:
      target:
        description: macos-aarch64, linux-x64 or linux-arm64
        required: true
        type: string
      ref:
        description: The commit to build. Empty means the one the caller runs on.
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: The artifact's name, which is also the release asset's
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target }} static renderer
    runs-on: ${{ inputs.target == 'macos-aarch64' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    outputs:
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Work out what this target needs
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            macos-aarch64)
              compose=macosArm64; script="build-macos.sh --release"; out=macos
              toolchain="$HOME/Library/Caches/JetBrains/Kotlin"; heap=5g; workers=2 ;;
            linux-x64)
              compose=linux; script="build-linux.sh --release"; out=linux
              toolchain="$HOME/.cache/JetBrains/Kotlin"; heap=11g; workers=4 ;;
            linux-arm64)
              compose=linux; script="build-linux.sh --release --arch arm64"; out=linux-arm64
              toolchain="$HOME/.cache/JetBrains/Kotlin"; heap=11g; workers=4 ;;
            *)
              echo "no static renderer for '${{ inputs.target }}'" >&2
              exit 1 ;;
          esac
          {
            echo "compose=$compose"
            echo "compose_key=$(tr '[:upper:]' '[:lower:]' <<< "$compose")"
            echo "script=$script"
            echo "out=$out"
            echo "toolchain=$toolchain"
            echo "heap=$heap"
            echo "workers=$workers"
          } >> "$GITHUB_OUTPUT"

      - name: Make room for the Compose build
        # Its checkout and Gradle outputs take several gigabytes. These are toolchains the
        # job never uses; the Android SDK stays, because Compose's Gradle build reads it.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install JDK 21 for the Compose build
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Point the Compose build at the JDK
        # The Compose build turns toolchain detection off and takes its JDK 21 from this.
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install the X11, GL and font headers the window and Skia compile against
        if: inputs.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config unzip \
            libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Install the X11, GL and font headers, and the arm64 libraries to link against
        if: inputs.target == 'linux-arm64'
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # The runner's archive serves amd64 only; arm64 packages come from the ports
          # archive, so each source says which architecture it is for.
          for sources in /etc/apt/sources.list.d/*.sources; do
            sudo sed -i '/^Types: deb$/a Architectures: amd64' "$sources"
          done
          [[ ! -f /etc/apt/sources.list ]] ||
            sudo sed -i 's/^deb \(http\)/deb [arch=amd64] \1/' /etc/apt/sources.list
          printf '%s\n' 'Types: deb' 'URIs: http://ports.ubuntu.com/ubuntu-ports' \
            'Suites: noble noble-updates noble-security' 'Components: main universe' \
            'Architectures: arm64' | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config unzip binutils-aarch64-linux-gnu \
            libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev:arm64 libxext-dev:arm64 libgl-dev:arm64 \
            libfontconfig-dev:arm64 libfreetype-dev:arm64

      - name: Restore the patched Compose
        id: compose-cache
        # Restored and saved as two steps, so a build that fails after Compose has been
        # published still keeps it, and the next attempt does not spend the time again.
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-${{ steps.target.outputs.compose_key }}-${{ hashFiles('renderer/scripts/build-compose.sh', 'renderer/scripts/compose-fork.changes') }}

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.target.outputs.toolchain }}
            ~/.konan
          key: kotlin-native-${{ inputs.target }}-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-${{ inputs.target }}-

      - name: Configure Gradle for this runner
        if: steps.compose-cache.outputs.cache-hit != 'true'
        # The heap the Compose build asks for is sized for a workstation.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.workers.max=${{ steps.target.outputs.workers }}
          org.gradle.jvmargs=-Xmx${{ steps.target.outputs.heap }} -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build and publish the patched Compose
        if: steps.compose-cache.outputs.cache-hit != 'true'
        env:
          DXC_COMPOSE_BUILD: ${{ runner.temp }}/compose-build
        run: ./renderer/scripts/build-compose.sh --target ${{ steps.target.outputs.compose }}

      - name: Keep the patched Compose for the next run
        if: steps.compose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.compose-cache.outputs.cache-primary-key }}

      - name: Build the static renderer
        run: ./renderer/desktop/scripts/${{ steps.target.outputs.script }}

      - name: Keep the renderer build's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-static-renderer-logs
          path: renderer/build/${{ steps.target.outputs.out }}-logs/
          retention-days: 7

      - name: Package it the way the release carries it
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' compose-rust/Cargo.toml | head -1)"
          dir="renderer/build/${{ steps.target.outputs.out }}"
          ls -la "$dir"
          ./scripts/package-static-renderer.sh "$dir" "${{ inputs.target }}" "$version" "$RUNNER_TEMP/artifact"
          echo "name=compose-rust-renderer-v$version-${{ inputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7
