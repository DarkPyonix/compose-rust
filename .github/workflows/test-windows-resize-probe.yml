# Windows resize probe test: real drags of hand-check's right edge from resize-probe, a separate
# process, at 100% and at 200% display scale, with resize frames on the CPU (the default) and on
# the GPU (DXC_RASTER_RESIZE=0), each at three mouse rates.
#
# The Kotlin/Native hand-check.exe is the one the Resize metrics workflow built in run
# 38807049709, so its two-hour build is not repeated. It runs under the same run-probe-v2.ps1
# the kit hands to a person.
#
# What this shows is that the probe works on the runner: the drag happens, the widths change,
# the backdrop shows, and the app takes the resize path asked for. It is not a resize verdict:
# the runner draws with WARP on the Basic Render Driver; that verdict comes from a real machine.

name: Windows resize probe test

on:
  workflow_dispatch:
  # A new workflow cannot be dispatched until it is on the default branch, so it also runs
  # on the pull request that changes it.
  pull_request:
    # Only when asked: the run-heavy-ci label going on, or a push or reopen while it is on.
    # The request job below decides; heavy-checks.yml holds the merge until it has passed.
    types: [synchronize, reopened, labeled]
    paths:
      - ".github/workflows/test-windows-resize-probe.yml"
      - ".github/scripts/resize-probe.c"
      - ".github/scripts/resize-probe.manifest"
      - ".github/scripts/resize-probe-README.txt"
      - ".github/scripts/resize-probe-match.sh"
      - ".github/scripts/run-probe-v2.ps1"
      - ".github/scripts/run-probe-v2.cmd"
      - ".github/scripts/set-display-scale.c"
      - "renderer/desktop/c/win32_window.c"

concurrency:
  # One run per pull request: a new commit cancels the older run. Pushes to develop,
  # dispatches and tag runs are never cancelled.
  group: test-windows-resize-probe-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-heavy-ci' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # To download hand-check from the earlier run.
  actions: read

env:
  # The run whose Kotlin/Native hand-check.exe (artifact hand-check-windows-kn) this tests.
  HAND_CHECK_RUN: "38807049709"

jobs:
  # Heavy: runs only when asked for (the run-heavy-ci label on a pull request, or any other
  # event). Every job below needs this one, so a run nobody asked for is skipped whole, and
  # heavy-checks.yml does not count it.
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  probe:
    needs: requested
    name: Real drags from the resize probe at 100% and 200% (Windows, x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Receive the Kotlin/Native hand-check from the earlier run
        uses: actions/download-artifact@v4
        with:
          name: hand-check-windows-kn
          run-id: ${{ env.HAND_CHECK_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hand-check

      - name: Enter the Visual Studio developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $tools = $null
          $sdkbin = $null
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
            if ($_ -match '^VCToolsInstallDir=(.*)$') { $tools = $matches[1] }
            if ($_ -match '^WindowsSdkVerBinPath=(.*)$') { $sdkbin = $matches[1] }
          }
          $bin = Join-Path $tools "bin\Hostx64\x64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # mt.exe, which the linker runs to embed the probe's manifest.
          Join-Path $sdkbin "x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "MSVC tools: $bin"
          Write-Output "Windows SDK tools: $(Join-Path $sdkbin 'x64')"

      - name: Build the resize probe and the display scale tool, and lay out the kit
        # The probe's manifest makes it per-monitor DPI aware before any of its code runs.
        run: |
          set -euo pipefail
          kit="$(cygpath -u "$RUNNER_TEMP")/probe-kit"
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          mkdir -p "$kit" "$tools"
          scripts="$(cygpath -w "$PWD/.github/scripts")"
          (cd "$kit" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\resize-probe.c" \
            /link /MANIFEST:EMBED "/MANIFESTINPUT:$scripts\\resize-probe.manifest")
          (cd "$tools" && MSYS_NO_PATHCONV=1 cl /nologo /O2 /W3 "$scripts\\set-display-scale.c")
          rm -f "$kit"/*.obj "$tools"/*.obj
          cp "$(cygpath -u "$RUNNER_TEMP")/hand-check/hand-check.exe" "$kit/"
          cp .github/scripts/run-probe-v2.ps1 .github/scripts/run-probe-v2.cmd "$kit/"
          cp .github/scripts/resize-probe-README.txt "$kit/README.txt"
          {
            echo
            echo "This kit"
            echo "  resize-probe.exe               the probe, from commit $GITHUB_SHA"
            echo "  hand-check.exe                 the Kotlin/Native renderer, PRE-MERGE: built in run $HAND_CHECK_RUN"
            echo "                                 from commit 2332cd29, before develop was merged into this branch."
            echo "      It lacks, against this commit: the letter and digit keys (Ctrl+A, Ctrl+C,"
            echo "      Ctrl+V, Ctrl+X and Ctrl+Z reach Compose as unknown keys, so expect those to fail in it),"
            echo "      the window start lines, and everything develop brought since. Its resize path in"
            echo "      win32_window.c is the same as this commit's (the merge left those functions unchanged)."
            echo
            echo "sha256"
            (cd "$kit" && sha256sum hand-check.exe resize-probe.exe)
          } >> "$kit/README.txt"
          ls -la "$kit"
          sha256sum "$kit"/*.exe

      - name: Keep the probe kit
        # Both apps and the probe, for run-probe-v2.cmd on a real machine.
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-kit-windows
          path: ${{ runner.temp }}/probe-kit/
          if-no-files-found: error
          retention-days: 30

      - name: Real drags at 100%
        # The kit's own script, as a person runs it. The runner has no graphics card, so both
        # renderers draw with WARP.
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/1x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -Out "$out"

      - name: Set the display to 200%
        # The runner's display is 1024x768, where Windows offers no scale but 100%, and
        # 1920x1080 stops at 175%: the scale tool picks the largest mode that offers 200%.
        id: scale
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/tools"
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          mkdir -p "$out"
          set +e
          "$tools/set-display-scale.exe" 200 --fit > "$out/set-display-scale.log" 2>&1
          status=$?
          cat "$out/set-display-scale.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "set-display-scale exit $status"

      - name: Real drags at 200%
        env:
          DXC_D3D12_WARP: '1'
        run: |
          kit="$(cygpath -w "$RUNNER_TEMP/probe-kit")"
          out="$(cygpath -w "$RUNNER_TEMP/probe-logs/2x")"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$kit\\run-probe-v2.ps1" -NoPause -Out "$out"

      - name: Report the drags
        if: always()
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          {
            echo "These show that the probe and both apps work here; they are not a resize verdict."
            echo "### Display scale"
            echo '```'
            cat "$out/set-display-scale.log" 2>/dev/null || echo "no set-display-scale log"
            echo '```'
            for scale in 1x 2x; do
              for app in kn; do
                for path in new old; do
                  for rate in 16 8 1; do
                    label="$app-$path-$rate"
                    dir="$out/$scale"
                    echo "### $scale $label"
                    echo '```'
                    grep -hE "resize-probe: (dpi awareness|duplicating|placed|window|  |client|move-size|summary|verdict)" \
                      "$dir/$label-probe.log" 2>/dev/null || echo "no probe log"
                    cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null |
                      grep -E "a window of our own|Compose scene created|first frame drawn|resize-mode: (monitor|resize frames)|real drag (ready|done)" |
                      sort | uniq -c || true
                    cat "$dir/$label.log" "$dir/$label.log.err" 2>/dev/null > "$dir/$label.all.log"
                    bash .github/scripts/resize-probe-match.sh "$dir/$label.all.log" "$dir/$label-probe.log" 2>/dev/null | tail -3
                    echo '```'
                  done
                done
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report memory
        # From outside each app (the probe reads its private bytes, working set and the GPU
        # process counters) before the drag, at the drag's peak and settled after it, and from
        # inside it the window's own breakdown (DXC_METRICS memory-breakdown lines).
        if: always()
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          num() { sed -n "s/.*resize-probe: memory $2 .*$3=\([-0-9.]*\).*/\1/p" "$1" | head -1; }
          {
            echo "### Memory, MB (private / working set / GPU local), from outside the app"
            echo "| scale | app | path | rate | start | peak during the drag | settled |"
            echo "|---|---|---|---|---|---|---|"
            for scale in 1x 2x; do
              for app in kn; do
                for path in new old; do
                  for rate in 16 8 1; do
                    f="$out/$scale/$app-$path-$rate-probe.log"
                    [ -f "$f" ] || continue
                    row="| $scale | $app | $path | $rate ms"
                    for when in start "peak during the drag" settled; do
                      row="$row | $(num "$f" "$when" private_mb) / $(num "$f" "$when" working_set_mb) / $(num "$f" "$when" gpu_local_mb)"
                    done
                    echo "$row |"
                  done
                done
              done
            done
            for scale in 1x 2x; do
              for app in kn; do
                echo "### $scale $app (new, 16 ms): the window's own breakdown"
                echo '```'
                cat "$out/$scale/$app-new-16.log" "$out/$scale/$app-new-16.log.err" 2>/dev/null |
                  grep -E "memory-breakdown|metrics memory|draw texture ->|raster bitmap ->|swapchain on" || echo "none"
                echo '```'
              done
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resize-probe-logs-windows
          path: ${{ runner.temp }}/probe-logs/
          retention-days: 14

      - name: The probe ran, and both apps took the same resize path
        # Not a resize verdict (see the top of this file). Each drag must have run: a verdict
        # that is not ERROR, the move-size loop entered, more than one width seen. And both
        # apps must take the path asked for, in the same words from the same C: frames on the
        # CPU with every step blitted and validated, or frames on the GPU with no such step.
        # Every check here counts and goes on, so the step lists every failure, not the first.
        shell: bash --noprofile --norc -o pipefail {0}
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/probe-logs"
          [ "${{ steps.scale.outputs.status }}" = 0 ] || { echo "the display did not go to 200%" >&2; exit 1; }
          grep -q "effective dpi 192" "$out/set-display-scale.log" || { echo "the display is not at 192 dpi" >&2; exit 1; }
          status=0
          for scale in 1x 2x; do
            want="$([ $scale = 1x ] && echo "dpi 96 (1.00x)" || echo "dpi 192 (2.00x)")"
            for app in kn; do
              for path in new old; do
                for rate in 16 8 1; do
                  label="$app-$path-$rate"
                  dir="$out/$scale"
                  probe="$dir/$label-probe.log"
                  log="$dir/$label.all.log"
                  [ -f "$log" ] || cat "$dir/$label.log" "$dir/$label.log.err" > "$log" 2>/dev/null
                  verdict="$(grep -h "resize-probe: verdict" "$probe" 2>/dev/null || echo "no verdict")"
                  echo "$scale $label: $verdict"
                  case "$verdict" in *"verdict PASS"*|*"verdict FAIL"*) ;; *) echo "  the probe did not run"; status=1 ;; esac
                  grep -q "move-size loop entered" "$probe" 2>/dev/null || { echo "  no move-size loop"; status=1; }
                  grep -qF "px, $want" "$probe" 2>/dev/null || { echo "  the window was not at $want"; status=1; }
                  if [ "$path" = new ]; then
                    grep -qF "resize-mode: resize frames on the CPU (Skia raster, GDI blit)" "$log" ||
                      { echo "  $app did not take the CPU resize path"; status=1; }
                    steps="$(grep -c "resize-proof step" "$log" || true)"
                    bad="$(grep "resize-proof step" "$log" | grep -vcE "presents=0 child_visible=0 blit=1 validated=1$" || true)"
                    echo "  resize-proof steps: $steps, not blitted and validated: $bad"
                    { [ "$steps" -gt 0 ] && [ "$bad" = 0 ]; } || status=1
                  else
                    grep -qF "resize-mode: resize frames on the GPU" "$log" ||
                      { echo "  $app did not take the GPU resize path"; status=1; }
                    ! grep -q "resize-proof step" "$log" || { echo "  $app drew CPU steps with DXC_RASTER_RESIZE=0"; status=1; }
                  fi
                done
              done
            done
          done
          exit $status
