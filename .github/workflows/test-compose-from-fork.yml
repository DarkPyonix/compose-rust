# Compose from the fork: build it, build the renderer against it, and prove the build did not
# change by accident.
#
# scripts/build-compose.sh fetches one pinned commit of
# thisisthepy/compose-multiplatform-core-extended and publishes its modules to the local Maven
# repository. The fork's own line (org.thisisthepy.compose, 1.11.1-ext.N) is what the renderer
# ships on, so this workflow holds that line to a stored baseline: a known-good publication of
# the fork at an earlier pin, kept in renderer/scripts/compose-baseline/<target>.manifest as one
# digest per published module directory (.github/scripts/compose-baseline.py). On both platforms
# the Kotlin/Native renderer is built for:
#
#   1. build-compose.sh publishes the fork's modules to the local Maven repository, and that
#      repository is copied aside as it stands;
#   2. the publication is read as the baseline was (archives entry by entry with zip timestamps
#      left out, `-ext.<N>` read as `-ext.N`) and compared with it. A module directory whose
#      digest differs, or that is missing or new, fails the job unless the fork changed that
#      module's sources (compose/<group>/<module>/src/...) between the baseline's revision,
#      which the manifest records, and the pin. That list is read from the fork's diff, never
#      written by hand, so a change nobody meant still fails. The failure comes at the end, so
#      the renderer still builds. The manifest of this build is kept as the
#      compose-baseline-<target> artifact; .github/scripts/refresh-compose-baseline.sh turns a
#      run's artifacts into the stored baseline when the pin moves;
#   3. the renderer's platform module and its static library are built against the fork's
#      publication, the way desktop/scripts/build-linux.sh and build-macos.sh build them, and
#      the static library is kept as an artifact.
#
# The Gradle build cache is turned off, so that the publication compared with the baseline
# is built from the sources and not taken from an earlier build's outputs.
#
# Nothing else in CI builds Compose: the renderer's Kotlin/Native modules are otherwise built
# on a developer's machine. Building Compose twice per platform is slow, so this runs on
# demand, not on every push: by hand, or on a pull request that changes the pin or the build
# script once it carries the run-heavy-ci label. heavy-checks.yml holds such a pull request's
# merge until this has passed on its head.

name: Compose from fork test

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Heavy: runs only when asked for (the run-heavy-ci label on a pull request, or any other
  # event). Every job below needs this one, so a run nobody asked for is skipped whole, and
  # heavy-checks.yml does not count it.
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  build:
    needs: requested
    name: Build Compose from the fork (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, x64
            runner: ubuntu-latest
            target: linuxX64
            renderer_script: build-linux.sh
            renderer_out: linux
            toolchain_cache: ~/.cache/JetBrains/Kotlin
            gradle_heap: 11g
            gradle_workers: 4
          - name: macOS, arm64
            runner: macos-latest
            target: macosArm64
            renderer_script: build-macos.sh
            renderer_out: macos
            toolchain_cache: ~/Library/Caches/JetBrains/Kotlin
            gradle_heap: 5g
            gradle_workers: 2
    env:
      COMPOSE_WORK: ${{ github.workspace }}/../compose-build
      FORK_REPO: ${{ github.workspace }}/../repo-fork
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          # The Android SDK stays: the Compose build configures its Android targets even
          # when it only publishes a native one.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Report the machine
        run: |
          uname -a
          # Both runner images carry an Android SDK, which the Compose build configures its
          # Android targets against even when it publishes a native one only.
          echo "ANDROID_HOME=${ANDROID_HOME:?the runner image has no Android SDK}"
          df -h "$GITHUB_WORKSPACE"
          if [[ "$RUNNER_OS" == macOS ]]; then
            sysctl -n hw.memsize hw.ncpu
            xcodebuild -version
          else
            free -h
            nproc
          fi

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Point the Compose build at the JDK
        # The Compose build turns toolchain auto-detection off and takes its JDK 21 from this
        # variable, the way its own CI does.
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Cache Kotlin/Native for the Compose build
        id: cache-1
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('renderer/scripts/build-compose.sh') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache the Kotlin toolchain the renderer builds with
        id: cache-2
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.toolchain_cache }}
          key: kotlin-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the X11, Xext, GL, fontconfig and FreeType development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The module's test executable links against skiko, which needs fontconfig and
          # FreeType as well as the libraries the window itself uses.
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Configure Gradle for this runner
        # The user-level file overrides the checkout's gradle.properties. The heap the Compose
        # build asks for is sized for a workstation; the build cache is off so that the second
        # Compose build cannot reuse the first one's outputs.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=${{ matrix.gradle_workers }}
          org.gradle.jvmargs=-Xmx${{ matrix.gradle_heap }} -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF
          cat ~/.gradle/gradle.properties

      - name: Restore the fork's Compose publication
        # The publication depends only on what build-compose.sh pins (the fork, its revision
        # and the versions it publishes as, all literals in that script), the target and the
        # JDK. The script reads no .changes file; those are checked by
        # scripts/tests/compose-fork.test.sh.
        id: fork-build
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FORK_REPO }}
          key: compose-fork-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-jdk21-${{ hashFiles('renderer/scripts/build-compose.sh') }}

      - name: Build Compose from the fork
        # Under the fork's own coordinates. Skipped when the publication was restored: nothing after this step reads the work
        # directory, and every later step takes the fork's publication from FORK_REPO.
        id: fork-build-run
        if: steps.fork-build.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/.m2/repository
          DXC_COMPOSE_BUILD="$COMPOSE_WORK" \
            ./renderer/scripts/build-compose.sh --target ${{ matrix.target }} --clean
          rm -rf "$FORK_REPO"
          cp -a ~/.m2/repository "$FORK_REPO"
          find "$FORK_REPO" -type f | wc -l
          du -sh "$FORK_REPO"
          df -h "$GITHUB_WORKSPACE"

      - name: Put the fork's publication back
        # The renderer is built against the fork's publication, so that is what goes back,
        # whether the fork's build ran or was restored.
        run: |
          rm -rf ~/.m2/repository
          mkdir -p ~/.m2
          cp -a "$FORK_REPO" ~/.m2/repository

      - name: Compare the publication with the stored baseline
        id: compare
        continue-on-error: true
        run: |
          set -euo pipefail
          manifest="$PWD/renderer/scripts/compose-baseline/${{ matrix.target }}.manifest"
          out="$RUNNER_TEMP/compose-baseline"
          mkdir -p "$out"
          fork="$(sed -n 's/^FORK="\(.*\)"$/\1/p' renderer/scripts/build-compose.sh)"
          revision="$(sed -n 's/^REVISION="\([0-9a-f]\{40\}\)"$/\1/p' renderer/scripts/build-compose.sh)"
          # This build's manifest is kept whatever the comparison says: it is what
          # refresh-compose-baseline.sh stores when the pin moves.
          python3 .github/scripts/compose-baseline.py manifest "$FORK_REPO" \
            --revision "$revision" --target ${{ matrix.target }} > "$out/${{ matrix.target }}.manifest"
          wc -l "$out/${{ matrix.target }}.manifest"
          if [[ ! -f $manifest ]]; then
            echo "no stored baseline at ${manifest#$PWD/}; take this run's compose-baseline-${{ matrix.target }} artifact with .github/scripts/refresh-compose-baseline.sh" >&2
            exit 1
          fi
          baseline="$(sed -n 's/^# revision: \([0-9a-f]\{40\}\)$/\1/p' "$manifest")"
          [[ -n $baseline ]] || { echo "${manifest#$PWD/} names no revision" >&2; exit 1; }
          history="$RUNNER_TEMP/fork-history"
          rm -rf "$history"
          git init -q --bare "$history"
          git -C "$history" fetch -q --filter=blob:none "$fork" "$baseline" "$revision"
          # compose/<group>/<module>/src/... publishes as org/thisisthepy/compose/<group>/<module>.
          git -C "$history" diff --name-only "$baseline" "$revision" -- 'compose/*/*/src/*' > "$out/changed-sources.txt"
          echo "sources changed since the baseline $baseline:"
          sed 's/^/  /' "$out/changed-sources.txt"
          python3 .github/scripts/compose-baseline.py check "$FORK_REPO" "$manifest" \
            --changed-from-diff "$out/changed-sources.txt" \
            --report "$out/compose-baseline-report-${{ matrix.target }}.txt"

      - name: Keep the baseline comparison report and this build's manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-baseline-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/compose-baseline/${{ matrix.target }}.manifest
            ${{ runner.temp }}/compose-baseline/compose-baseline-report-${{ matrix.target }}.txt
            ${{ runner.temp }}/compose-baseline/changed-sources.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore both Linux architectures for the renderer
        # Holds the local Maven repository as the step below leaves it: the fork's x64
        # publication put back above, with the full Linux set published over it. Its --clean
        # wipes only COMPOSE_WORK, which nothing later reads, so restoring this over the same
        # starting repository gives the same result as running the step. It comes after the
        # fork's publication is put back, so nothing overwrites it afterwards.
        if: runner.os == 'Linux'
        id: linux-build
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-fork-linux-${{ runner.os }}-${{ runner.arch }}-linux-jdk21-${{ hashFiles('renderer/scripts/build-compose.sh') }}

      - name: Publish both Linux architectures for the renderer
        # The comparison above is x64 only, because the baseline is x64 only. The renderer's
        # Linux modules declare linuxArm64 as well, so resolving them needs the arm64 variants
        # and the root metadata that lists both. Publishing the fork's full Linux set over the
        # restored x64 one supplies them.
        id: linux-build-run
        if: runner.os == 'Linux' && steps.linux-build.outputs.cache-hit != 'true'
        run: |
          rm -rf "$COMPOSE_WORK"
          DXC_COMPOSE_BUILD="$COMPOSE_WORK" \
            ./renderer/scripts/build-compose.sh --target linux --clean


      - name: Build the renderer and its static library against it
        run: ./renderer/desktop/scripts/${{ matrix.renderer_script }}

      - name: Report the static library
        run: |
          ls -la renderer/build/${{ matrix.renderer_out }}
          du -sh renderer/build/${{ matrix.renderer_out }}

      - name: Keep the static library
        uses: actions/upload-artifact@v4
        with:
          name: renderer-staticlib-${{ matrix.target }}
          path: renderer/build/${{ matrix.renderer_out }}
          retention-days: 14

      - name: Fail if the Compose build differs from the baseline
        # The comparison runs before the renderer and does not stop it, so that one failing
        # does not hide the other's result.
        if: always() && steps.compare.outcome == 'failure'
        run: |
          echo "the fork's publication differs from the stored baseline outside the modules whose sources changed; see the comparison step and the compose-baseline-${{ matrix.target }} artifact" >&2
          exit 1

      - name: Save the fork's Compose publication (develop and main only)
        # Saved from develop and main only: a cache saved on another branch is not visible
        # to develop's runs.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && steps.fork-build.outputs.cache-hit != 'true' && steps.fork-build-run.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FORK_REPO }}
          key: ${{ steps.fork-build.outputs.cache-primary-key }}

      - name: Save both Linux architectures for the renderer (develop and main only)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && runner.os == 'Linux' && steps.linux-build.outputs.cache-hit != 'true' && steps.linux-build-run.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.linux-build.outputs.cache-primary-key }}

      - name: Save Kotlin/Native for the Compose build (not from a pull request)
        if: github.event_name != 'pull_request' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save the Kotlin toolchain the renderer builds with (not from a pull request)
        if: github.event_name != 'pull_request' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.toolchain_cache }}
          key: ${{ steps.cache-2.outputs.cache-primary-key }}
