# Publishes the compose-rust crate to crates.io for a v* tag.
#
# This runs only after the "Native renderer test" workflow has succeeded for the tag. That
# workflow builds every platform and attaches the renderer artifacts to the GitHub Release
# in its last job, and the crate's build script downloads those artifacts for its own
# version. Publishing before they exist would ship a version nobody can build, and a
# published version can never be replaced. A workflow_run trigger on success keeps that
# order: a failed or cancelled renderer run never reaches this file.
#
# workflow_run reports a tag push with the tag name as head_branch, and runs from the
# default branch, so the job checks out the tagged commit explicitly.
#
# A failed publish can be re-run by hand: start this workflow with workflow_dispatch and an
# existing v* tag. It checks out that tag's commit and runs the same steps. The tag's Native
# renderer release assets must already exist, since the verification build downloads them.
name: Publish to crates.io

on:
  workflow_run:
    workflows: ["Native renderer test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (for example v0.0.3). Its Native renderer release assets must already exist."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the crate
    if: >-
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    # Publishing cannot be undone: a version can be yanked but never replaced, and the
    # name is taken forever. Add a required reviewer to this environment in the repository
    # settings if you want a human to approve each one; with no reviewer configured it
    # runs straight through, which is the intended behaviour for a tag push.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: The tag and Cargo.toml must agree
        # A tag that does not match the manifest would publish a version nobody asked for,
        # under a number that then can never be reused.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          manifest="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="compose-rust"))')"
          if [[ "$tag" != "v$manifest" ]]; then
            echo "tag $tag does not match compose-rust $manifest in Cargo.toml" >&2
            echo "Publishing would release a version that no commit claims. Fix one or the other." >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml $manifest"

      - name: Install the libraries the static renderer links
        # The verification build links the renderer statically. The list is exactly the
        # Linux `libraries` in compose-rust/build.rs (X11 Xext GL fontconfig freetype stdc++ z,
        # plus EGL on arm64), as development packages because the link names libX11.so and
        # friends. Same set as the "libraries an application links on Linux" step of
        # test-native-renderer.yml and the apt lines of test.yml. The runner image has none of
        # them; v0.0.2 failed on fontconfig/freetype (run 40112527120) and v0.0.3 on X11, Xext
        # and GL (run 40246021442).
        #   X11 -> libx11-dev, Xext -> libxext-dev, GL -> libgl-dev, EGL -> libegl-dev,
        #   fontconfig -> libfontconfig1-dev, freetype -> libfreetype-dev, z -> zlib1g-dev,
        #   stdc++ -> build-essential (g++); pthread, dl, m, rt are libc.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev \
            libx11-dev libxext-dev libgl-dev libegl-dev libfontconfig1-dev libfreetype-dev

      - name: Publish
        # Default features only, so this is exactly what a consumer gets. The verification
        # build downloads the renderer for this version from the release the renderer workflow
        # just attached it to, which is why that job has to finish first: publishing a
        # crate whose build script cannot find its own renderer would ship a version
        # nobody can build.
        #
        # compose-rust-macros goes in the same call: compose-rust names it by version, so it
        # has to be on crates.io first, and publishing both at once uploads them in
        # dependency order.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p compose-rust-macros -p compose-rust
