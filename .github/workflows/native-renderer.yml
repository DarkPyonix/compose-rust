# Native renderer: the slow half of the quality gate, and the release.
#
# A version tag runs the same platform builds this workflow already runs for verification,
# then attaches what they produced to a GitHub Release and publishes the crate. Building
# it twice, once to check and once to ship, is what a separate release workflow used to
# do, and the two copies drifted. One workflow, one platform list.
#
# What ships, per platform:
#
#   macos-aarch64, linux-x64   the Kotlin/Native renderer as a static archive, Compose,
#                              Skia and ICU inside it. The crate links it into the
#                              application, so the application is one executable that needs
#                              nothing but the system's own libraries.
#   windows-x64                the GraalVM native image, a DLL with Skia and the AWT DLLs
#                              beside it, until the Windows static renderer exists.
#   ios                        the Kotlin/Native archive as an XCFramework.
#
# The crate stays an ordinary crate that builds with no renderer present, and each
# renderer ships as a checksummed tarball on the release for its tag. The build script
# links whichever kind the tarball holds.
#
# `single-executable` is the proof of the first row: it builds an application the way a
# consumer does, from the tarball exactly as the release will carry it, checks that it
# names only system libraries, and runs it alone in an empty directory.
#
# The macOS and Linux native images are no longer built here. Nothing ships them, and the
# shared-library path they exercised is still linked by the Rust quality gate, which builds
# against whatever renderer it is given.
#
# This is the counterpart to ci.yml. ci.yml runs on every pull request because it is
# fast; the builds here compile Compose and the renderer ahead of time, which costs tens of
# minutes per platform. So it runs:
#   - on pushes to main that touch the renderer, its scripts or how the crate links it,
#   - nightly, to catch toolchain drift even when nobody touched the renderer,
#   - on demand.
#
# None of the maintainers own a Windows or Linux machine, so these jobs are the only place
# those platforms are exercised at all. Keep them unconditional. A job that is skipped by
# default reports green while proving nothing, which is how Windows sat untested.

name: Native renderer

on:
  # Pushes to main only, and deliberately not on the pull request that proposes them.
  # This is the slow half of the gate: a ~1GB toolchain download and tens of minutes of
  # native-image compilation per platform. Running it on the release proposal would hold
  # every publication behind an hour of building, so it runs once the tree is on main and
  # reports afterwards, with the nightly schedule catching toolchain drift in between.
  #
  # That is a real gap and worth naming: a renderer that stops building is found after
  # main has moved, not before. The release workflow builds the renderer again for the
  # artifacts, so nothing is published from a tree that cannot produce one.
  # A version tag also runs this, and then the release jobs at the bottom attach what it
  # built. There is no path filter on the trigger, and there cannot be one: a path filter
  # applies to tag pushes too, so a release whose tagged commit happened not to touch the
  # renderer would skip its own build and publish nothing. The `changed` job below does the
  # same filtering where it can tell a tag from a branch, so main pushes that left the
  # renderer alone cost one cheap job instead of four long ones.
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # 03:00 UTC daily. Scheduled runs only fire on the default branch.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: native-renderer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main moves on every publication, not only on releases, so without this every push of
  # unrelated work would start four native-image builds. A tag always builds: that is the
  # release, and it must produce artifacts whatever its commit happened to touch.
  changed:
    name: Is there anything to build
    runs-on: ubuntu-latest
    outputs:
      renderer: ${{ steps.check.outputs.renderer }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, which is the previous main, so the diff
          # is everything the publication brought in rather than one commit of it.
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "a tag always builds"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The nightly run exists to catch toolchain drift, which by definition changes
          # nothing in this repository, and a manual run was asked for on purpose.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "$GITHUB_EVENT_NAME always builds"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD |
              grep -qE '^(dioxus-compose-renderer/|dioxus-compose/build(\.rs|/)|scripts/(install-nik|check-single-executable|package-static-renderer)\.sh|\.github/workflows/native-renderer\.yml)'; then
            echo "the renderer changed"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under the renderer changed"
            echo "renderer=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every push to develop and main, and nightly. Nobody here owns a Windows
  # machine, so this job *is* the Windows verification: if it goes red, Windows is
  # broken. It proves build, startup, render, clean close and exit 0. It cannot prove
  # mouse input, because a hosted runner has no one to click (see SPEC PR-8).
  windows:
    needs: changed
    if: needs.changed.outputs.renderer == 'true'
    name: Windows x64 native-image build and smoke test
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream GraalVM 25
        # Upstream GraalVM supports AWT on Windows and Liberica NIK is a macOS requirement.
        #
        # NIK would be the better answer and is not ready. It carries the JDK's desktop
        # libraries as static archives, which is why a macOS distribution is four files and
        # this one is sixteen, and linking them in here got as far as producing an image
        # that could not start: AWT's Toolkit still calls System.loadLibrary("awt") at run
        # time, and an archive inside the image does not answer that call. It has to be
        # registered as a library the image already contains, which GraalVM does for AWT on
        # macOS and does not do here.
        #
        # That work is on feat/windows-nik-static-awt. It is not on this branch because
        # every attempt at it costs a CI run to observe and four of them left the Windows
        # renderer unbuildable in the meantime.
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Build the Windows renderer
        shell: powershell
        run: .\dioxus-compose-renderer\desktop\scripts\build-native-windows.ps1

      - name: Non-interactive Windows smoke test
        # This proves startup, rendering long enough to open, clean close, and return 0.
        # It does not prove mouse input because a hosted runner cannot perform the required click.
        shell: powershell
        run: .\dioxus-compose-renderer\desktop\scripts\smoke-test-windows.ps1

      # A run artifact, which is a different thing from the release asset below: it belongs
      # to this run, lasts a fortnight, and is not published anywhere. The release asset
      # stays tag-only, which is right.
      #
      # It exists because a renderer built from the current schema was otherwise
      # unobtainable between releases. Anyone working on Windows had the choice of
      # installing GraalVM and Visual Studio Build Tools, or using the last release's
      # renderer and watching it fail the schema handshake, which is what an empty window
      # on Windows turned out to be.
      - name: Keep the distribution as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: renderer-windows-x64
          path: dioxus-compose-renderer/build/native-image/dist
          retention-days: 14

      - name: Package the distribution for a release
        id: package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          name="dioxus-compose-renderer-${{ github.ref_name }}-windows-x64"
          # dist/ holds the renderer, Skia and the AWT libraries, plus include/.
          tar -czf "${name}.tar.gz" -C dioxus-compose-renderer/build/native-image/dist .
          if command -v shasum >/dev/null; then
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          cat "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

      - name: Upload the renderer
        uses: actions/upload-artifact@v4
        with:
          name: dioxus-compose-renderer-windows-x64
          path: dioxus-compose-renderer/build/native-image/dist/
          retention-days: 7

  # The renderer macOS ships: Kotlin/Native over AppKit and Metal, as a static archive.
  #
  # Compose publishes this platform, but the text context menu and the keys that copy are
  # empty in what it publishes, and they are answered inside Compose's own modules. Those
  # changes are commits in a fork of Compose, so the two modules that hold them are built
  # from it first, at the revision the repository pins. That is the long part, and it is
  # cached on exactly those inputs.
  macos-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true'
    name: macOS arm64 static renderer
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 21 for the Compose build
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Point the Compose build at the JDK
        # The Compose build turns toolchain detection off and takes its JDK 21 from this.
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Restore the patched Compose for macosArm64
        id: compose-cache
        # Restored and saved as two steps, so a build that fails after Compose has been
        # published still keeps it, and the next attempt does not spend the time again.
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-macosarm64-${{ hashFiles('dioxus-compose-renderer/scripts/build-compose.sh', 'dioxus-compose-renderer/scripts/compose-fork.changes') }}

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-native-macos-${{ hashFiles('dioxus-compose-renderer/kotlin', 'dioxus-compose-renderer/libs.versions.toml', 'dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-macos-

      - name: Configure Gradle for this runner
        if: steps.compose-cache.outputs.cache-hit != 'true'
        # The heap the Compose build asks for is sized for a workstation.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build and publish the patched Compose for macosArm64
        if: steps.compose-cache.outputs.cache-hit != 'true'
        env:
          DXC_COMPOSE_BUILD: ${{ runner.temp }}/compose-build
        run: ./dioxus-compose-renderer/scripts/build-compose.sh --target macosArm64

      - name: Keep the patched Compose for the next run
        if: steps.compose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.compose-cache.outputs.cache-primary-key }}

      - name: Build the static renderer
        run: ./dioxus-compose-renderer/desktop/scripts/build-macos.sh --release

      - name: Keep the renderer build's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-static-renderer-logs
          path: dioxus-compose-renderer/build/macos-logs/
          retention-days: 7

      - name: Package it the way the release carries it
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' dioxus-compose/Cargo.toml | head -1)"
          ls -la dioxus-compose-renderer/build/macos
          ./scripts/package-static-renderer.sh dioxus-compose-renderer/build/macos \
            macos-aarch64 "$version" "$RUNNER_TEMP/artifact"
          echo "name=dioxus-compose-renderer-v$version-macos-aarch64" >> "$GITHUB_OUTPUT"

      # Named exactly as the release asset, so the release job below and the check that
      # builds an application from it both take this one file.
      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

  # The renderer Linux ships: Kotlin/Native over Xlib and GLX, as a static archive.
  #
  # Compose publishes no Kotlin/Native target for Linux, so the modules the renderer draws
  # with are built from source first, at the revision the repository pins, and cached on
  # exactly those inputs.
  linux-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true'
    name: Linux x64 static renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the Compose build
        # Its checkout and Gradle outputs take several gigabytes. These are toolchains the
        # job never uses; the Android SDK stays, because Compose's Gradle build reads it.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install JDK 21 for the Compose build
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Point the Compose build at the JDK
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Install the X11, GL and font headers the window and Skia compile against
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config unzip \
            libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Restore the patched Compose for linuxX64
        id: compose-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: compose-linuxx64-${{ hashFiles('dioxus-compose-renderer/scripts/build-compose.sh', 'dioxus-compose-renderer/scripts/compose-fork.changes') }}

      - name: Cache the Kotlin toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.konan
          key: kotlin-native-linux-${{ hashFiles('dioxus-compose-renderer/kotlin', 'dioxus-compose-renderer/libs.versions.toml', 'dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-native-linux-

      - name: Configure Gradle for this runner
        if: steps.compose-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build and publish the patched Compose for linuxX64
        if: steps.compose-cache.outputs.cache-hit != 'true'
        env:
          DXC_COMPOSE_BUILD: ${{ runner.temp }}/compose-build
        run: ./dioxus-compose-renderer/scripts/build-compose.sh --target linuxX64

      - name: Keep the patched Compose for the next run
        if: steps.compose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.compose-cache.outputs.cache-primary-key }}

      - name: Build the static renderer
        run: ./dioxus-compose-renderer/desktop/scripts/build-linux.sh --release

      - name: Keep the renderer build's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-static-renderer-logs
          path: dioxus-compose-renderer/build/linux-logs/
          retention-days: 7

      - name: Package it the way the release carries it
        id: package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' dioxus-compose/Cargo.toml | head -1)"
          ls -la dioxus-compose-renderer/build/linux
          ./scripts/package-static-renderer.sh dioxus-compose-renderer/build/linux \
            linux-x64 "$version" "$RUNNER_TEMP/artifact"
          echo "name=dioxus-compose-renderer-v$version-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz
            ${{ runner.temp }}/artifact/${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

  # Every compose-rust desktop application is one executable. This builds one the way a
  # consumer does, with no build script of its own and no variable pointing anywhere, from
  # the tarball above exactly as the release will carry it: the tarball goes where a build
  # with no network looks for its download, and the build script verifies and unpacks it.
  # The executable has to name nothing but system libraries, and copied alone into an empty
  # directory it has to open its window and draw. A fresh checkout, so the only renderer
  # there is to find is the tarball.
  single-executable:
    needs: [macos-static, linux-static]
    name: One executable on ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runs-on: macos-latest
          - target: linux-x64
            runs-on: ubuntu-24.04
    env:
      # Mesa draws with the processor; a hosted runner has no card.
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install the libraries an application links on Linux, and a virtual display
        # Development packages, because linking names libX11.so and friends; the runtime
        # halves are what a desktop already has.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libgl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            fonts-noto-cjk libgl1-mesa-dri xvfb xauth

      - name: Download the renderer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: dioxus-compose-renderer-v*-${{ matrix.target }}
          path: artifact
          merge-multiple: true

      - name: Build it, check what it needs, and run it alone
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifact
          tarball="$(ls artifact/*.tar.gz)"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              ./scripts/check-single-executable.sh "$tarball" "$RUNNER_TEMP/single-executable"
          else
            ./scripts/check-single-executable.sh "$tarball" "$RUNNER_TEMP/single-executable"
          fi

  # iOS is Kotlin/Native, not native-image, so it shares nothing with the jobs above
  # except the interpreter source. It builds both slices (simulator and device) and
  # runs the *desktop* C smoke host against the simulator archive, which is what makes
  # it evidence for PR-2: one unmodified host, two renderers, one ABI.
  ios:
    needs: changed
    if: needs.changed.outputs.renderer == 'true'
    name: iOS build and simulator smoke test
    # macos-26, not macos-latest. Compose Multiplatform's iOS artifacts carry
    # precompiled Objective-C objects built against the iOS 26 SDK, and one of them
    # references UIViewLayoutRegion, a class that does not exist in the iOS 18 SDK on the
    # macos-15 image. Linking the smoke host there fails with an undefined symbol even
    # though both archives built cleanly.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Kotlin toolchain, konan and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: kotlin-ios-${{ hashFiles('dioxus-compose-renderer/kotlin', 'dioxus-compose-renderer/libs.versions.toml', 'dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-ios-

      - name: Protocol codec tests on Kotlin/Native (PR-4)
        working-directory: dioxus-compose-renderer
        run: ./kotlin test -m ios

      - name: Build the simulator archive
        run: ./dioxus-compose-renderer/desktop/scripts/build-ios.sh

      - name: Build the device archive
        # Never run, only linked. It proves the arm64 device slice still compiles and
        # exports the PR-2 symbols; running it needs a signed app on real hardware.
        run: ./dioxus-compose-renderer/desktop/scripts/build-ios.sh --target device

      - name: Simulator smoke test (PR-2)
        run: ./dioxus-compose-renderer/desktop/scripts/ios-smoke-test.sh --screenshot "${RUNNER_TEMP}/ios-smoke.png"

      - name: Simulator screenshot of the system's navigation chrome
        # The default smoke tree has no navigation, so the screenshot above shows none of
        # the chrome iOS 26 draws as Liquid Glass. This run declares two destinations,
        # which is what the renderer turns into a UITabBarController and a title bar.
        run: |
          ./dioxus-compose-renderer/desktop/scripts/ios-smoke-test.sh \
            --navigation --screenshot "${RUNNER_TEMP}/ios-navigation.png"

      - name: Package the iOS renderer as an XCFramework
        # Both slices in one bundle, which is the only form Xcode links directly. A bare
        # .a would make every consumer pick the right slice by hand and would break the
        # moment they switched between a device and the simulator.
        if: startsWith(github.ref, 'refs/tags/v')
        id: package
        run: |
          set -euo pipefail
          name="dioxus-compose-renderer-${GITHUB_REF_NAME}-ios"
          build=dioxus-compose-renderer/build/ios
          for slice in device simulator; do
            mkdir -p "$build/$slice/include"
            cp "$build/$slice"/*.h "$build/$slice/include/"
          done
          rm -rf "$name.xcframework"
          xcodebuild -create-xcframework \
            -library "$build/device/libdioxus_compose_renderer.a" \
            -headers "$build/device/include" \
            -library "$build/simulator/libdioxus_compose_renderer.a" \
            -headers "$build/simulator/include" \
            -output "$name.xcframework"
          tar -czf "$name.tar.gz" "$name.xcframework"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

      - name: Upload the simulator screenshots
        # The one artifact a human can judge without a Mac to hand. Whether the bars are
        # really made of glass cannot be asserted, only looked at, so the navigation shot
        # is uploaded beside the plain one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            ${{ runner.temp }}/ios-smoke.png
            ${{ runner.temp }}/ios-navigation.png
          retention-days: 7

  # Everything below runs only for a version tag, and only after every platform above has
  # built and smoke tested. A crates.io version can be yanked but never replaced, and the
  # crate's build script points at the release artifact for its own version, so publishing
  # while a platform is missing would leave anyone on that platform with a version that can
  # never be made to work.
  release:
    name: Publish the GitHub Release
    needs: [changed, windows, macos-static, linux-static, single-executable, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # The only write permission anywhere in this repository's workflows, and
      # it is scoped to this job: it creates a release and uploads files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download the platform artifacts
        # The release assets only. Every one is named after the file it carries, and the
        # per-run inspection uploads are not.
        uses: actions/download-artifact@v4
        with:
          pattern: dioxus-compose-renderer-v*
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Create or update the release
        # Published, not drafted. The crate that names these artifacts is uploaded to
        # crates.io by the next job, and that cannot be undone, so a release left in draft
        # means the published crate points at a download page nobody outside this
        # repository can see. The gate is the tag: a tag only reaches here after all three
        # platforms built and smoke tested.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS --clobber
            # A release created by an earlier run of this tag may still be a draft.
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Renderer artifacts for \`$TAG\`. Verify with \`shasum -a 256 -c SHA256SUMS\`." \
              artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS
          fi

  publish-crate:
    name: Publish compose-rust to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Publishing cannot be undone: a version can be yanked but never replaced, and the
    # name is taken forever. Add a required reviewer to this environment in the repository
    # settings if you want a human to approve each one; with no reviewer configured it
    # runs straight through, which is the intended behaviour for a tag push.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: The tag and Cargo.toml must agree
        # A tag that does not match the manifest would publish a version nobody asked for,
        # under a number that then can never be reused.
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          manifest="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="compose-rust"))')"
          if [[ "$tag" != "v$manifest" ]]; then
            echo "tag $tag does not match compose-rust $manifest in Cargo.toml" >&2
            echo "Publishing would release a version that no commit claims. Fix one or the other." >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml $manifest"

      - name: Publish
        # Default features only, so this is exactly what a consumer gets. The verification
        # build downloads the renderer for this version from the release the job above
        # just attached it to, which is why that job has to finish first: publishing a
        # crate whose build script cannot find its own renderer would ship a version
        # nobody can build.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p compose-rust
