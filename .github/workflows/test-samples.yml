# Samples test -- builds every sample for every platform: the desktop matrix, Android,
# the iOS simulator and the browser. A `sample-v*` tag, or a dispatch naming one, also
# attaches the results to a GitHub Release.
#
# On a pull request it is a heavy check, so it runs only when asked: the run-heavy-ci
# label, or a push while the label is on (heavy-checks.yml holds the merge until it has
# passed on the head). Then it builds everything and releases nothing. The paths below are
# the ones a sample build reads beyond the crate itself; a change to compose-rust alone is
# tested by the workspace's own tests, which include every sample's.
#
# A sample that does not build on a platform is skipped and the release goes ahead with
# the rest. Eleven samples across three platforms is thirty-three builds, and holding all
# of them back because one of them broke on one platform helps nobody. A platform where
# nothing at all built is a different thing and still fails the run.
#
# Separate from release.yml on purpose. That workflow ships the library: the renderer
# artifacts and the crate. This one ships programs a person downloads and runs, and the
# two should be versioned apart so a sample can be rebuilt without implying a library
# release, and a library release is not held up by a sample that does not build.
#
# Each sample links the renderer for its platform. On macOS and Linux that is the static
# archive, built by static-renderer.yml, so each sample is one executable; on Windows the
# renderer library still ships beside it.

name: Samples test

on:
  push:
    tags:
      - 'sample-v*'
  pull_request:
    # Only when asked: the run-heavy-ci label going on, or a push or reopen while it is on.
    # The request job below decides; heavy-checks.yml holds the merge until it has passed.
    types: [synchronize, reopened, labeled]
    paths:
      - samples/**
      - scripts/build-sample-apks.sh
      - scripts/build-sample-pages.sh
      - renderer/desktop/scripts/build-sample-ios.sh
      - .github/workflows/test-samples.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sample-v* tag to build a release for; empty builds without releasing'
        required: false
        type: string
        default: ''

concurrency:
  # One run per pull request: a new commit cancels the older run. A tag push or a dispatch
  # is never cancelled, so a release is not cut short half way, and a second one for the
  # same tag waits. A run started by some other label going on gets a group of its own, so
  # it cannot cancel a heavy run.
  group: test-samples-${{ github.event.pull_request.number || inputs.tag || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-heavy-ci' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  # The renderers macOS and Linux ship, from the same reusable workflow the release uses,
  # so that every sample there is one executable, built the way an application is.
  static-renderer:
    name: renderer
    needs: requested
    strategy:
      fail-fast: false
      matrix:
        target: [macos-aarch64, linux-x64, linux-arm64]
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: ${{ matrix.target }}
      ref: ${{ inputs.tag || github.ref }}

  fork-desktop:
    # The Windows renderer's desktop module asks for the fork's Compose and skiko-awt by version.
    needs: requested
    name: Build the Compose fork's desktop modules
    uses: ./.github/workflows/fork-desktop-modules.yml

  build:
    name: Build the sample (${{ matrix.target }})
    needs: [requested, static-renderer, fork-desktop]
    # Windows builds its own renderer and does not need the static ones, and one platform's
    # renderer failing does not stop the others' samples.
    if: ${{ !cancelled() && needs.requested.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-aarch64
            static: true
          - runner: ubuntu-24.04
            target: linux-x64
            static: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            static: true
          - runner: windows-2022
            target: windows-x64
            static: false
            renderer: powershell .\renderer\desktop\scripts\build-native-windows.ps1
            # `dist`, not `dist/lib`. Windows puts the DLL in `dist\bin` and the JDK's
            # font configuration in `dist\lib`, because AWT reads that from java.home and
            # the renderer sets java.home to `dist`. The search order looks in a given
            # directory and then in its `bin` and `lib`, so naming the parent finds both.
            dist: renderer/build/native-image/dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Take Git's coreutils out of the linker's way
        # Git for Windows carries a coreutils `link` in usr/bin, and a bash step finds it
        # before the MSVC linker, so every Rust build dies at `extra operand` before
        # reaching a single sample.
        #
        # Renaming that one file rather than rearranging PATH, and rather than reaching
        # for an action that sets up the whole developer environment: the runner already
        # has a working MSVC toolchain that cargo finds on its own, and the only thing
        # wrong is one name being shadowed. Setting up a second environment to fix one
        # shadowed name is how `VsDevCmd.bat failed to initialise the x64 compiler
        # environment` happened.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shadow="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$shadow" ]; then
            mv "$shadow" "$shadow.coreutils"
            echo "moved the coreutils link out of the way"
          fi
          echo "link.exe now resolves to: $(command -v link || echo 'nothing on PATH')"

      - name: Install upstream GraalVM 25
        if: runner.os == 'Windows'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the libraries a Linux application links
        # Development packages, because linking names libX11.so and friends. The
        # executable needs only their runtime halves, which a desktop already has.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libgl1-mesa-dev libegl-dev libfontconfig1-dev libfreetype-dev

      - name: Cache the Kotlin toolchain and Maven dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: kotlin-${{ matrix.target }}-${{ hashFiles('renderer/**/module.yaml') }}
          restore-keys: kotlin-${{ matrix.target }}-

      - name: Take the Compose fork's desktop modules
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: compose-fork-desktop
          path: ${{ runner.temp }}/compose-fork-desktop

      - name: Put them where the renderer's build looks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.m2/repository/org/jetbrains
          cp -R "$RUNNER_TEMP/compose-fork-desktop/." ~/.m2/repository/org/

      - name: Build the Windows renderer
        if: runner.os == 'Windows'
        run: ${{ matrix.renderer }}

      - name: Download the static renderer
        if: matrix.static
        uses: actions/download-artifact@v4
        with:
          pattern: compose-rust-renderer-v*-${{ matrix.target }}
          path: renderer-artifact
          merge-multiple: true

      - name: Unpack it where the build will be pointed
        if: matrix.static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renderer"
          tar -xzf renderer-artifact/*.tar.gz -C "$RUNNER_TEMP/renderer"
          ls -la "$RUNNER_TEMP/renderer/lib"
          echo "RENDERER=$RUNNER_TEMP/renderer" >> "$GITHUB_ENV"

      - name: Point the build at the Windows renderer
        if: runner.os == 'Windows'
        shell: bash
        # Absolute. A build script runs with its crate directory as the working
        # directory, not the workspace root, so a relative path here points at
        # compose-rust/renderer/... and finds nothing.
        run: echo "RENDERER=${{ github.workspace }}/${{ matrix.dist }}" >> "$GITHUB_ENV"

      - name: Build every sample against it
        # A sample that does not build is skipped rather than allowed to end the run. The
        # point of this workflow is to put programs in front of people, and one sample
        # failing to compile on one platform is not a reason to ship none of the other ten
        # anywhere. Which ones built is written to `built.txt` and the packaging step
        # reads it, so a sample that failed here cannot be packaged from a stale binary
        # left by an earlier run.
        shell: bash
        run: |
          set -uo pipefail
          export COMPOSE_RUST_RENDERER_DIR="$RENDERER"
          : > built.txt
          : > skipped.txt
          for manifest in samples/*/Cargo.toml; do
            app="$(basename "$(dirname "$manifest")")"
            # Only the ones that are programs. `frames` is a library the others record
            # their screens through, so it builds and then has no binary to ship, which
            # is not a failure and must not be reported as one.
            if [[ ! -f "samples/$app/src/main.rs" ]]; then
              echo "-- $app is a library, not an application"
              continue
            fi
            echo "== sample-$app"
            if cargo build --release -p "sample-$app" --features compose-rust/native-renderer; then
              echo "$app" >> built.txt
            else
              echo "$app" >> skipped.txt
              echo "::warning title=Sample skipped::sample-$app did not build for ${{ matrix.target }}"
            fi
          done
          echo "built:"; cat built.txt
          echo "skipped:"; cat skipped.txt
          # Nothing at all is a different case. That is the renderer or the toolchain
          # being wrong rather than one sample being wrong, and shipping an empty platform
          # quietly would hide it.
          if [[ ! -s built.txt ]]; then
            echo "::error title=No samples built::every sample failed on ${{ matrix.target }}, which is the platform being broken rather than a sample"
            exit 1
          fi

      - name: Fetch appimagetool
        # Pinned by version and by digest, so a tagged sample release is packaged by the
        # same tool whenever it is rebuilt. Downloaded on the runner only: nothing a
        # developer runs locally needs it.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-x64)
              arch=x86_64
              digest=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            linux-arm64)
              arch=aarch64
              digest=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
          esac
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          echo "$digest  $tool" | sha256sum -c -
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Package each sample as the platform installs it
        # A .app and a .dmg on macOS, a .zip and an unsigned .msix on Windows, an
        # AppImage on Linux. On macOS and Linux the renderer is inside the executable,
        # so a bundle holds that one file, the icon and the metadata. The Windows
        # renderer is still a DLL and travels beside its program. scripts/package-sample.sh
        # says how each one is laid out and why.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          exe=""
          [[ "${{ runner.os }}" == "Windows" ]] && exe=".exe"
          while read -r app; do
            [[ -n "$app" ]] || continue
            renderer=()
            [[ "${{ runner.os }}" == "Windows" ]] && renderer=(--renderer "${{ matrix.dist }}")
            ./scripts/package-sample.sh ${renderer[@]+"${renderer[@]}"} "$app" "${{ matrix.target }}" \
              "target/release/sample-$app$exe" artifacts
          done < built.txt
          rm -rf artifacts/stage
          cd artifacts
          # *.zip covers the .app.zip too. Spelled without arrays, because the bash a
          # macOS runner starts may be the 3.2 Apple ships.
          # ls exits 1 or 2 when one of the patterns matches nothing (no .msix on macOS),
          # and pipefail would end the step there, so the list comes from find.
          files="$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.msix' -o -name '*.AppImage' \) | sed 's|^\./||' | sort -u)"
          [[ -n "$files" ]] || { echo "::error::nothing was packaged"; exit 1; }
          if command -v sha256sum >/dev/null; then sha256sum $files > "SHA256SUMS-${{ matrix.target }}"
          else shasum -a 256 $files > "SHA256SUMS-${{ matrix.target }}"; fi
          cat "SHA256SUMS-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.target }}
          path: artifacts/


  android:
    needs: requested
    name: Build the sample (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK
        # The runner already has an Android SDK with its licences accepted, so the setup
        # action is a second one that tries to accept them again and fails inside
        # sdkmanager. Only the NDK is missing, and the SDK that is here can fetch it.
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache Gradle and Maven dependencies
        # Gradle, not the Kotlin toolchain: an application's Kotlin is compiled by its own
        # Gradle build here rather than by ours.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-android-${{ hashFiles('compose-rust/android-kotlin/**') }}
          restore-keys: gradle-android-

      - name: Install the Dioxus CLI
        # The samples are built the way anyone else would build them. Pinned, so that an
        # upstream release cannot change what a tagged sample release was built with.
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build an APK for every sample
        run: ./scripts/build-sample-apks.sh artifacts

      - name: Checksum
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS-android
          cat SHA256SUMS-android

      - uses: actions/upload-artifact@v4
        with:
          name: samples-android
          path: artifacts/

  ios:
    needs: requested
    name: Build the sample (iOS, simulator)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-ios-sim

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-ios-${{ hashFiles('renderer/**/module.yaml') }}
          restore-keys: kotlin-ios-

      - name: Build the renderer for the simulator
        run: ./renderer/desktop/scripts/build-ios.sh --target simulator

      - name: Wrap every sample in an application bundle
        # Simulator only. A bundle for a device has to be signed by a certificate Apple
        # issued against a profile naming that device, and there is none here.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          built=0
          for manifest in samples/*/Cargo.toml; do
            sample="$(basename "$(dirname "$manifest")")"
            # An application rather than a library: every sample is a library now.
            [[ -f "samples/$sample/src/main.rs" ]] || continue
            if ./renderer/desktop/scripts/build-sample-ios.sh "$sample" --release; then
              tar -czf "artifacts/$sample-ios-simulator.tar.gz" \
                -C renderer/build/ios/samples "sample-$sample.app"
              built=$((built + 1))
            else
              echo "::warning title=Sample skipped::$sample did not build for the iOS simulator"
            fi
          done
          [[ $built -gt 0 ]] || { echo "::error::no sample built for iOS"; exit 1; }
          cd artifacts && shasum -a 256 *.tar.gz > SHA256SUMS-ios-simulator

      - uses: actions/upload-artifact@v4
        with:
          name: samples-ios-simulator
          path: artifacts/

  web:
    needs: requested
    name: Build the sample (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-web-${{ hashFiles('renderer/**/module.yaml') }}
          restore-keys: kotlin-web-

      - name: Build a page for every sample
        run: ./scripts/build-sample-pages.sh pages

      - name: Pack the pages as one archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf artifacts/samples-web.tar.gz -C pages .
          cd artifacts && sha256sum samples-web.tar.gz > SHA256SUMS-web

      - uses: actions/upload-artifact@v4
        with:
          name: samples-web
          path: artifacts/

  release:
    name: Attach the samples to the GitHub release
    needs: [build, android, ios, web]
    # A tag, or a dispatch that names one. A pull request run and a dispatch without a tag
    # build everything and stop there.
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: samples-*
          path: downloaded

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Say which sample and platform pairs are in this release
        id: notes
        run: |
          set -euo pipefail
          {
            echo "Sample applications, one download per sample per platform."
            echo
            echo "A macOS or Linux download holds one executable with the renderer inside"
            echo "it, an icon and the metadata. A Windows download holds the program and"
            echo "the renderer library it was linked against:"
            echo
            echo "- macOS (Apple silicon): open the .dmg and drag the application to"
            echo "  Applications, or unpack the .app.zip. The bundle is signed ad hoc"
            echo "  rather than by a Developer ID, so the first launch needs Open from"
            echo "  the Finder's context menu."
            echo "- Windows (x64): unpack the .zip and run the program in its bin"
            echo "  directory, or install the .msix. The MSIX is not signed. Install it"
            echo "  with Developer Mode on, from PowerShell:"
            echo '  `Add-AppxPackage -AllowUnsigned <file>.msix`. To install it'
            echo "  anywhere else, re-sign it with a certificate that machine trusts:"
            echo "  unpack it with makeappx, set the Publisher in AppxManifest.xml to"
            echo "  your certificate's subject, pack it again and sign it with signtool."
            echo "- Linux (x64 and arm64): mark the .AppImage executable and run it."
            echo
            echo "Android ships an"
            echo "APK per sample. iOS ships a simulator bundle per sample, because a"
            echo "bundle for a device has to be signed by a certificate Apple issued"
            echo "against a profile naming that device. The web archive is every sample"
            echo "as a page, with an index linking them."
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS-<platform>`.'
            echo
            echo "Built in this release:"
            echo
            for archive in artifacts/*.tar.gz artifacts/*.apk artifacts/*.dmg \
                artifacts/*.zip artifacts/*.msix artifacts/*.AppImage; do
              [ -e "$archive" ] || continue
              echo "- $(basename "$archive")"
            done
            echo
            echo "A sample that does not build on a platform is skipped rather than"
            echo "holding up the rest, so a pair missing from the list above failed to"
            echo "compile there. The workflow log says which."
          } > notes.md
          cat notes.md

      - name: Create or update the release
        # Published rather than drafted. A draft is invisible to everyone but the people
        # with write access to this repository, so a release nobody can download is the
        # same as no release at all.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "Sample apps $TAG" \
              --notes-file notes.md \
              artifacts/*
          fi
