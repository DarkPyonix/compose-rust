# Samples test -- builds every sample for every platform: the desktop matrix, Android,
# the iOS simulator and the browser. A `sample-v*` tag, or a dispatch naming one, also
# attaches the results to a GitHub Release.
#
# On a pull request it is a heavy check, so it runs only when asked: the run-heavy-ci
# label, or a push while the label is on (heavy-checks.yml holds the merge until it has
# passed on the head). Then it builds everything and releases nothing. The paths below are
# the ones a sample build reads beyond the crate itself; a change to compose-rust alone is
# tested by the workspace's own tests, which include every sample's.
#
# A release also puts the same files in the `samples-latest` release, a fixed place that
# always holds the newest samples. Both releases are in this repository and are written
# with the workflow's own token.
#
# A sample that does not build on a platform is skipped and the release goes ahead with
# the rest. Eleven samples across three platforms is thirty-three builds, and holding all
# of them back because one of them broke on one platform helps nobody. A platform where
# nothing at all built is a different thing and still fails the run.
#
# Separate from release.yml on purpose. That workflow ships the library: the renderer
# artifacts and the crate. This one ships programs a person downloads and runs, and the
# two should be versioned apart so a sample can be rebuilt without implying a library
# release, and a library release is not held up by a sample that does not build.
#
# Each sample links the renderer for its platform, built as a Kotlin/Native static library
# (static-renderer.yml on macOS and Linux, windows-static.yml on Windows), so each sample is
# one executable on every desktop platform.
#
# What a release carries, per sample and target, named `<sample>-<target>.<ext>`:
#   - every desktop target: `.tar.gz` of the executable;
#   - macos-aarch64: a `.app` signed ad hoc (packager-macos, verified with
#     `codesign --verify --deep --strict`) inside a `.dmg`;
#   - linux-x64, linux-arm64: an `.AppImage` (packager-linux);
#   - windows-x64: a `.zip` and an unsigned `.msix` (packager-windows, sideload channel).
# Android ships an APK, iOS a simulator bundle, the web one archive of pages. Velopack
# installers and updates are not part of this release; that is still open under FR-22.6.
#
# Tag and release naming:
#   - The tag is `sample-v<crate version>` (compose-rust/Cargo.toml) and goes on a merge
#     commit of `main` only. The release job refuses a tag whose commit is not on `main`,
#     or whose version is not the crate's.
#   - The release for the tag is never `latest` (that belongs to the library's `v*`
#     releases). `samples-latest` is a pre-release that moves to the newest tag and holds
#     the same files.
#   - A dispatch with no tag, or with `desktop_only`, builds and uploads workflow artifacts
#     and creates no release (a dry run). `desktop_only` skips Android, iOS and the web.

name: Samples test

on:
  push:
    tags:
      - 'sample-v*'
  pull_request:
    # Only when asked: the run-heavy-ci label going on, or a push or reopen while it is on.
    # The request job below decides; heavy-checks.yml holds the merge until it has passed.
    types: [synchronize, reopened, labeled]
    paths:
      - samples/**
      - scripts/build-sample-apks.sh
      - scripts/build-sample-pages.sh
      - renderer/desktop/scripts/build-sample-ios.sh
      - .github/workflows/test-samples.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sample-v* tag to build a release for; empty builds without releasing'
        required: false
        type: string
        default: ''
      desktop_only:
        description: 'Build the desktop targets only (skip Android, iOS and the web). A tag is ignored for release purposes: nothing is published'
        required: false
        type: boolean
        default: false

concurrency:
  # One run per pull request: a new commit cancels the older run. A tag push or a dispatch
  # is never cancelled, so a release is not cut short half way, and a second one for the
  # same tag waits. A run started by some other label going on gets a group of its own, so
  # it cannot cancel a heavy run.
  group: test-samples-${{ github.event.pull_request.number || inputs.tag || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-heavy-ci' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  # The renderers macOS and Linux ship, from the same reusable workflow the release uses,
  # so that every sample there is one executable, built the way an application is.
  static-renderer:
    name: renderer
    needs: requested
    strategy:
      fail-fast: false
      matrix:
        target: [macos-aarch64, linux-x64, linux-arm64]
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: ${{ matrix.target }}
      ref: ${{ inputs.tag || github.ref }}

  # The Windows renderer: Kotlin/Native, linked into the executable, so a Windows sample
  # is one file like the others. This replaces the GraalVM DLL the samples used to ship
  # beside the program. Its long first half is cached on exactly its inputs.
  windows-static:
    name: renderer (windows-x64)
    needs: requested
    uses: ./.github/workflows/windows-static.yml

  build:
    name: Build the sample (${{ matrix.target }})
    needs: [requested, static-renderer, windows-static]
    # One platform's renderer failing does not stop the others' samples.
    if: ${{ !cancelled() && needs.requested.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-aarch64
            static: true
          - runner: ubuntu-24.04
            target: linux-x64
            static: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            static: true
          - runner: windows-2022
            target: windows-x64
            static: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Take Git's coreutils out of the linker's way
        # Git for Windows carries a coreutils `link` in usr/bin, and a bash step finds it
        # before the MSVC linker, so every Rust build dies at `extra operand` before
        # reaching a single sample.
        #
        # Renaming that one file rather than rearranging PATH, and rather than reaching
        # for an action that sets up the whole developer environment: the runner already
        # has a working MSVC toolchain that cargo finds on its own, and the only thing
        # wrong is one name being shadowed. Setting up a second environment to fix one
        # shadowed name is how `VsDevCmd.bat failed to initialise the x64 compiler
        # environment` happened.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shadow="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$shadow" ]; then
            mv "$shadow" "$shadow.coreutils"
            echo "moved the coreutils link out of the way"
          fi
          echo "link.exe now resolves to: $(command -v link || echo 'nothing on PATH')"

      - name: Install the libraries a Linux application links
        # Development packages, because linking names libX11.so and friends. The
        # executable needs only their runtime halves, which a desktop already has.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libgl1-mesa-dev libegl-dev libfontconfig1-dev libfreetype-dev \
            desktop-file-utils appstream gnupg

      - name: Download the static renderer
        if: matrix.static
        uses: actions/download-artifact@v4
        with:
          pattern: compose-rust-renderer-v*-${{ matrix.target }}
          path: renderer-artifact
          merge-multiple: true

      - name: Unpack it where the build will be pointed
        if: matrix.static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renderer"
          tar -xzf renderer-artifact/*.tar.gz -C "$RUNNER_TEMP/renderer"
          ls -la "$RUNNER_TEMP/renderer/lib"
          echo "RENDERER=$RUNNER_TEMP/renderer" >> "$GITHUB_ENV"

      - name: Take the Windows renderer kit
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-static-renderer-kit
          path: ${{ runner.temp }}/renderer-kit

      - name: Point the build at the Windows renderer
        if: runner.os == 'Windows'
        shell: bash
        # Absolute: a build script runs with its crate directory as the working directory.
        run: echo "DXC_WINDOWS_NATIVE_LIB=$(cygpath -m "$RUNNER_TEMP/renderer-kit")" >> "$GITHUB_ENV"

      - name: Build every sample against it
        # A sample that does not build is skipped rather than allowed to end the run. The
        # point of this workflow is to put programs in front of people, and one sample
        # failing to compile on one platform is not a reason to ship none of the other ten
        # anywhere. Which ones built is written to `built.txt` and the packaging step
        # reads it, so a sample that failed here cannot be packaged from a stale binary
        # left by an earlier run.
        shell: bash
        run: |
          set -uo pipefail
          [[ -z "${RENDERER:-}" ]] || export COMPOSE_RUST_RENDERER_DIR="$RENDERER"
          : > built.txt
          : > skipped.txt
          for manifest in samples/*/Cargo.toml; do
            app="$(basename "$(dirname "$manifest")")"
            # Only the ones that are programs. `frames` is a library the others record
            # their screens through, so it builds and then has no binary to ship, which
            # is not a failure and must not be reported as one.
            if [[ ! -f "samples/$app/src/main.rs" ]]; then
              echo "-- $app is a library, not an application"
              continue
            fi
            echo "== sample-$app"
            if cargo build --release -p "sample-$app" --features compose-rust/native-renderer; then
              echo "$app" >> built.txt
            else
              echo "$app" >> skipped.txt
              echo "::warning title=Sample skipped::sample-$app did not build for ${{ matrix.target }}"
            fi
          done
          echo "built:"; cat built.txt
          echo "skipped:"; cat skipped.txt
          mkdir -p artifacts
          [[ ! -s skipped.txt ]] || sed "s/\$/ ${{ matrix.target }}/" skipped.txt > "artifacts/skipped-${{ matrix.target }}.txt"
          # Nothing at all is a different case. That is the renderer or the toolchain
          # being wrong rather than one sample being wrong, and shipping an empty platform
          # quietly would hide it.
          if [[ ! -s built.txt ]]; then
            echo "::error title=No samples built::every sample failed on ${{ matrix.target }}, which is the platform being broken rather than a sample"
            exit 1
          fi

      - name: Package each sample
        # On every desktop platform a sample is one executable with the renderer inside it,
        # and that file is the whole archive.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while read -r app; do
            [[ -n "$app" ]] || continue
            stage="staging/$app"
            mkdir -p "$stage"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "target/release/sample-$app.exe" "$stage/"
            else
              cp "target/release/sample-$app" "$stage/"
              # Nothing may travel with it, so nothing it names may be anything but the
              # system's.
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                otool -L "$stage/sample-$app"
              else
                readelf -d "$stage/sample-$app" | grep -E '\((NEEDED|RPATH|RUNPATH)\)'
              fi
            fi
            tar -czf "artifacts/$app-${{ matrix.target }}.tar.gz" -C staging "$app"
          done < built.txt

      - name: Make each macOS sample an ad hoc signed application in a disk image
        # A sample that fails here keeps its archive and loses only the .app and .dmg.
        # Ad hoc signing needs no Apple account; Gatekeeper asks once on a downloaded copy.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' compose-rust/Cargo.toml | head -n 1)"
          while read -r app; do
            [[ -n "$app" ]] || continue
            out="apps/$app"
            mkdir -p "$out"
            if uv run scripts/packager-macos/package-macos app \
                  --manifest-dir "samples/$app" --executable "target/release/sample-$app" \
                  --version "$version" --out "$out" \
               && bundle="$(find "$out" -maxdepth 1 -name '*.app' | head -n 1)" \
               && [[ -n "$bundle" ]] \
               && codesign --verify --deep --strict --verbose=2 "$bundle" \
               && uv run scripts/packager-macos/package-macos dmg --app "$bundle" \
                  --out "artifacts/$app-${{ matrix.target }}.dmg"; then
              ditto -c -k --keepParent "$bundle" "artifacts/$app-${{ matrix.target }}.app.zip"
            else
              echo "::warning title=No application bundle::sample-$app was not packaged as a signed .app and .dmg for ${{ matrix.target }}"
            fi
          done < built.txt

      - name: Zip and package each Windows sample
        # A .zip of the executable, and an unsigned .msix. The MSIX is on the sideload
        # channel with no identity from Partner Center: installing it needs developer mode,
        # or signing it again with a certificate the machine trusts.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          cargo build --release -p compose-rust-msix --bin compose-rust-msix
          while read -r app; do
            [[ -n "$app" ]] || continue
            powershell -NoProfile -Command "Compress-Archive -Force -Path 'staging/$app/sample-$app.exe' -DestinationPath 'artifacts/$app-${{ matrix.target }}.zip'" \
              || echo "::warning title=No zip::sample-$app was not zipped for ${{ matrix.target }}"
            out="msix/$app"; mkdir -p "$out"
            if target/release/compose-rust-msix.exe --project "samples/$app" \
                 --exe "target/release/sample-$app.exe" --channel sideload \
                 --out "$out" --summary "$out/summary.txt"; then
              pkg="$(sed -n 's/^package=//p' "$out/summary.txt" | tr -d '\r' | head -n 1)"
              if [[ -f "$pkg" ]]; then cp "$pkg" "artifacts/$app-${{ matrix.target }}.msix"
              else echo "::warning title=No MSIX::the packager reported no package for sample-$app"; fi
            else
              echo "::warning title=No MSIX::sample-$app was not packaged as an MSIX for ${{ matrix.target }}"
            fi
          done < built.txt

      - name: Wrap each Linux sample as an AppImage
        # The same staged directory, as one file. A sample that fails here keeps its
        # archive and loses only the AppImage.
        #
        # Signed when the repository has a signing key.
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.APPIMAGE_SIGNING_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          # The crate's version, so a dry run on a branch is named like the release.
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' compose-rust/Cargo.toml | head -n 1)"
          sign=()
          if [[ -n "$SIGNING_KEY" ]]; then
            export GNUPGHOME="$PWD/.scratch/gnupg" && mkdir -p -m 700 "$GNUPGHOME"
            gpg --batch --import <<<"$SIGNING_KEY"
            sign=(--sign-key "$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')")
          else
            echo "::warning title=Unsigned AppImages::APPIMAGE_SIGNING_KEY is not set, so the AppImages are not signed"
          fi
          cargo build --release -p packager-linux
          export PACKAGER_LINUX="$PWD/target/release/packager-linux"
          while read -r app; do
            [[ -n "$app" ]] || continue
            # scripts/make-sample-icons.py draws a 256 pixel icon beside the 64 pixel
            # one the window wears; a sample that brings its own may have only the one.
            icons=(--icon "samples/$app/assets/icon.png")
            [[ -f "samples/$app/assets/icon-256.png" ]] && icons+=(--icon "samples/$app/assets/icon-256.png")
            if ! scripts/packager-linux/appimage.sh \
                --dioxus-toml "samples/$app/Dioxus.toml" \
                --overlay scripts/packager-linux/samples.toml \
                --exec "sample-$app" "${icons[@]}" \
                --payload "staging/$app" --version "$version" \
                ${sign[@]+"${sign[@]}"} \
                --out-dir artifacts; then
              echo "::warning title=No AppImage::sample-$app was not wrapped as an AppImage for ${{ matrix.target }}"
            fi
          done < built.txt

      - name: Record checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # find, not a glob list: no platform makes every file type, and a pattern that
          # matches nothing must not end the step under pipefail.
          files="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.msix' -o -name '*.dmg' \) | sed 's#^\./##' | sort -u)"
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          # shellcheck disable=SC2086
          "${sum[@]}" $files > "SHA256SUMS-${{ matrix.target }}"
          cat "SHA256SUMS-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.target }}
          path: artifacts/


  android:
    needs: requested
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.desktop_only) }}
    name: Build the sample (Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK
        # The runner already has an Android SDK with its licences accepted, so the setup
        # action is a second one that tries to accept them again and fails inside
        # sdkmanager. Only the NDK is missing, and the SDK that is here can fetch it.
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache Gradle and Maven dependencies
        # Gradle, not the Kotlin toolchain: an application's Kotlin is compiled by its own
        # Gradle build here rather than by ours.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-android-${{ hashFiles('compose-rust/android-kotlin/**') }}
          restore-keys: gradle-android-

      - name: Install the Dioxus CLI
        # The samples are built the way anyone else would build them. Pinned, so that an
        # upstream release cannot change what a tagged sample release was built with.
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build an APK for every sample
        run: ./scripts/build-sample-apks.sh artifacts

      - name: Checksum
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS-android
          cat SHA256SUMS-android

      - uses: actions/upload-artifact@v4
        with:
          name: samples-android
          path: artifacts/

  ios:
    needs: requested
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.desktop_only) }}
    name: Build the sample (iOS, simulator)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-ios-sim

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-ios-${{ hashFiles('renderer/**/module.yaml') }}
          restore-keys: kotlin-ios-

      - name: Build the renderer for the simulator
        run: ./renderer/desktop/scripts/build-ios.sh --target simulator

      - name: Wrap every sample in an application bundle
        # Simulator only. A bundle for a device has to be signed by a certificate Apple
        # issued against a profile naming that device, and there is none here.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          built=0
          for manifest in samples/*/Cargo.toml; do
            sample="$(basename "$(dirname "$manifest")")"
            # An application rather than a library: every sample is a library now.
            [[ -f "samples/$sample/src/main.rs" ]] || continue
            if ./renderer/desktop/scripts/build-sample-ios.sh "$sample" --release; then
              tar -czf "artifacts/$sample-ios-simulator.tar.gz" \
                -C renderer/build/ios/samples "sample-$sample.app"
              built=$((built + 1))
            else
              echo "::warning title=Sample skipped::$sample did not build for the iOS simulator"
            fi
          done
          [[ $built -gt 0 ]] || { echo "::error::no sample built for iOS"; exit 1; }
          cd artifacts && shasum -a 256 *.tar.gz > SHA256SUMS-ios-simulator

      - uses: actions/upload-artifact@v4
        with:
          name: samples-ios-simulator
          path: artifacts/

  web:
    needs: requested
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.desktop_only) }}
    name: Build the sample (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-web-${{ hashFiles('renderer/**/module.yaml') }}
          restore-keys: kotlin-web-

      - name: Build a page for every sample
        run: ./scripts/build-sample-pages.sh pages

      - name: Pack the pages as one archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf artifacts/samples-web.tar.gz -C pages .
          cd artifacts && sha256sum samples-web.tar.gz > SHA256SUMS-web

      - uses: actions/upload-artifact@v4
        with:
          name: samples-web
          path: artifacts/

  release:
    name: Attach the samples to the GitHub release
    needs: [build, android, ios, web]
    # A tag, or a dispatch that names one, and not a desktop-only dispatch. A pull request
    # run and a dispatch without a tag build everything and stop there (a dry run). The
    # mobile and web jobs may be skipped; the desktop build must have run.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (github.event_name == 'push' || (inputs.tag != '' && !inputs.desktop_only)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag names a main merge commit and the crate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' compose-rust/Cargo.toml | head -n 1)"
          if [[ "$TAG" != "sample-v$version" ]]; then
            echo "::error title=Wrong tag::$TAG is not sample-v$version, the version in compose-rust/Cargo.toml"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Tag not on main::$TAG points at a commit that is not on main. Tag the merge commit of the release pull request into main."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: samples-*
          path: downloaded

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Say which sample and platform pairs are in this release
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Sample applications, per sample and platform. Files are named <sample>-<platform>.<ext>."
            echo
            echo "Every desktop archive contains one executable, with the renderer inside"
            echo "it; it runs from anywhere. Android ships an"
            echo "APK per sample. iOS ships a simulator bundle per sample, because a"
            echo "bundle for a device has to be signed by a certificate Apple issued"
            echo "against a profile naming that device. The web archive is every sample"
            echo "as a page, with an index linking them."
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS-<platform>`.'
            echo
            echo "Linux also ships each sample as an AppImage. Make it executable and run it."
            echo
            echo "macOS also ships each sample as a .app inside a .dmg (and the .app as a"
            echo ".app.zip). The app is signed ad hoc, not by an Apple developer identity, so"
            echo "Gatekeeper blocks the first launch of a downloaded copy: right-click the app"
            echo "and choose Open, or run xattr -dr com.apple.quarantine <App>.app."
            echo
            echo "Windows also ships a .zip and an unsigned .msix. Installing the MSIX needs"
            echo "Windows developer mode, or signing it again with a certificate the machine"
            echo "trusts."
            echo
            echo "No Velopack installers or auto-update yet; that is a remaining part of"
            echo "FR-22.6."
            echo
            echo "Built from $GITHUB_REPOSITORY at $(git rev-parse --short HEAD) ($TAG)."
            echo
            echo "Built in this release:"
            echo
            for archive in artifacts/*.tar.gz artifacts/*.AppImage artifacts/*.dmg artifacts/*.zip artifacts/*.msix artifacts/*.apk; do
              [ -e "$archive" ] || continue
              echo "- $(basename "$archive")"
            done
            echo
            echo "A sample that does not build on a platform is skipped rather than"
            echo "holding up the rest. Skipped sample and platform pairs (empty means none"
            echo "on the desktop; the workflow log says why):"
            echo
            for f in artifacts/skipped-*.txt; do
              [ -s "$f" ] || continue
              sed 's/^/- /' "$f"
            done
          } > notes.md
          cat notes.md

      - name: Create or update the release for this tag
        # Published rather than drafted. A draft is invisible to everyone but the people
        # with write access to this repository, so a release nobody can download is the
        # same as no release at all. Never marked latest: that belongs to the library's
        # v* releases, and a sample release that took it would make the newest library
        # release look older than it is.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --latest=false --notes-file notes.md
          else
            gh release create "$TAG" --latest=false \
              --title "Sample apps $TAG" \
              --notes-file notes.md \
              artifacts/*
          fi

      - name: Replace the files of the samples-latest release
        # The release tagged samples-latest always holds the newest samples at one fixed
        # address. It is a pre-release and never latest, so it does not compete with the
        # library's v* releases. It is updated in place: the new files are uploaded over
        # the old ones first, and only then are the files the new set lacks removed, so a
        # download in the middle still finds a file. Rebuilding an older tag leaves it
        # alone, so samples-latest never goes backwards.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          FEED: samples-latest
        run: |
          set -euo pipefail
          newest="$(git ls-remote --tags --refs origin 'refs/tags/sample-v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -n 1)"
          if [[ -n "$newest" && "$newest" != "$TAG" ]]; then
            echo "::notice title=samples-latest unchanged::$TAG is older than $newest, which is what samples-latest carries"
            exit 0
          fi
          sha="$(git rev-parse HEAD)"
          title="Sample apps, newest ($TAG)"
          if gh release view "$FEED" >/dev/null 2>&1; then
            # The tag follows the build, so the release names the commit its files came
            # from.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$FEED" \
              -f sha="$sha" -F force=true >/dev/null \
              || echo "::warning title=samples-latest tag not moved::the files are $TAG's, but the tag still points at the previous build"
            gh release edit "$FEED" --draft=false --prerelease --latest=false \
              --title "$title" --notes-file notes.md
          else
            gh release create "$FEED" --target "$sha" --prerelease --latest=false \
              --title "$title" --notes-file notes.md
          fi
          gh release upload "$FEED" artifacts/* --clobber
          keep="$(cd artifacts && ls -1)"
          gh release view "$FEED" --json assets --jq '.assets[].name' | while read -r asset; do
            if ! grep -qxF "$asset" <<<"$keep"; then
              gh release delete-asset "$FEED" "$asset" --yes
            fi
          done
