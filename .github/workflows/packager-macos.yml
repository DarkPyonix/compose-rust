# macOS packaging: the packager's tests and the updater crate's tests.
#
# The rehearsal that installs one version of an application and watches it update itself
# to the next is in experiments/self-update on develop. It builds a Dioxus application
# against the published dioxus-compose, which nothing outside experiments may do, and
# experiments/ is removed from main, so this workflow no longer runs it.

name: macOS packaging

on:
  push:
    branches: [develop, main, 'feature/packager-*']
    paths:
      - 'scripts/packager-macos/**'
      - 'compose-rust/update/**'
      - 'scripts/bundle-renderer.sh'
      - '.github/workflows/packager-macos.yml'
  pull_request:
    paths:
      - 'scripts/packager-macos/**'
      - 'compose-rust/update/**'
      - 'scripts/bundle-renderer.sh'
      - '.github/workflows/packager-macos.yml'
  workflow_dispatch:

concurrency:
  group: packager-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SPARKLE_VERSION: '2.10.0'
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

jobs:
  packager:
    name: Packager tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unpack Sparkle
        # On macOS the tests also compare against Sparkle's own tools and sign a real
        # Sparkle.framework. Linux has neither codesign nor Sparkle, and runs the rest.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sparkle"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $dir/Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$dir/Sparkle.tar.xz" -C "$dir"
          echo "SPARKLE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Run the packager's tests
        run: python -m unittest discover -s scripts/packager-macos/tests -v

  updater:
    name: Updater crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Test
        run: cargo test -p compose-rust-update

      - name: Lint
        run: cargo clippy -p compose-rust-update --all-targets -- -D warnings
