# Desktop packaging: the macOS packager's tests, and Velopack packages and self-update on
# macOS, Linux and Windows. Called by ci.yml, which only the leader dispatches.

name: Desktop packaging

on:
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  packager:
    name: Packager tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the packager's tests
        run: python -m unittest discover -s scripts/packager-macos/tests -v

  # Velopack direct distribution, one job per OS. Each builds the Velopack fixture app
  # (scripts/tests/velopack-fixture) as 1.0.0 and 1.0.1, packs both with
  # scripts/package-velopack.py, installs 1.0.0 the way a person would, lets it update
  # itself from the 1.0.1 feed and runs it again; scripts/tests/fr22-velopack.test.sh says
  # what each step checks. vpk is pinned to the velopack crate the fixture uses, because
  # Velopack wants the two at the same version.
  velopack-macos:
    name: Velopack packaging and self-update (macos-latest)
    runs-on: macos-latest
    env:
      VPK_VERSION: '1.2.161'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack, install from the .dmg and update the ad hoc signed app
        run: ./scripts/tests/fr22-velopack.test.sh macos

      - name: Build and verify Mac App Store .pkg
        run: |
          set -euo pipefail
          COMPOSE_RUST_APP_VERSION=1.0.0 cargo build --release -p packager-linux-demo
          out_dir="$RUNNER_TEMP/mas-pkg"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          scripts/packager-macos/package-macos app \
            --manifest-dir scripts/packager-linux/demo \
            --executable target/release/update-demo \
            --version 1.0.0 \
            --out "$out_dir"
          app_path="$out_dir/UpdateDemo.app"
          pkg_path="$out_dir/UpdateDemo-1.0.0.pkg"
          scripts/packager-macos/package-macos pkg \
            --app "$app_path" \
            --out "$pkg_path" \
            --verify
          payload="$(pkgutil --payload-files "$pkg_path")"
          echo "$payload"
          grep -q "UpdateDemo.app/Contents/Info.plist" <<<"$payload"
          grep -q "UpdateDemo.app/Contents/MacOS/packager-linux-demo" <<<"$payload"
          grep -q "UpdateDemo.app/Contents/Resources/AppIcon.icns" <<<"$payload"
          sig="$(pkgutil --check-signature "$pkg_path" 2>&1 || true)"
          echo "$sig"
          grep -qiE "signed|no signature|not signed" <<<"$sig"
          shasum -a 256 "$pkg_path" > "${pkg_path}.sha256"
          cat "${pkg_path}.sha256"
          shasum -a 256 -c "${pkg_path}.sha256"

  velopack-linux:
    name: Velopack packaging and self-update (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      VPK_VERSION: '1.2.161'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install squashfs-tools and libfuse2
        # vpk builds the AppImage's file system with mksquashfs, and the AppImage runtime
        # vpk uses (AppImageKit's) mounts itself through libfuse2, which Ubuntu 24.04 ships
        # as libfuse2t64. libfuse2 mounts by running fusermount, which fuse3 provides.
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools libfuse2t64 fuse3

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack, run the AppImage and let it replace itself with the update
        run: ./scripts/tests/fr22-velopack.test.sh linux

  velopack-windows:
    name: Velopack packaging and self-update (windows-latest)
    runs-on: windows-latest
    env:
      VPK_VERSION: '1.2.161'
      PYTHON: python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$USERPROFILE\.dotnet\tools" >> "$GITHUB_PATH"

      - name: Pack, install with Setup.exe and take a delta update
        run: ./scripts/tests/fr22-velopack.test.sh windows

      - name: Build and check .msi package (PerUser and PerMachine)
        # FR-22.6 criteria 5 and 10: vpk pack --msi writes the file, and its Property
        # table is read back (scripts/tests/msi-info.ps1) for name, manufacturer and
        # version. PerUser is what Velopack's Setup.exe does too; PerMachine is the
        # optional one. Neither is installed here; a hand install stays manual.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'msi-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          cargo build --release -p packager-linux-demo
          Copy-Item 'target\release\update-demo.exe' (Join-Path $stage 'update-demo.exe')
          foreach ($scope in 'PerUser', 'PerMachine') {
            $out = Join-Path $env:RUNNER_TEMP "msi-out-$scope"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            vpk pack --packId ComposeRustDemo --packVersion 1.0.0 --packDir $stage --mainExe update-demo.exe --outputDir $out --msi --instLocation $scope
            if ($LASTEXITCODE -ne 0) { throw "vpk pack --msi --instLocation $scope failed" }
            $msi = Get-ChildItem -Path $out -Filter '*.msi' | Select-Object -First 1
            if (-not $msi) { throw "vpk pack --msi --instLocation $scope did not produce an .msi file" }
            ./scripts/tests/msi-info.ps1 -Path $msi.FullName -Version 1.0.0 -ExpectedScope $scope
          }
