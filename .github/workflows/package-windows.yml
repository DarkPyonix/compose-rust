# Windows package -- builds an MSIX and an .msixbundle from one executable, signs them
# with a throwaway certificate, runs the Windows App Certification Kit against them, and
# proves that a newer bundle published to an App Installer feed replaces an installed one.
#
# The kit is what Partner Center runs on a submission, so a package that passes here is
# not refused there for the same reasons. The Store signs what it takes in itself; the
# test certificate exists only so that this machine will install the package.
#
# Two things are packaged, side by side:
#
#   stand-in  a tiny windowed program built here, described by the notepad sample's
#             metadata. It proves the pipeline in minutes and owes nothing to the
#             renderer.
#   host      a sample built here from this checkout, against the renderer from that
#             same release, so that what the crate now puts into every executable (its
#             application manifest) is in the package the kit inspects. This one has
#             to pass the kit's DPI awareness check outright.
#   sample    a real build: the program with the renderer and its companion files
#             beside it, the shape a dioxus-compose application ships in. By default the
#             notepad archive from a published sample release; dispatched with a run id,
#             an artifact from that run instead (a samples-windows-x64 artifact, or any
#             build packed the same way).
#
# Building the renderer is not part of this workflow. It takes most of an hour and a
# released build is exactly the input the packager is meant to take.

name: Windows package

on:
  push:
    paths:
      - 'tools/msix/**'
      - 'dioxus-compose/build.rs'
      - 'dioxus-compose/build/**'
      - 'dioxus-compose/tests/windows_manifest.rs'
      - '.github/workflows/package-windows.yml'
  pull_request:
    paths:
      - 'tools/msix/**'
      - 'dioxus-compose/build.rs'
      - 'dioxus-compose/build/**'
      - 'dioxus-compose/tests/windows_manifest.rs'
      - '.github/workflows/package-windows.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Application directory holding Dioxus.toml and Cargo.toml'
        default: 'samples/notepad'
        type: string
      payload_url:
        description: 'URL of a .tar.gz holding a real build (used when no run id is given)'
        default: 'https://github.com/DarkPyonix/dioxus-compose/releases/download/sample-v0.1.1/notepad-windows-x64.tar.gz'
        type: string
      payload_run_id:
        description: 'Run id whose artifact holds the build to package instead of the URL'
        default: ''
        type: string
      payload_artifact:
        description: 'Artifact name in that run'
        default: 'samples-windows-x64'
        type: string
      payload_archive:
        description: 'Archive inside the artifact'
        default: 'notepad-windows-x64.tar.gz'
        type: string
      payload_root:
        description: 'Directory inside the archive that becomes the package root'
        default: 'notepad'
        type: string
      payload_exe:
        description: 'The program, relative to that directory'
        default: 'bin/sample-notepad.exe'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: package-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PROJECT: ${{ inputs.project || 'samples/notepad' }}
  PAYLOAD_URL: ${{ inputs.payload_url || 'https://github.com/DarkPyonix/dioxus-compose/releases/download/sample-v0.1.1/notepad-windows-x64.tar.gz' }}
  PAYLOAD_ARCHIVE: ${{ inputs.payload_archive || 'notepad-windows-x64.tar.gz' }}
  PAYLOAD_ROOT: ${{ inputs.payload_root || 'notepad' }}
  PAYLOAD_EXE: ${{ inputs.payload_exe || 'bin/sample-notepad.exe' }}

jobs:
  test:
    name: Packager tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt -p dioxus-compose-msix -- --check

      - name: Clippy
        run: cargo clippy --locked -p dioxus-compose-msix --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked -p dioxus-compose-msix

      - name: Application manifest resource
        # The resource the crate's build script writes into every Windows program. The
        # renderer is not needed to check its bytes, so the crate is built without it.
        if: runner.os == 'Linux'
        run: cargo test --locked -p dioxus-compose --no-default-features --test windows_manifest

  package:
    name: Package, sign and certify (${{ matrix.payload }})
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        payload: [stand-in, sample]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the packager and the stand-in program
        run: cargo build --locked --release -p dioxus-compose-msix --bin dioxus-compose-msix --example fixture-app

      - name: Fetch the build from a run
        if: matrix.payload == 'sample' && inputs.payload_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.payload_run_id }}
          name: ${{ inputs.payload_artifact }}
          path: payload-artifact
          github-token: ${{ github.token }}

      - name: Fetch the build from a release
        if: matrix.payload == 'sample' && inputs.payload_run_id == ''
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path payload-artifact | Out-Null
          Invoke-WebRequest -Uri $env:PAYLOAD_URL -OutFile "payload-artifact\$env:PAYLOAD_ARCHIVE"

      - name: Package
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = 'target\release\dioxus-compose-msix.exe'
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          $summary = Join-Path $env:RUNNER_TEMP 'msix-summary.txt'
          if ('${{ matrix.payload }}' -eq 'sample') {
            $unpacked = Join-Path $env:RUNNER_TEMP 'payload'
            New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
            tar -xzf "payload-artifact\$env:PAYLOAD_ARCHIVE" -C $unpacked
            if ($LASTEXITCODE -ne 0) { throw "could not unpack $env:PAYLOAD_ARCHIVE" }
            Get-ChildItem -Recurse (Join-Path $unpacked $env:PAYLOAD_ROOT) | Select-Object -ExpandProperty FullName
            & $tool --project $env:PROJECT --out $out --summary $summary --test-identity `
              --payload-dir (Join-Path $unpacked $env:PAYLOAD_ROOT) --exe $env:PAYLOAD_EXE
          } else {
            & $tool --project $env:PROJECT --out $out --summary $summary --test-identity `
              --exe 'target\release\examples\fixture-app.exe'
          }
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Get-Content $summary | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          Get-Content (Join-Path $out 'layout\AppxManifest.xml')

      - name: Create and trust a test certificate
        id: cert
        run: >
          ./tools/msix/scripts/new-test-certificate.ps1
          -Publisher '${{ steps.pack.outputs.publisher }}'
          -OutDir "$env:RUNNER_TEMP\cert" -Trust

      - name: Sign
        run: >
          ./tools/msix/scripts/sign.ps1
          -Path '${{ steps.pack.outputs.package }}','${{ steps.pack.outputs.bundle }}'
          -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}'

      - name: Install and uninstall the bundle
        run: |
          $ErrorActionPreference = 'Stop'
          Add-AppxPackage -Path '${{ steps.pack.outputs.bundle }}'
          $installed = Get-AppxPackage -Name '${{ steps.pack.outputs.identity }}'
          if (-not $installed) { throw "the bundle did not install" }
          Write-Host "installed $($installed.PackageFullName) at $($installed.InstallLocation)"
          if ($installed.Version -ne '${{ steps.pack.outputs.version }}') { throw "installed $($installed.Version), packaged ${{ steps.pack.outputs.version }}" }
          $installed | Remove-AppxPackage

      - name: Windows App Certification Kit (package)
        run: >
          ./tools/msix/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.package }}'
          -Report "$env:RUNNER_TEMP\wack\package-report.xml"

      - name: Windows App Certification Kit (bundle)
        run: >
          ./tools/msix/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.bundle }}'
          -Report "$env:RUNNER_TEMP\wack\bundle-report.xml"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-reports-${{ matrix.payload }}
          path: ${{ runner.temp }}/wack/
          if-no-files-found: warn

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages-${{ matrix.payload }}
          path: |
            ${{ runner.temp }}/msix/*.msix
            ${{ runner.temp }}/msix/*.msixbundle
            ${{ runner.temp }}/cert/test-signing.cer
          if-no-files-found: warn

  host:
    name: Build a sample here, package and certify it
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Fetch a released renderer
        # The renderer is not built here. The released notepad archive carries the
        # renderer DLL, its import library and the files AWT reads, which is everything
        # the crate needs to link a host against. It predates schema hashes, so the build
        # warns that it cannot tell whether the two agree; the drawing is not what this
        # job checks, the executable and its manifest are.
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path payload-artifact | Out-Null
          Invoke-WebRequest -Uri $env:PAYLOAD_URL -OutFile "payload-artifact\$env:PAYLOAD_ARCHIVE"
          $unpacked = Join-Path $env:RUNNER_TEMP 'renderer'
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          tar -xzf "payload-artifact\$env:PAYLOAD_ARCHIVE" -C $unpacked
          if ($LASTEXITCODE -ne 0) { throw "could not unpack $env:PAYLOAD_ARCHIVE" }
          Add-Content -Path $env:GITHUB_ENV -Value "DIOXUS_COMPOSE_RENDERER_DIR=$(Join-Path $unpacked $env:PAYLOAD_ROOT)" -Encoding utf8

      - name: Build the packager and the notepad sample
        run: |
          cargo build --locked --release -p dioxus-compose-msix --bin dioxus-compose-msix
          if ($LASTEXITCODE -ne 0) { throw "the packager did not build" }
          cargo build --locked --release -p sample-notepad --bin sample-notepad
          if ($LASTEXITCODE -ne 0) { throw "the sample did not build" }

      - name: Show the manifest embedded in the sample
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/msix/scripts/common.ps1
          $mt = Find-SdkTool 'mt.exe'
          $exe = 'target\release\sample-notepad.exe'
          & $mt -nologo "-inputresource:$exe;#1" "-out:$env:RUNNER_TEMP\embedded.manifest"
          if ($LASTEXITCODE -ne 0) { throw "sample-notepad.exe has no embedded manifest" }
          $text = Get-Content -Raw "$env:RUNNER_TEMP\embedded.manifest"
          Write-Host $text
          if ($text -notmatch 'PerMonitorV2') { throw "the embedded manifest does not declare PerMonitorV2" }

      - name: Lay the sample out beside the renderer and package it
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'host-payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          foreach ($child in 'bin', 'lib') {
            Copy-Item -Recurse -Path (Join-Path $env:DIOXUS_COMPOSE_RENDERER_DIR $child) -Destination $payload
          }
          Copy-Item -Force 'target\release\sample-notepad.exe' (Join-Path $payload 'bin\sample-notepad.exe')
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          $summary = Join-Path $env:RUNNER_TEMP 'msix-summary.txt'
          & 'target\release\dioxus-compose-msix.exe' --project $env:PROJECT --out $out --summary $summary `
            --test-identity --payload-dir $payload --exe 'bin\sample-notepad.exe'
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Get-Content $summary | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create and trust a test certificate
        id: cert
        run: >
          ./tools/msix/scripts/new-test-certificate.ps1
          -Publisher '${{ steps.pack.outputs.publisher }}'
          -OutDir "$env:RUNNER_TEMP\cert" -Trust

      - name: Sign
        run: >
          ./tools/msix/scripts/sign.ps1
          -Path '${{ steps.pack.outputs.package }}','${{ steps.pack.outputs.bundle }}'
          -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}'

      - name: Windows App Certification Kit (DPI awareness must pass)
        run: >
          ./tools/msix/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.bundle }}'
          -Report "$env:RUNNER_TEMP\wack\host-bundle-report.xml"
          -RequirePass DPIAwarenessValidation

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-reports-host
          path: ${{ runner.temp }}/wack/
          if-no-files-found: warn

  update:
    name: App Installer update
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the packager and the stand-in program
        run: cargo build --locked --release -p dioxus-compose-msix --bin dioxus-compose-msix --example fixture-app

      - name: Package two builds of one release for the sideload channel
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = 'target\release\dioxus-compose-msix.exe'
          foreach ($revision in 1, 2) {
            $out = Join-Path $env:RUNNER_TEMP "sideload-$revision"
            $summary = Join-Path $env:RUNNER_TEMP "sideload-$revision.txt"
            & $tool --project $env:PROJECT --out $out --summary $summary `
              --channel sideload --revision $revision `
              --feed-base 'http://localhost:8642' `
              --exe 'target\release\examples\fixture-app.exe'
            if ($LASTEXITCODE -ne 0) { throw "packaging revision $revision failed" }
            Get-Content (Join-Path $out '*.appinstaller')
          }
          Get-Content (Join-Path $env:RUNNER_TEMP 'sideload-1.txt') |
            Where-Object { $_ -match '^(identity|publisher|bundle)=' } |
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          $bundle2 = (Get-Content (Join-Path $env:RUNNER_TEMP 'sideload-2.txt') | Where-Object { $_ -match '^bundle=' }) -replace '^bundle=', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "bundle2=$bundle2" -Encoding utf8

      - name: Create and trust a test certificate
        id: cert
        run: >
          ./tools/msix/scripts/new-test-certificate.ps1
          -Publisher '${{ steps.pack.outputs.publisher }}'
          -OutDir "$env:RUNNER_TEMP\cert" -Trust

      - name: Sign both bundles
        run: >
          ./tools/msix/scripts/sign.ps1
          -Path '${{ steps.pack.outputs.bundle }}','${{ steps.pack.outputs.bundle2 }}'
          -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}'

      - name: Install from the feed, publish a newer build, update
        shell: powershell
        run: >
          ./tools/msix/scripts/test-update.ps1
          -Older "$env:RUNNER_TEMP\sideload-1"
          -Newer "$env:RUNNER_TEMP\sideload-2"
          -Serve "$env:RUNNER_TEMP\feed"
          -Port 8642
          -Name '${{ steps.pack.outputs.identity }}'
