# Windows package -- builds an MSIX and an .msixbundle from one executable, signs them
# with a throwaway certificate, and runs the Windows App Certification Kit against them.
#
# The kit is what Partner Center runs on a submission, so a package that passes here is
# not refused there for the same reasons. The Store signs what it takes in itself; the
# test certificate exists only so that this machine will install the package.
#
# Two things are packaged, side by side:
#
#   stand-in  a tiny windowed program built here, described by the notepad sample's
#             metadata. It proves the pipeline in minutes and owes nothing to the
#             renderer.
#   host      a sample built here from this checkout, against the published renderer
#             for this crate version (fetched by the crate's build script), so that what
#             the crate now puts into every executable (its application manifest) is in
#             the package the kit inspects. This one has to pass the kit's DPI awareness
#             check outright.
#
# Building the renderer is not part of this workflow. It takes most of an hour and a
# released build is exactly the input the packager is meant to take.

name: Windows package

on:
  push:
    paths:
      - 'scripts/packager-windows/**'
      - 'compose-rust/build.rs'
      - 'compose-rust/build/**'
      - 'compose-rust/tests/windows_manifest.rs'
      - '.github/workflows/package-windows.yml'
  pull_request:
    paths:
      - 'scripts/packager-windows/**'
      - 'compose-rust/build.rs'
      - 'compose-rust/build/**'
      - 'compose-rust/tests/windows_manifest.rs'
      - '.github/workflows/package-windows.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Application directory holding Dioxus.toml and Cargo.toml'
        default: 'samples/notepad'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: package-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PROJECT: ${{ inputs.project || 'samples/notepad' }}

jobs:
  test:
    name: Packager tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt -p compose-rust-msix -- --check

      - name: Clippy
        run: cargo clippy --locked -p compose-rust-msix --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked -p compose-rust-msix

      - name: Application manifest resource
        # The resource the crate's build script writes into every Windows program. The
        # renderer is not needed to check its bytes, so the crate is built without it.
        if: runner.os == 'Linux'
        run: cargo test --locked -p compose-rust --no-default-features --test windows_manifest

  package:
    name: Package, sign and certify (stand-in)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the packager and the stand-in program
        run: cargo build --locked --release -p compose-rust-msix --bin compose-rust-msix --example fixture-app

      - name: Package
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = 'target\release\compose-rust-msix.exe'
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          $summary = Join-Path $env:RUNNER_TEMP 'msix-summary.txt'
          & $tool --project $env:PROJECT --out $out --summary $summary --test-identity `
            --exe 'target\release\examples\fixture-app.exe'
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Get-Content $summary | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          Get-Content (Join-Path $out 'layout\AppxManifest.xml')

      - name: Create and trust a test certificate
        id: cert
        run: >
          ./scripts/packager-windows/scripts/new-test-certificate.ps1
          -Publisher '${{ steps.pack.outputs.publisher }}'
          -OutDir "$env:RUNNER_TEMP\cert" -Trust

      - name: Sign
        run: >
          ./scripts/packager-windows/scripts/sign.ps1
          -Path '${{ steps.pack.outputs.package }}','${{ steps.pack.outputs.bundle }}'
          -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}'

      - name: Install and uninstall the bundle
        run: |
          $ErrorActionPreference = 'Stop'
          Add-AppxPackage -Path '${{ steps.pack.outputs.bundle }}'
          $installed = Get-AppxPackage -Name '${{ steps.pack.outputs.identity }}'
          if (-not $installed) { throw "the bundle did not install" }
          Write-Host "installed $($installed.PackageFullName) at $($installed.InstallLocation)"
          if ($installed.Version -ne '${{ steps.pack.outputs.version }}') { throw "installed $($installed.Version), packaged ${{ steps.pack.outputs.version }}" }
          $installed | Remove-AppxPackage

      - name: Windows App Certification Kit (package)
        run: >
          ./scripts/packager-windows/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.package }}'
          -Report "$env:RUNNER_TEMP\wack\package-report.xml"

      - name: Windows App Certification Kit (bundle)
        run: >
          ./scripts/packager-windows/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.bundle }}'
          -Report "$env:RUNNER_TEMP\wack\bundle-report.xml"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-reports-stand-in
          path: ${{ runner.temp }}/wack/
          if-no-files-found: warn

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages-stand-in
          path: |
            ${{ runner.temp }}/msix/*.msix
            ${{ runner.temp }}/msix/*.msixbundle
            ${{ runner.temp }}/cert/test-signing.cer
          if-no-files-found: warn

  host:
    name: Build a sample here, package and certify it
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the packager and the notepad sample
        # COMPOSE_RUST_RENDERER_DIR is left unset on purpose. The crate's build script then
        # downloads the published Windows renderer for this crate version, the way any
        # consumer's build does, unpacks it into the user cache, and copies its `bin` and
        # `lib` beside the executables it builds. The renderer is not built here.
        run: |
          cargo build --locked --release -p compose-rust-msix --bin compose-rust-msix
          if ($LASTEXITCODE -ne 0) { throw "the packager did not build" }
          cargo build --locked --release -p sample-notepad --bin sample-notepad
          if ($LASTEXITCODE -ne 0) { throw "the sample did not build" }

      - name: Show the manifest embedded in the sample
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/packager-windows/scripts/common.ps1
          $mt = Find-SdkTool 'mt.exe'
          $exe = 'target\release\sample-notepad.exe'
          & $mt -nologo "-inputresource:$exe;#1" "-out:$env:RUNNER_TEMP\embedded.manifest"
          if ($LASTEXITCODE -ne 0) { throw "sample-notepad.exe has no embedded manifest" }
          $text = Get-Content -Raw "$env:RUNNER_TEMP\embedded.manifest"
          Write-Host $text
          if ($text -notmatch 'PerMonitorV2') { throw "the embedded manifest does not declare PerMonitorV2" }

      - name: Lay the sample out beside the renderer and package it
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'host-payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          # The build script left the renderer's distribution (`bin` with the DLLs, `lib` with
          # the files AWT reads) in the profile directory beside the executable.
          foreach ($child in 'bin', 'lib') {
            $source = Join-Path 'target\release' $child
            if (-not (Test-Path $source)) { throw "the build left no $child beside the sample, so no renderer was linked" }
            Copy-Item -Recurse -Path $source -Destination $payload
          }
          Copy-Item -Force 'target\release\sample-notepad.exe' (Join-Path $payload 'bin\sample-notepad.exe')
          $out = Join-Path $env:RUNNER_TEMP 'msix'
          $summary = Join-Path $env:RUNNER_TEMP 'msix-summary.txt'
          & 'target\release\compose-rust-msix.exe' --project $env:PROJECT --out $out --summary $summary `
            --test-identity --payload-dir $payload --exe 'bin\sample-notepad.exe'
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          Get-Content $summary | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create and trust a test certificate
        id: cert
        run: >
          ./scripts/packager-windows/scripts/new-test-certificate.ps1
          -Publisher '${{ steps.pack.outputs.publisher }}'
          -OutDir "$env:RUNNER_TEMP\cert" -Trust

      - name: Sign
        run: >
          ./scripts/packager-windows/scripts/sign.ps1
          -Path '${{ steps.pack.outputs.package }}','${{ steps.pack.outputs.bundle }}'
          -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}'

      - name: Windows App Certification Kit (DPI awareness must pass)
        run: >
          ./scripts/packager-windows/scripts/run-wack.ps1
          -Package '${{ steps.pack.outputs.bundle }}'
          -Report "$env:RUNNER_TEMP\wack\host-bundle-report.xml"
          -RequirePass DPIAwarenessValidation

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wack-reports-host
          path: ${{ runner.temp }}/wack/
          if-no-files-found: warn
