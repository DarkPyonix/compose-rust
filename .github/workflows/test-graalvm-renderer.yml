# GraalVM renderer test: builds the GraalVM native-image renderer and smoke tests it.
#
# Kotlin/Native is the default renderer now, and the macOS and Linux native-image jobs were
# removed from test-native-renderer.yml with it. The GraalVM window code
# (renderer/desktop/c/appkit_window.m, x11_window.c and the shared C and Kotlin files that
# path uses) still lives in this repository, so this workflow keeps building and starting it.
#
# This file exists until the window code moves to the Compose fork. It then moves to the
# fork's CI and is deleted here. The Windows native-image job stays in
# test-native-renderer.yml and is not repeated here.

name: GraalVM renderer test

on:
  pull_request:
    paths:
      - 'renderer/desktop/**'
      - 'renderer/libs.versions.toml'
      - 'renderer/kotlin'
      - 'renderer/**/module.yaml'
      - 'scripts/install-nik.sh'
      - 'scripts/fetch-fork-window.sh'
      - 'scripts/fetch-fork-skiko.sh'
      - 'scripts/publish-skiko-awt.sh'
      - 'experiments/static-library/**'
      - 'renderer/scripts/publish-window.sh'
      - 'renderer/scripts/build-compose.sh'
      - 'renderer/scripts/compose-fork.changes'
      - 'scripts/tests/renderer/**'
      - 'scripts/parity/**'
      - '.github/scripts/check-linux-input-access.sh'
      - '.github/scripts/atspi-walk.py'
      - '.github/workflows/test-graalvm-renderer.yml'
      - '.github/scripts/vertical-resize-run.sh'
      - '.github/scripts/vertical-resize-check.sh'
  push:
    branches: [develop]
    paths:
      - 'renderer/desktop/**'
      - 'renderer/libs.versions.toml'
      - 'renderer/kotlin'
      - 'renderer/**/module.yaml'
      - 'scripts/install-nik.sh'
      - 'scripts/fetch-fork-window.sh'
      - 'scripts/fetch-fork-skiko.sh'
      - 'scripts/publish-skiko-awt.sh'
      - 'experiments/static-library/**'
      - 'renderer/scripts/publish-window.sh'
      - 'renderer/scripts/build-compose.sh'
      - 'renderer/scripts/compose-fork.changes'
      - 'scripts/tests/renderer/**'
      - 'scripts/parity/**'
      - '.github/scripts/check-linux-input-access.sh'
      - '.github/scripts/atspi-walk.py'
      - '.github/workflows/test-graalvm-renderer.yml'
      - '.github/scripts/vertical-resize-run.sh'
      - '.github/scripts/vertical-resize-check.sh'
  workflow_dispatch:

concurrency:
  group: test-graalvm-renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    needs: compose-desktop
    name: Build and smoke test the GraalVM renderer (macOS, arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache Liberica NIK
        uses: actions/cache@v4
        with:
          path: ~/.cache/compose-rust/nik
          key: nik-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-nik.sh') }}

      - name: Install Liberica NIK 25 Full
        run: ./scripts/install-nik.sh --github-env

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Install JDK 21 for skiko's Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Remember where that JDK is
        run: echo "DXC_SKIKO_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Take the Compose fork's desktop modules
        uses: actions/download-artifact@v4
        with:
          name: compose-fork-desktop
          path: ~/.m2/repository/org

      - name: Build the renderer shared library
        # With the fork's skiko built without JAWT and linked in, so the image carries no AWT.
        run: ./renderer/desktop/scripts/build-native.sh

      - name: The fork's window modules name no AWT
        run: ./scripts/tests/renderer/window-modules-no-awt.test.sh

      - name: The linked image carries no AWT
        run: ./scripts/tests/renderer/image-has-no-awt.test.sh

      - name: The image's ways into the toolkit
        run: bash scripts/tests/renderer/linux-image-toolkit-boundary.test.sh renderer/build/native-image/dist/lib

      - name: Smoke test
        env:
          COMPOSE_RUST_AUTOEXIT_MS: '5000'
        run: ./renderer/desktop/scripts/smoke-test.sh

      - name: The content stays put while the window's height is dragged
        # The smoke host again, with the probe that drags the bottom edge and then the top
        # edge with mouse events and takes the window's image throughout; a mark drawn at a
        # fixed distance below the top of every frame must stay within a point of where it
        # was drawn, except in an image where AppKit's own view is off by the same amount:
        # the window server shows this window's frame a step behind its layers now and then,
        # and that is a miss of the absolute bound the check still prints. See
        # .github/scripts/vertical-resize-check.sh.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/vertical-resize"
          printf '#!/bin/sh\nCOMPOSE_RUST_AUTOEXIT_MS=120000 exec "%s"\n' "$PWD/renderer/build/native-image/smoke_host" > "$RUNNER_TEMP/smoke-launch"
          chmod +x "$RUNNER_TEMP/smoke-launch"
          ./.github/scripts/vertical-resize-run.sh "$RUNNER_TEMP/smoke-launch" "$out" vertical-macos-graalvm
          ./.github/scripts/vertical-resize-check.sh "$out/vertical-macos-graalvm.log" 1.0 --against-appkit | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the vertical resize log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical-resize-macos-graalvm
          path: ${{ runner.temp }}/vertical-resize/
          if-no-files-found: ignore
          retention-days: 14

      - name: Parity measurements, GraalVM AppKit path
        timeout-minutes: 15
        # The measured half of the checklist static-renderer.yml runs on the Kotlin/Native
        # macOS window, with the same application: the consumer fixture, linked to the
        # renderer this job just built. A hosted session cannot post a key from outside, so
        # the rows that need a hand say n/a. The table is in the job summary.
        run: |
          dist="$PWD/renderer/build/native-image/dist/lib"
          COMPOSE_RUST_RENDERER_DIR="$dist" CARGO_TARGET_DIR="$PWD/target/parity" \
            cargo build --manifest-path compose-rust/tests/fixtures/consumer/Cargo.toml
          ./scripts/parity/macos.sh graalvm "$RUNNER_TEMP/parity" -- \
            "$PWD/target/parity/debug/consumer" --parity

      - name: Keep the macOS parity run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-graalvm-macos-arm64
          path: ${{ runner.temp }}/parity/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report the distribution size
        run: du -sh renderer/build/native-image/dist/lib

      - name: Upload the renderer for inspection
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-renderer-macos-arm64
          path: renderer/build/native-image/dist/
          retention-days: 7

  compose-desktop:
    name: Build the Compose fork's desktop modules
    # The Linux image carries no Java toolkit, which takes changes Compose's desktop modules
    # do not have upstream (the embedder main dispatcher, clipboard entries and text direction
    # without java.awt). They are built once here, on a machine with the Android SDK the
    # Compose build configures against, and the Linux jobs take the result: the jars do not
    # depend on the architecture.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Report the machine
        run: echo "ANDROID_HOME=${ANDROID_HOME:?the runner image has no Android SDK}"

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Point the Compose build at the JDK
        run: echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Configure Gradle for this runner
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build and publish the desktop modules
        env:
          DXC_COMPOSE_BUILD: ${{ github.workspace }}/../compose-build
        run: |
          rm -rf ~/.m2/repository
          ./renderer/scripts/build-compose.sh --target desktop --clean
          # skiko-awt with the switch that keeps UIManager out of a toolkit-free image.
          # It is published under a version of its own, so no cache of upstream's can shadow it.
          ./scripts/publish-skiko-awt.sh "$RUNNER_TEMP/skiko-awt"
          find ~/.m2/repository/org/thisisthepy/compose -name '*.jar' | sort

      - name: Keep the published modules
        uses: actions/upload-artifact@v4
        with:
          name: compose-fork-desktop
          path: |
            ~/.m2/repository/org/thisisthepy/compose
            ~/.m2/repository/org/jetbrains/skiko/skiko-awt
          retention-days: 7

  linux-x64:
    needs: compose-desktop
    name: Build and smoke test the GraalVM renderer (Linux, x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream GraalVM Community for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux AWT, Skia, font, and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev unzip pkg-config fontconfig \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libxrandr-dev \
            libfontconfig1-dev libfreetype6-dev libgl1 libgl1-mesa-dri libegl1 \
            libgl1-mesa-dev fonts-noto-cjk xvfb xauth dbus-x11

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-linux-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-linux-

      - name: Take the Compose fork's desktop modules
        uses: actions/download-artifact@v4
        with:
          name: compose-fork-desktop
          path: ~/.m2/repository/org

      - name: Run Linux script contract tests
        run: bash scripts/tests/renderer/linux-build.test.sh

      - name: Run the Linux metadata contract test
        run: bash scripts/tests/renderer/linux-metadata.test.sh

      - name: Build the Linux renderer under Xvfb
        run: xvfb-run -a ./renderer/desktop/scripts/build-native-linux.sh

      - name: The fork's window modules name no AWT
        run: ./scripts/tests/renderer/window-modules-no-awt.test.sh

      - name: The image's ways into the toolkit
        run: bash scripts/tests/renderer/linux-image-toolkit-boundary.test.sh

      - name: The image carries no Java toolkit
        run: bash scripts/tests/renderer/linux-image-has-no-awt.test.sh

      - name: Inspect staged dynamic dependencies
        run: |
          find renderer/build/native-image-linux/dist/lib -maxdepth 1 -type f -print | sort
          ldd renderer/build/native-image-linux/dist/lib/*.so

      - name: Headless startup smoke only
        env:
          COMPOSE_RUST_AUTOEXIT_MS: '5000'
        run: xvfb-run -a ./renderer/desktop/scripts/smoke-test-linux.sh

      - name: Install an input method, an accessibility registry and input tools
        run: |
          sudo apt-get install -y ibus ibus-hangul at-spi2-core python3-gi gir1.2-atspi-2.0 \
            xdotool libglib2.0-bin x11-utils

      - name: Type Korean and read the GraalVM X11 window, through a real input method and registry
        # The check the Kotlin/Native window passes in static-renderer.yml, against this window:
        # XIM preedit and commit through ibus-hangul, and the tree walked and a button pressed
        # through the at-spi2 registry.
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ./.github/scripts/check-linux-input-access.sh renderer/build/native-image-linux/dist/lib "$RUNNER_TEMP/input-access"

      - name: Keep the input and accessibility check's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-linux-input-access-logs
          path: ${{ runner.temp }}/input-access/input-check/
          if-no-files-found: ignore
          retention-days: 7

      - name: Parity checklist and measurements, GraalVM X11 path
        timeout-minutes: 12
        # The checklist static-renderer.yml runs on the Kotlin/Native window, with the same
        # application: the consumer fixture the input check above built against this
        # renderer. The table is in the job summary; a row that fails is a warning, not a stop.
        run: |
          sudo apt-get install -y xclip
          xvfb-run -a -s '-screen 0 1280x1024x24' ./scripts/parity/linux.sh graalvm "$RUNNER_TEMP/parity" -- \
            "$PWD/target/linux-input-check-shared/debug/consumer" --parity

      - name: Keep the Linux parity run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-graalvm-linux
          path: ${{ runner.temp }}/parity/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the Linux renderer for inspection
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-renderer-linux-x64
          path: renderer/build/native-image-linux/dist/
          retention-days: 7

  linux-arm64:
    needs: compose-desktop
    name: Build and smoke test the GraalVM renderer (Linux, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install upstream GraalVM Community for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux AWT, Skia, font, and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev unzip pkg-config fontconfig \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libxrandr-dev \
            libfontconfig1-dev libfreetype6-dev libgl1 libgl1-mesa-dri libegl1 \
            libgl1-mesa-dev fonts-noto-cjk xvfb xauth dbus-x11

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-linux-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-linux-

      - name: Take the Compose fork's desktop modules
        uses: actions/download-artifact@v4
        with:
          name: compose-fork-desktop
          path: ~/.m2/repository/org

      - name: Build the Linux renderer under Xvfb
        run: xvfb-run -a ./renderer/desktop/scripts/build-native-linux.sh

      - name: The image's ways into the toolkit
        run: bash scripts/tests/renderer/linux-image-toolkit-boundary.test.sh

      - name: The image carries no Java toolkit
        run: bash scripts/tests/renderer/linux-image-has-no-awt.test.sh

      - name: Inspect staged dynamic dependencies
        run: |
          find renderer/build/native-image-linux/dist/lib -maxdepth 1 -type f -print | sort
          ldd renderer/build/native-image-linux/dist/lib/*.so

      - name: Headless startup smoke only
        env:
          COMPOSE_RUST_AUTOEXIT_MS: '5000'
        run: xvfb-run -a ./renderer/desktop/scripts/smoke-test-linux.sh

      - name: Upload the Linux renderer for inspection
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-renderer-linux-arm64
          path: renderer/build/native-image-linux/dist/
          retention-days: 7
