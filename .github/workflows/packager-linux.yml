# Linux packaging: an AppImage that updates itself and a Flatpak built the way Flathub
# builds one. Each channel is shown updating an installed build to a newer one.
#
# - rust:     the packager's tests, the update module's tests, lint, and the lock file.
# - appimage: builds a small program twice (1.0.0 and 1.0.1), wraps both as signed
#             AppImages carrying zsync update information, serves the newer one's .zsync
#             from nginx on the runner, and has the installed 1.0.0 update itself. Then a
#             1.0.2 signed by a different key is published and the update must be refused.
#             Last, a real calculator with its renderer (built at the v0.0.0 tag against
#             that tag's released renderer, x86_64) is wrapped and started under a
#             virtual display.
# - flatpak:  builds the same program from source with flatpak-builder, offline, with
#             every crate vendored, installs it, then builds 1.0.1 into the same repository
#             and updates the installation with `flatpak update`. Then the same calculator
#             is packaged as a prebuilt archive and started in the sandbox under a virtual
#             display, and the Flathub submission for dev.darkpyonix.Ember is generated.
#             Every manifest goes through Flathub's linter.
#
# Runs when the packaging code changes, or by hand. It downloads Flatpak SDKs and builds a
# Rust program inside one, which is not something to repeat on every push.

name: Linux packaging

on:
  push:
    paths:
      - tools/packager-linux/**
      - dioxus-compose/src/update.rs
      - dioxus-compose/tests/appimage_update.rs
      - .github/workflows/packager-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packager-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The calculator from the published sample release: the renderer, its AWT and Skia
  # companions and the executable, already pointed at each other by relative paths.
  CALCULATOR_URL: https://github.com/DarkPyonix/dioxus-compose/releases/download/sample-v0.1.1/calculator-linux-x64.tar.gz
  CALCULATOR_SHA256: ebc52967d02bfbd2eb22317cb23d023417ec2029eac811f3ce6b018e1950fded
  CALCULATOR_ARM64_URL: https://github.com/DarkPyonix/dioxus-compose/releases/download/sample-v0.1.1/calculator-linux-arm64.tar.gz
  CALCULATOR_ARM64_SHA256: b264dbc9efa2d7dc7e1ff9559743840d63c2aeca01f69a0e6d1ea1da9d97306f
  FLATPAK_RUNTIME: "26.08"
  # The renderer release archive, built into the from-source Flatpak so that the step
  # which points an executable at the renderer beside it runs for real.
  RENDERER_URL: https://github.com/DarkPyonix/dioxus-compose/releases/download/v0.0.0/dioxus-compose-renderer-v0.0.0-linux-x64.tar.gz
  RENDERER_SHA256: 5fe6ba31e359753a8e3c3a743f2f8ecadac409fda2634ba3b569e00f27ec19aa

jobs:
  rust:
    name: Packager tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: The lock file already records every dependency
        # A Flathub build runs `cargo build --locked` with no network, so a lock file that
        # needs updating is a build that cannot happen there.
        run: |
          cargo metadata --format-version 1 >/dev/null
          if ! git diff --exit-code Cargo.lock; then
            mkdir -p lock && cp Cargo.lock lock/
            echo "::error::Cargo.lock is out of date; the updated file is the 'cargo-lock' artifact"
            echo "LOCK_STALE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: env.LOCK_STALE == '1'
        with:
          name: cargo-lock
          path: lock/Cargo.lock

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -p packager-linux -p packager-linux-demo --all-targets -- -D warnings
          cargo clippy -p dioxus-compose --no-default-features --lib --test appimage_update -- -D warnings

      - name: Tests
        run: |
          cargo test -p packager-linux
          cargo test -p dioxus-compose --no-default-features --test appimage_update
          cargo test -p dioxus-compose --no-default-features --doc update

      - name: Repository rules
        run: |
          bash scripts/tests/no-em-dash.test.sh
          bash scripts/tests/no-spec-citations.test.sh

      - name: Fail on a stale lock file
        if: env.LOCK_STALE == '1'
        run: exit 1

  appimage:
    name: AppImage updates itself (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            calculator: calculator-linux-x64.tar.gz
            calculator_sha256: ebc52967d02bfbd2eb22317cb23d023417ec2029eac811f3ce6b018e1950fded
          - runner: ubuntu-24.04-arm
            arch: aarch64
            calculator: calculator-linux-arm64.tar.gz
            calculator_sha256: b264dbc9efa2d7dc7e1ff9559743840d63c2aeca01f69a0e6d1ea1da9d97306f
    env:
      ARCH: ${{ matrix.arch }}
      CALCULATOR_URL: https://github.com/DarkPyonix/dioxus-compose/releases/download/sample-v0.1.1/${{ matrix.calculator }}
      CALCULATOR_SHA256: ${{ matrix.calculator_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zsync desktop-file-utils appstream gnupg nginx-light fuse3 libfuse2t64 patchelf \
            xvfb xauth imagemagick libgl1 libegl1 libgl1-mesa-dri fontconfig \
            libxtst6 libxi6 libxrender1 libxext6 libxrandr2 fonts-dejavu-core
          rustup toolchain install stable --profile minimal && rustup default stable
          ls -l /dev/fuse || echo "no /dev/fuse"

      - name: Build the packager and two versions of the program
        run: |
          set -euo pipefail
          cargo build --release -p packager-linux
          mkdir -p work/1.0.0 work/1.0.1 work/1.0.2
          for v in 1.0.0 1.0.1 1.0.2; do
            DIOXUS_COMPOSE_APP_VERSION=$v cargo build --release -p packager-linux-demo
            cp target/release/update-demo "work/$v/update-demo"
            "work/$v/update-demo" --version
          done
          echo "PACKAGER_LINUX=$PWD/target/release/packager-linux" >> "$GITHUB_ENV"

      - name: Make two signing keys
        # The release key, and an impostor's, to show an update signed by anyone else is
        # refused.
        run: |
          set -euo pipefail
          export GNUPGHOME="$PWD/work/gnupg" && mkdir -p -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --passphrase '' --quick-gen-key "Release <release@example.invalid>" ed25519 sign never
          gpg --batch --passphrase '' --quick-gen-key "Impostor <impostor@example.invalid>" ed25519 sign never
          echo "RELEASE_KEY=$(gpg --list-keys --with-colons release@example.invalid | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
          echo "IMPOSTOR_KEY=$(gpg --list-keys --with-colons impostor@example.invalid | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Package all three versions
        run: |
          set -euo pipefail
          url=http://127.0.0.1:8080/latest/UpdateDemo-$ARCH.AppImage.zsync
          for v in 1.0.0 1.0.1 1.0.2; do
            key="$RELEASE_KEY"; [[ $v == 1.0.2 ]] && key="$IMPOSTOR_KEY"
            tools/packager-linux/appimage.sh \
              --dioxus-toml tools/packager-linux/demo/Dioxus.toml \
              --payload "work/$v/update-demo" --version "$v" \
              --zsync-url "$url" --sign-key "$key" --out-dir "work/dist"
          done
          ls -l work/dist
          head -c 400 work/dist/UpdateDemo-1.0.1-$ARCH.AppImage.zsync | sed -n '1,/^$/p'

      - name: The AppImage carries its update information and its updater
        run: |
          set -euo pipefail
          app=work/dist/UpdateDemo-1.0.0-$ARCH.AppImage
          info="$("$app" --appimage-updateinformation)"
          echo "$info"
          [[ "$info" == "zsync|http://127.0.0.1:8080/latest/UpdateDemo-$ARCH.AppImage.zsync" ]]
          "$app" --appimage-signature | head -3
          "$app" --appimage-extract >/dev/null
          test -e squashfs-root/usr/lib/appimageupdatetool/AppRun
          test -x squashfs-root/usr/lib/update-demo/update-demo
          desktop-file-validate squashfs-root/dev.darkpyonix.compose.UpdateDemo.desktop
          appstreamcli validate --no-net --explain \
            squashfs-root/usr/share/metainfo/dev.darkpyonix.compose.UpdateDemo.appdata.xml
          rm -rf squashfs-root

      - name: Serve releases from nginx on the runner
        run: |
          set -euo pipefail
          srv="$PWD/work/server" && mkdir -p "$srv/latest" "$srv/tmp"
          cat > "$srv/nginx.conf" <<EOF
          worker_processes 1;
          pid $srv/nginx.pid;
          error_log $srv/error.log;
          events {}
          http {
            log_format ranges '\$status \$body_bytes_sent "\$request" range="\$http_range"';
            access_log $srv/access.log ranges;
            client_body_temp_path $srv/tmp/body;
            proxy_temp_path $srv/tmp/proxy;
            fastcgi_temp_path $srv/tmp/fastcgi;
            uwsgi_temp_path $srv/tmp/uwsgi;
            scgi_temp_path $srv/tmp/scgi;
            default_type application/octet-stream;
            server { listen 127.0.0.1:8080; root $srv; }
          }
          EOF
          nginx -c "$srv/nginx.conf"
          echo "SERVER=$srv" >> "$GITHUB_ENV"

      - name: Install 1.0.0, publish 1.0.0, and it is up to date
        run: |
          set -euo pipefail
          publish() {
            rm -f "$SERVER/latest/"*
            cp "work/dist/UpdateDemo-$1-$ARCH.AppImage" "$SERVER/latest/"
            # One fixed name for the newest .zsync; it names the AppImage beside it.
            cp "work/dist/UpdateDemo-$1-$ARCH.AppImage.zsync" "$SERVER/latest/UpdateDemo-$ARCH.AppImage.zsync"
          }
          declare -f publish > work/publish.sh
          publish 1.0.0
          mkdir -p work/installed
          cp work/dist/UpdateDemo-1.0.0-$ARCH.AppImage work/installed/UpdateDemo.AppImage
          app=work/installed/UpdateDemo.AppImage
          "$app" --version | tee /dev/stderr | grep -qx "update-demo 1.0.0"
          "$app" --delivery
          "$app" --check

      - name: Publish 1.0.1, and 1.0.0 updates itself to it
        run: |
          set -euo pipefail
          source work/publish.sh
          publish 1.0.1
          : > "$SERVER/access.log"
          app="$PWD/work/installed/UpdateDemo.AppImage"
          before="$(sha256sum "$app" | cut -d' ' -f1)"
          set +e; "$app" --check; code=$?; set -e
          [[ $code -eq 10 ]] || { echo "expected 10 (update available), got $code"; exit 1; }
          # Check, ask (answered yes here), apply, and restart into the new version.
          "$app" --update --yes 2>&1 | tee work/update.log
          tail -1 work/update.log | grep -qx "update-demo 1.0.1"
          "$app" --version | grep -qx "update-demo 1.0.1"
          "$app" --check
          after="$(sha256sum "$app" | cut -d' ' -f1)"
          published="$(sha256sum "$SERVER/latest/UpdateDemo-1.0.1-$ARCH.AppImage" | cut -d' ' -f1)"
          echo "before $before"; echo "after  $after"; echo "served $published"
          [[ "$after" == "$published" && "$before" != "$after" ]]
          echo "--- requests"
          cat "$SERVER/access.log"
          size="$(stat -c %s "$app")"
          fetched="$(awk '/AppImage HTTP/ {sum += $2} END {print sum + 0}' "$SERVER/access.log")"
          echo "downloaded $fetched of $size bytes of the AppImage"
          grep -q '^206 ' "$SERVER/access.log" || { echo "no ranged request: the update was not a delta"; exit 1; }
          {
            echo "### AppImage 1.0.0 updated itself to 1.0.1"
            echo
            echo "Downloaded $fetched of $size bytes (zsync ranged requests)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: An update signed by another key is refused
        run: |
          set -euo pipefail
          source work/publish.sh
          publish 1.0.2
          app="$PWD/work/installed/UpdateDemo.AppImage"
          before="$(sha256sum "$app" | cut -d' ' -f1)"
          set +e; "$app" --update --yes > work/impostor.log 2>&1; code=$?; set -e
          cat work/impostor.log
          echo "exit status $code"
          [[ $code -ne 0 ]] || { echo "the impostor's update was accepted"; exit 1; }
          "$app" --version | grep -qx "update-demo 1.0.1"
          [[ "$(sha256sum "$app" | cut -d' ' -f1)" == "$before" ]]
          ls -la work/installed
          echo "The impostor's 1.0.2 was refused and 1.0.1 still runs." >> "$GITHUB_STEP_SUMMARY"

      - name: Wrap a calculator as an AppImage and start it
        # A calculator whose executable and renderer belong together: the v0.0.0 tag
        # built against its own released renderer (ci/calculator-v0.sh says why the
        # published sample archives cannot be used). That renderer exists for x86_64
        # only, so on aarch64 there is nothing that can start, and the step says so.
        run: |
          set -euo pipefail
          if [[ "$ARCH" != x86_64 ]]; then
            echo "::notice title=No aarch64 calculator::no renderer was published for linux-arm64 at v0.0.0; the self-update steps above ran on aarch64"
            exit 0
          fi
          tools/packager-linux/ci/calculator-v0.sh work
          # Unsigned: these are test builds, and the signing key is not created yet.
          tools/packager-linux/appimage.sh \
            --dioxus-toml samples/calculator/Dioxus.toml \
            --overlay tools/packager-linux/samples.toml \
            --exec sample-calculator --icon samples/calculator/assets/icon.png \
            --icon samples/calculator/assets/icon-256.png \
            --payload work/calculator/calculator --version 0.0.0 \
            --github DarkPyonix/compose-rust-samples \
            --out-dir work/dist
          app=work/dist/Calculator-0.0.0-$ARCH.AppImage
          "$app" --appimage-updateinformation
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
            '$app' > work/calculator.log 2>&1 &
            pid=\$!
            sleep 25
            import -window root work/calculator-appimage.png
            if kill -0 \$pid 2>/dev/null; then echo 'still running after 25 s'; kill \$pid; else echo 'exited early'; wait \$pid; echo \"status \$?\"; fi
          " | tee work/calculator-run.txt
          cat work/calculator.log
          grep -q 'still running' work/calculator-run.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            work/dist/*.AppImage
            work/dist/*.zsync
            work/*.log
            work/*.png
            work/server/access.log

  flatpak:
    name: Flatpak builds and updates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and Flathub's builder
        run: |
          set -euo pipefail
          # Ubuntu 24.04 stops unprivileged user namespaces through AppArmor, and
          # bubblewrap, which builds and runs every sandbox, needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder dbus-daemon patchelf xvfb xauth imagemagick python3-pip
          pip install --user 'aiohttp>=3.9.5,<4' 'tomlkit>=0.13.3,<1'
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user remote-ls flathub --runtime --columns=ref | grep -E '^runtime/org\.freedesktop\.Platform/x86_64/[0-9.]+$' || true
          flatpak --user install --noninteractive flathub org.flatpak.Builder \
            "org.freedesktop.Platform//$FLATPAK_RUNTIME" "org.freedesktop.Sdk//$FLATPAK_RUNTIME" \
            "org.freedesktop.Sdk.Extension.rust-stable//$FLATPAK_RUNTIME"
          echo "== what the SDK has for rewriting an executable's library names"
          flatpak run --command=sh "org.freedesktop.Sdk//$FLATPAK_RUNTIME" -c 'command -v patchelf readelf || true'
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo build --release -p packager-linux
          echo "PACKAGER_LINUX=$PWD/target/release/packager-linux" >> "$GITHUB_ENV"

      - name: Build 1.0.0 from source, offline, and install it
        run: |
          set -euo pipefail
          mkdir -p work/flatpak-src
          # What a release publishes: the tagged source as an archive.
          git archive --format=tar.gz --prefix=compose-rust/ -o work/flatpak-src/source.tar.gz HEAD
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- tools/packager-linux/flatpak.sh \
            --dioxus-toml tools/packager-linux/demo/Dioxus.toml --version 1.0.0 \
            --source-path source.tar.gz --cargo-lock Cargo.lock \
            --package packager-linux-demo --bin update-demo \
            --renderer-url "$RENDERER_URL" --renderer-sha256 "$RENDERER_SHA256" \
            --out work/flatpak-src --build work/repo --lint
          id=dev.darkpyonix.compose.UpdateDemo
          flatpak run "$id" --version | tee /dev/stderr | grep -qx "update-demo 1.0.0"
          flatpak run "$id" --delivery
          flatpak run "$id" --update --yes | tee /dev/stderr | grep -q "store"
          # The renderer travelled beside the executable and the executable looks beside
          # itself for libraries.
          flatpak run --devel --command=sh "$id" -c 'ls /app/lib/update-demo; readelf -d /app/lib/update-demo/update-demo | grep -E "RUNPATH|RPATH|NEEDED"'
          flatpak run --command=sh "$id" -c 'test -f /app/lib/update-demo/libdioxus_compose_renderer.so' 
          cat work/flatpak-src/$id.json

      - name: Build 1.0.1 into the same repository, and flatpak update installs it
        run: |
          set -euo pipefail
          id=dev.darkpyonix.compose.UpdateDemo
          # The installed copy came from the builder; install it again from the repository
          # as a remote, the way a store delivers it, so that `flatpak update` has
          # somewhere to look.
          flatpak --user remote-add --no-gpg-verify --if-not-exists local-repo "$PWD/work/repo"
          flatpak --user uninstall --noninteractive "$id"
          flatpak --user install --noninteractive local-repo "$id"
          flatpak run "$id" --version | grep -qx "update-demo 1.0.0"
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- tools/packager-linux/flatpak.sh \
            --dioxus-toml tools/packager-linux/demo/Dioxus.toml --version 1.0.1 \
            --source-path source.tar.gz --cargo-lock Cargo.lock \
            --package packager-linux-demo --bin update-demo \
            --renderer-url "$RENDERER_URL" --renderer-sha256 "$RENDERER_SHA256" \
            --out work/flatpak-src
          (cd work/flatpak-src && flatpak-builder \
            --user --force-clean --state-dir="$PWD/.flatpak-builder" --repo="$PWD/../repo" build "$id.json")
          flatpak --user update --noninteractive "$id"
          flatpak run "$id" --version | tee /dev/stderr | grep -qx "update-demo 1.0.1"
          flatpak --user info "$id"
          echo "### Flatpak 1.0.0 updated to 1.0.1 with flatpak update" >> "$GITHUB_STEP_SUMMARY"

      - name: Package a calculator as a prebuilt archive and start it in the sandbox
        run: |
          set -euo pipefail
          tools/packager-linux/ci/calculator-v0.sh work
          mkdir -p work/flatpak-calculator
          cp work/calculator-linux-x64.tar.gz work/flatpak-calculator/
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- tools/packager-linux/flatpak.sh \
            --dioxus-toml samples/calculator/Dioxus.toml \
            --overlay tools/packager-linux/samples.toml \
            --exec sample-calculator --icon samples/calculator/assets/icon.png \
            --icon samples/calculator/assets/icon-256.png --version 0.0.0 \
            --prebuilt-path calculator-linux-x64.tar.gz \
            --out work/flatpak-calculator --build work/repo-calculator --lint
          id=dev.darkpyonix.dioxus.compose.samples.calculator
          cat "work/flatpak-calculator/$id.json"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
            flatpak run $id > work/calculator-flatpak.log 2>&1 &
            pid=\$!
            sleep 30
            import -window root work/calculator-flatpak.png
            if kill -0 \$pid 2>/dev/null; then echo 'still running after 30 s'; kill \$pid; else echo 'exited early'; wait \$pid; echo \"status \$?\"; fi
          " | tee work/calculator-flatpak-run.txt
          cat work/calculator-flatpak.log
          grep -q 'still running' work/calculator-flatpak-run.txt

      - name: Prepare the Flathub submission for dev.darkpyonix.Ember
        # What flathub/dev.darkpyonix.Ember will hold, generated and linted. Ember has no
        # release yet, so two inputs are stand-ins and the listing is not submitted:
        # the archives are the published calculator samples, and the screenshot is
        # Ember's large icon, both pinned. For a real release,
        # tools/packager-linux/flathub/ember.sh takes the tag and fills in Ember's own
        # archives, digests and the screenshot pinned to that tag.
        env:
          EMBER_COMMIT: faa430a4b75ec45928623130ea2f874b628a7224
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/DarkPyonix/darkpyonix-ember/$EMBER_COMMIT"
          mkdir -p work/ember-icons
          curl -fsSL -o work/ember-icons/128.png "$raw/src-tauri/icons/128x128.png"
          curl -fsSL -o work/ember-icons/256.png "$raw/src-tauri/icons/128x128@2x.png"
          dbus-run-session -- tools/packager-linux/flatpak.sh \
            --dioxus-toml tools/packager-linux/flathub/dev.darkpyonix.Ember.toml \
            --app-id dev.darkpyonix.Ember --version 0.0.0 \
            --icon work/ember-icons/128.png --icon work/ember-icons/256.png \
            --screenshot "$raw/src-tauri/icons/128x128@2x.png" --screenshot-caption "Ember" \
            --prebuilt-url "$CALCULATOR_URL" --prebuilt-sha256 "$CALCULATOR_SHA256" --prebuilt-arch x86_64 \
            --prebuilt-url "$CALCULATOR_ARM64_URL" --prebuilt-sha256 "$CALCULATOR_ARM64_SHA256" --prebuilt-arch aarch64 \
            --out work/flathub-ember --lint
          rm -rf work/flathub-ember/.flatpak-builder work/flathub-ember/build
          find work/flathub-ember -type f | sort
          cat work/flathub-ember/dev.darkpyonix.Ember.metainfo.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flathub-submission-ember
          path: work/flathub-ember/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak
          path: |
            work/flatpak-src/*.json
            work/flatpak-src/*.xml
            work/flatpak-src/*.desktop
            work/flatpak-calculator/*.json
            work/flatpak-calculator/*.xml
            work/flatpak-calculator/*.desktop
            work/flatpak-src/lint-*.json
            work/flatpak-calculator/lint-*.json
            work/*.log
            work/*.png
