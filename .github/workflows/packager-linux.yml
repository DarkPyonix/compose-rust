# Linux packaging: an AppImage and a Flatpak built the way Flathub builds one. Direct
# distribution is packaged and updated with Velopack, so nothing here carries update
# information.
#
# - rust:     the packager's tests, lint, and the lock file.
# - appimage: builds a small program, wraps it as a signed AppImage, checks the contents
#             and the metadata the desktop tools read. Then the calculator (built in this
#             run with the static renderer linked in) is wrapped and started under a
#             virtual display, on both architectures.
# - flatpak:  builds the same program from source with flatpak-builder, offline, with
#             every crate vendored, installs it, then builds 1.0.1 into the same repository
#             and updates the installation with `flatpak update`. Then a calculator, built in
#             this run (calculator job) as one executable with the Linux static renderer
#             linked in, for x86_64 and aarch64, is
#             packaged as a prebuilt archive and started in the sandbox under a virtual
#             display, and the Flathub submission for dev.darkpyonix.Ember is generated.
#             Every manifest goes through Flathub's linter. The builder and the linter are
#             Flathub's own, from the org.flatpak.Builder Flatpak, because the one in
#             Ubuntu's archive does not know the options Flathub requires.
#
# Heavy: the static renderer is built first (static-renderer.yml, the same definition the
# release uses), which takes hours, and the Flatpak SDKs are large. So it runs on request
# only: the run-heavy-ci label, or by hand. heavy-checks.yml holds the merge until it has
# passed on the pull request's head.

name: Linux packaging

on:
  pull_request:
    # Only when asked: the run-heavy-ci label going on, or a push or reopen while it is on.
    types: [synchronize, reopened, labeled]
    paths:
      - scripts/packager-linux/**
      - .github/workflows/packager-linux.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run started by some other label going on gets a group of its own, so it cannot
  # cancel a heavy run.
  group: packager-linux-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-heavy-ci' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  FLATPAK_RUNTIME: "26.08"
  # A screenshot for the test listings, pinned to a commit the way a store listing must be
  # (Ember's large icon; the images are stand-ins, the pinning and mirroring are real).
  SCREENSHOT_URL: https://raw.githubusercontent.com/DarkPyonix/darkpyonix-ember/faa430a4b75ec45928623130ea2f874b628a7224/src-tauri/icons/128x128@2x.png
  # Flathub's builder and linter, run from the org.flatpak.Builder Flatpak.
  FLATPAK_BUILDER: flatpak run --command=flatpak-builder org.flatpak.Builder
  FLATPAK_BUILDER_LINT: flatpak run --command=flatpak-builder-lint org.flatpak.Builder

jobs:
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  # The Linux renderer, from the reusable workflow the release uses. The calculator below
  # links it, so it is one executable. The called workflow has no concurrency group of
  # its own (it only runs inside a caller), so this workflow's group covers it.
  static-renderer:
    name: renderer
    needs: requested
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: ${{ matrix.target }}

  calculator:
    name: Calculator (${{ matrix.arch }})
    needs: [requested, static-renderer]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: linux-x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries a Linux application links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxext-dev libgl1-mesa-dev libegl-dev libfontconfig1-dev libfreetype-dev
          rustup toolchain install stable --profile minimal && rustup default stable

      - name: Download the static renderer
        uses: actions/download-artifact@v4
        with:
          pattern: compose-rust-renderer-v*-${{ matrix.target }}
          path: renderer-artifact
          merge-multiple: true

      - name: Build the calculator against it, as one executable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/renderer" work/calculator/calculator
          tar -xzf renderer-artifact/*.tar.gz -C "$RUNNER_TEMP/renderer"
          COMPOSE_RUST_RENDERER_DIR="$RUNNER_TEMP/renderer" \
            cargo build --release -p sample-calculator --features compose-rust/native-renderer
          cp target/release/sample-calculator work/calculator/calculator/
          exe=work/calculator/calculator/sample-calculator
          readelf -d "$exe" | grep -E '\((NEEDED|RUNPATH|RPATH)\)' || true
          # The renderer is linked in: no library of its own is needed beside it.
          ! readelf -d "$exe" | grep -qi renderer
          tar -czf "work/calculator-${{ matrix.target }}.tar.gz" -C work/calculator calculator

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-${{ matrix.target }}
          path: work/calculator-${{ matrix.target }}.tar.gz

  rust:
    needs: requested
    name: Packager tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: The lock file already records every dependency
        # A Flathub build runs `cargo build --locked` with no network, so a lock file that
        # needs updating is a build that cannot happen there.
        run: |
          cargo metadata --format-version 1 >/dev/null
          if ! git diff --exit-code Cargo.lock; then
            mkdir -p lock && cp Cargo.lock lock/
            echo "::error::Cargo.lock is out of date; the updated file is the 'cargo-lock' artifact"
            echo "LOCK_STALE=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        if: env.LOCK_STALE == '1'
        with:
          name: cargo-lock
          path: lock/Cargo.lock

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy -p packager-linux -p packager-linux-demo --all-targets -- -D warnings

      - name: Tests
        run: |
          cargo test -p packager-linux

      - name: Repository rules
        run: |
          bash scripts/tests/no-em-dash.test.sh
          bash scripts/tests/no-spec-citations.test.sh

      - name: Fail on a stale lock file
        if: env.LOCK_STALE == '1'
        run: exit 1

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: [requested, calculator]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: linux-x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: linux-arm64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils appstream gnupg fuse3 libfuse2t64 patchelf \
            xvfb xauth imagemagick libgl1 libegl1 libgl1-mesa-dri fontconfig \
            libxtst6 libxi6 libxrender1 libxext6 libxrandr2 fonts-dejavu-core
          rustup toolchain install stable --profile minimal && rustup default stable
          ls -l /dev/fuse || echo "no /dev/fuse"

      - name: Build the packager and the program
        run: |
          set -euo pipefail
          cargo build --release -p packager-linux
          mkdir -p work/1.0.0
          for v in 1.0.0; do
            COMPOSE_RUST_APP_VERSION=$v cargo build --release -p packager-linux-demo
            cp target/release/update-demo "work/$v/update-demo"
            "work/$v/update-demo" --version
          done
          echo "PACKAGER_LINUX=$PWD/target/release/packager-linux" >> "$GITHUB_ENV"

      - name: Make a signing key
        run: |
          set -euo pipefail
          export GNUPGHOME="$PWD/work/gnupg" && mkdir -p -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --passphrase '' --quick-gen-key "Release <release@example.invalid>" ed25519 sign never
          echo "RELEASE_KEY=$(gpg --list-keys --with-colons release@example.invalid | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Package the program
        run: |
          set -euo pipefail
          scripts/packager-linux/appimage.sh \
            --dioxus-toml scripts/packager-linux/demo/Dioxus.toml \
            --payload "work/1.0.0/update-demo" --version 1.0.0 \
            --sign-key "$RELEASE_KEY" --out-dir "work/dist"
          ls -l work/dist

      - name: The AppImage carries its payload and valid metadata
        run: |
          set -euo pipefail
          app=work/dist/UpdateDemo-1.0.0-$ARCH.AppImage
          # No update information: Velopack owns updates.
          ! "$app" --appimage-updateinformation 2>/dev/null | grep -q zsync
          "$app" --appimage-signature | head -3
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/usr/lib/update-demo/update-demo
          desktop-file-validate squashfs-root/dev.darkpyonix.compose.UpdateDemo.desktop
          appstreamcli validate --no-net --explain \
            squashfs-root/usr/share/metainfo/dev.darkpyonix.compose.UpdateDemo.appdata.xml
          rm -rf squashfs-root
          cp "$app" work/UpdateDemo.AppImage
          work/UpdateDemo.AppImage --version | tee /dev/stderr | grep -qx "update-demo 1.0.0"

      - name: Download the calculator
        uses: actions/download-artifact@v4
        with:
          name: calculator-${{ matrix.target }}
          path: work

      - name: Wrap the calculator as an AppImage and start it
        # Built in this run from this tree as one executable with the static renderer
        # linked in (the calculator job), so the same step runs on both architectures.
        run: |
          set -euo pipefail
          mkdir -p work/calc
          tar -xzf "work/calculator-${{ matrix.target }}.tar.gz" -C work/calc
          # Unsigned: these are test builds, and the signing key is not created yet.
          scripts/packager-linux/appimage.sh \
            --dioxus-toml samples/calculator/Dioxus.toml \
            --overlay scripts/packager-linux/samples.toml \
            --exec sample-calculator --icon samples/calculator/assets/icon.png \
            --icon samples/calculator/assets/icon-256.png \
            --payload work/calc/calculator --version 0.0.0 \
            --out-dir work/dist
          app=work/dist/Calculator-0.0.0-$ARCH.AppImage
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
            '$app' > work/calculator.log 2>&1 &
            pid=\$!
            sleep 25
            import -window root work/calculator-appimage.png
            if kill -0 \$pid 2>/dev/null; then echo 'still running after 25 s'; kill \$pid; else echo 'exited early'; wait \$pid; echo \"status \$?\"; fi
          " | tee work/calculator-run.txt
          cat work/calculator.log
          grep -q 'still running' work/calculator-run.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            work/dist/*.AppImage
            work/*.log
            work/*.png

  flatpak:
    name: Flatpak builds and updates
    needs: [requested, calculator]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install flatpak and Flathub's builder
        run: |
          set -euo pipefail
          # Ubuntu 24.04 stops unprivileged user namespaces through AppArmor, and
          # bubblewrap, which builds and runs every sandbox, needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          # No flatpak-builder from apt: it is too old for the options Flathub requires.
          # Flathub's own builder is installed below as the org.flatpak.Builder Flatpak.
          sudo apt-get install -y --no-install-recommends flatpak elfutils dbus-daemon patchelf xvfb xauth imagemagick \
            build-essential pkg-config libx11-dev libxext-dev libgl1-mesa-dev libegl-dev libfontconfig1-dev libfreetype-dev
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user remote-ls flathub --runtime --columns=ref | grep -E '^runtime/org\.freedesktop\.Platform/x86_64/[0-9.]+$' || true
          flatpak --user install --noninteractive flathub org.flatpak.Builder \
            "org.freedesktop.Platform//$FLATPAK_RUNTIME" "org.freedesktop.Sdk//$FLATPAK_RUNTIME" \
            "org.freedesktop.Sdk.Extension.rust-stable//$FLATPAK_RUNTIME"
          echo "== what the SDK has for rewriting an executable's library names"
          flatpak run --command=sh "org.freedesktop.Sdk//$FLATPAK_RUNTIME" -c 'command -v patchelf readelf || true'
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo build --release -p packager-linux
          echo "PACKAGER_LINUX=$PWD/target/release/packager-linux" >> "$GITHUB_ENV"

      - name: Build 1.0.0 from source, offline, and install it
        run: |
          set -euo pipefail
          mkdir -p work/flatpak-src
          # What a release publishes: the tagged source as an archive.
          git archive --format=tar.gz --prefix=compose-rust/ -o work/flatpak-src/source.tar.gz HEAD
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- scripts/packager-linux/flatpak.sh \
            --dioxus-toml scripts/packager-linux/demo/Dioxus.toml --version 1.0.0 \
            --source-path source.tar.gz --cargo-lock Cargo.lock \
            --package packager-linux-demo --bin update-demo \
            --screenshot "$SCREENSHOT_URL" --screenshot-caption "The demo" \
            --out work/flatpak-src --build work/repo --lint
          id=dev.darkpyonix.compose.UpdateDemo
          flatpak run "$id" --version | tee /dev/stderr | grep -qx "update-demo 1.0.0"
          # One executable: it runs, and no renderer library is among what it loads.
          flatpak run --devel --command=sh "$id" -c 'ls /app/lib/update-demo; readelf -d /app/lib/update-demo/update-demo | grep -E "RUNPATH|RPATH|NEEDED" || true'
          flatpak run --command=sh "$id" -c '
            set -e
            test -x /app/lib/update-demo/update-demo
            ! readelf -d /app/lib/update-demo/update-demo | grep -qi "renderer"
            ! ls /app/lib/update-demo | grep -qi "renderer"'
          cat work/flatpak-src/$id.json

      - name: Build 1.0.1 into the same repository, and flatpak update installs it
        run: |
          set -euo pipefail
          id=dev.darkpyonix.compose.UpdateDemo
          # The installed copy came from the builder; install it again from the repository
          # as a remote, the way a store delivers it, so that `flatpak update` has
          # somewhere to look.
          flatpak --user remote-add --no-gpg-verify --if-not-exists local-repo "$PWD/work/repo"
          flatpak --user uninstall --noninteractive "$id"
          flatpak --user install --noninteractive local-repo "$id"
          flatpak run "$id" --version | grep -qx "update-demo 1.0.0"
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- scripts/packager-linux/flatpak.sh \
            --dioxus-toml scripts/packager-linux/demo/Dioxus.toml --version 1.0.1 \
            --source-path source.tar.gz --cargo-lock Cargo.lock \
            --package packager-linux-demo --bin update-demo \
            --screenshot "$SCREENSHOT_URL" --screenshot-caption "The demo" \
            --out work/flatpak-src
          (cd work/flatpak-src && $FLATPAK_BUILDER \
            --compose-url-policy=full --mirror-screenshots-url=https://dl.flathub.org/media --user --force-clean \
            --install-deps-from=flathub --state-dir="$PWD/.flatpak-builder" --repo="$PWD/../repo" build "$id.json")
          flatpak --user update --noninteractive "$id"
          flatpak run "$id" --version | tee /dev/stderr | grep -qx "update-demo 1.0.1"
          flatpak --user info "$id"
          echo "### Flatpak 1.0.0 updated to 1.0.1 with flatpak update" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the calculators
        uses: actions/download-artifact@v4
        with:
          pattern: calculator-linux-*
          path: work/calc
          merge-multiple: true

      - name: Package the calculator as a prebuilt archive and start it in the sandbox
        run: |
          set -euo pipefail
          mkdir -p work/flatpak-calculator
          cp work/calc/calculator-linux-x64.tar.gz work/flatpak-calculator/
          # flatpak talks to its system helper over the session bus, which a runner has
          # none of until one is started.
          dbus-run-session -- scripts/packager-linux/flatpak.sh \
            --dioxus-toml samples/calculator/Dioxus.toml \
            --overlay scripts/packager-linux/samples.toml \
            --exec sample-calculator --icon samples/calculator/assets/icon.png \
            --icon samples/calculator/assets/icon-256.png --version 0.0.0 \
            --prebuilt-path calculator-linux-x64.tar.gz \
            --screenshot "$SCREENSHOT_URL" --screenshot-caption "The calculator" \
            --out work/flatpak-calculator --build work/repo-calculator --lint
          id=dev.darkpyonix.composerust.samples.calculator
          cat "work/flatpak-calculator/$id.json"
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
            flatpak run $id > work/calculator-flatpak.log 2>&1 &
            pid=\$!
            sleep 30
            import -window root work/calculator-flatpak.png
            if kill -0 \$pid 2>/dev/null; then echo 'still running after 30 s'; kill \$pid; else echo 'exited early'; wait \$pid; echo \"status \$?\"; fi
          " | tee work/calculator-flatpak-run.txt
          cat work/calculator-flatpak.log
          grep -q 'still running' work/calculator-flatpak-run.txt

      - name: Prepare the Flathub submission for dev.darkpyonix.Ember
        # What flathub/dev.darkpyonix.Ember will hold, generated and linted. Ember has no
        # release yet, so two inputs are stand-ins and the listing is not submitted:
        # the archives are the calculators built above (both architectures, as file:// sources), and the screenshot is
        # Ember's large icon, pinned. For a real release,
        # scripts/packager-linux/flathub/ember.sh takes the tag and fills in Ember's own
        # archives, digests and the screenshot pinned to that tag.
        env:
          EMBER_COMMIT: faa430a4b75ec45928623130ea2f874b628a7224
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/DarkPyonix/darkpyonix-ember/$EMBER_COMMIT"
          mkdir -p work/ember-icons
          curl -fsSL -o work/ember-icons/128.png "$raw/src-tauri/icons/128x128.png"
          curl -fsSL -o work/ember-icons/256.png "$raw/src-tauri/icons/128x128@2x.png"
          mkdir -p work/flathub-ember
          x64="$PWD/work/calc/calculator-linux-x64.tar.gz"
          arm64="$PWD/work/calc/calculator-linux-arm64.tar.gz"
          dbus-run-session -- scripts/packager-linux/flatpak.sh \
            --dioxus-toml scripts/packager-linux/flathub/dev.darkpyonix.Ember.toml \
            --app-id dev.darkpyonix.Ember --version 0.0.0 \
            --icon work/ember-icons/128.png --icon work/ember-icons/256.png \
            --screenshot "$raw/src-tauri/icons/128x128@2x.png" --screenshot-caption "Ember" \
            --prebuilt-url "file://$x64" --prebuilt-sha256 "$(sha256sum "$x64" | cut -d' ' -f1)" --prebuilt-arch x86_64 \
            --prebuilt-url "file://$arm64" --prebuilt-sha256 "$(sha256sum "$arm64" | cut -d' ' -f1)" --prebuilt-arch aarch64 \
            --out work/flathub-ember --lint
          rm -rf work/flathub-ember/.flatpak-builder work/flathub-ember/build
          find work/flathub-ember -type f | sort
          cat work/flathub-ember/dev.darkpyonix.Ember.metainfo.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flathub-submission-ember
          path: work/flathub-ember/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak
          path: |
            work/flatpak-src/*.json
            work/flatpak-src/*.xml
            work/flatpak-src/*.desktop
            work/flatpak-calculator/*.json
            work/flatpak-calculator/*.xml
            work/flatpak-calculator/*.desktop
            work/flatpak-src/lint-*.json
            work/flatpak-calculator/lint-*.json
            work/*.log
            work/*.png
