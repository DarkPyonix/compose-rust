# Native renderer: the slow half of the quality gate, and the release.
#
# A version tag runs the same platform builds this workflow already runs for verification,
# then attaches what they produced to a GitHub Release. publish-crates.yml then publishes
# the crate once this workflow has succeeded. Building it twice, once to check and once to ship, is what a separate release workflow used to
# do, and the two copies drifted. One workflow, one platform list.
#
# What ships, per platform:
#
#   macos-aarch64, linux-x64,  the Kotlin/Native renderer as a static archive, Compose,
#   linux-arm64                Skia and ICU inside it. The crate links it into the
#                              application, so the application is one executable that needs
#                              nothing but the system's own libraries. arm64 Linux is cross
#                              compiled on x86-64, because Kotlin/Native has no arm64 host.
#   windows-x64                the Kotlin/Native renderer as the static kit an MSVC link
#                              needs (windows-static.yml), so a Windows application is one
#                              executable as well.
#   ios                        the Kotlin/Native archive as an XCFramework.
#
# The crate stays an ordinary crate that builds with no renderer present, and each
# renderer ships as a checksummed tarball on the release for its tag. The build script
# links whichever kind the tarball holds.
#
# `single-executable` is the proof of the first row: it builds an application the way a
# consumer does, from the tarball exactly as the release will carry it, checks that it
# names only system libraries, and runs it alone in an empty directory.
#
# The macOS and Linux native images are no longer built here. Nothing ships them, and the
# shared-library path they exercised is still linked by the Rust quality gate, which builds
# against whatever renderer it is given.
#
# This is the counterpart to test.yml. test.yml runs on every pull request because it is
# fast; the builds here compile Compose and the renderer ahead of time, which costs tens of
# minutes per platform. So it runs:
#   - on a pull request that touches the renderer, once it carries the run-heavy-ci label
#     (heavy-checks.yml then holds the merge until this has passed on the head),
#   - on pushes to main that touch the renderer, its scripts or how the crate links it,
#   - nightly, to catch toolchain drift even when nobody touched the renderer,
#   - on demand.
#
# None of the maintainers own a Windows or Linux machine, so these jobs are the only place
# those platforms are exercised at all. Keep them unconditional. A job that is skipped by
# default reports green while proving nothing, which is how Windows sat untested.

name: Native renderer test

on:
  push:
    tags:
    - v*
  workflow_call:
    inputs:
      windows_kit_built:
        # ci.yml builds the Windows renderer kit once for the whole run and sets this, so this
        # workflow uses that kit instead of building its own copy of the same commit.
        description: The Windows renderer kit is already an artifact of this run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Heavy: runs only when asked for (the run-heavy-ci label on a pull request, or any other
  # event). Every job below needs this one, through `changed`, so a run nobody asked for is
  # skipped whole, and heavy-checks.yml does not count it.
  requested:
    name: Heavy checks requested
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-heavy-ci') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-heavy-ci'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Heavy checks requested by ${{ github.event_name }} ${{ github.event.action }}"

  # main moves on every publication, not only on releases, so without this every push of
  # unrelated work would start four native-image builds. A tag always builds: that is the
  # release, and it must produce artifacts whatever its commit happened to touch.
  changed:
    needs: requested
    name: Check whether the renderer changed
    runs-on: ubuntu-latest
    outputs:
      renderer: ${{ steps.check.outputs.renderer }}
      macos: ${{ steps.macos.outputs.macos }}
      executables: ${{ steps.macos.outputs.executables }}
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, which is the previous main, so the diff
          # is everything the publication brought in rather than one commit of it.
          fetch-depth: 2
      - id: check
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "a tag always builds"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The nightly run exists to catch toolchain drift, which by definition changes
          # nothing in this repository, a manual run was asked for on purpose, and a pull
          # request run was asked for with its label after its own path filter matched.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "$GITHUB_EVENT_NAME always builds"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD |
              grep -qE '^(renderer/|compose-rust/build(\.rs|/)|compose-rust/tests/fixtures/(consumer|consumer-mixed-runtime|multi-window)/|scripts/(install-nik|check-windows-consumer)\.sh|\.github/scripts/(check-single-executable|package-static-renderer|check-linux-input-access)\.sh|\.github/scripts/atspi-walk\.py|scripts/parity/|\.github/workflows/(test-native|static)-renderer\.yml)'; then
            echo "the renderer changed"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under the renderer changed"
            echo "renderer=false" >> "$GITHUB_OUTPUT"
          fi

      - id: macos
        # The macOS runners are the scarce ones, so a pull request that only touches another
        # platform's own files leaves the macOS jobs out (native-needs-macos.sh). Anything
        # but an explicit macos=false keeps them: tags, main, the nightly run, manual runs,
        # an error, an empty list or any other path. A job-level condition cannot read a
        # matrix, so the single-executable matrix is built here.
        if: always()
        run: |
          macos=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            decision="$(git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD |
              ./.github/scripts/native-needs-macos.sh)" || decision="macos=true"
            [[ "$decision" == "macos=false" ]] && macos=false
          fi
          # A tag checks the same four, Windows included: its windows-x64 tarball is the
          # static kit the release carries.
          all='{"include":[{"target":"macos-aarch64","runs-on":"macos-latest"},{"target":"linux-x64","runs-on":"ubuntu-24.04"},{"target":"linux-arm64","runs-on":"ubuntu-24.04-arm"},{"target":"windows-x64","runs-on":"windows-latest"}]}'
          if [[ "$macos" == "false" ]]; then
            all="$(jq -c '.include |= map(select(.["runs-on"] != "macos-latest"))' <<< "$all")"
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "executables=$all" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # A tag whose renderers develop has already built is released with those, not built
      # again: publish-schema-renderer.yml put them on renderer-dev under the tag's schema
      # hash. They are taken only when all five are there, each matches its .sha256, and
      # they were built from the same renderer/ tree as the tag, so what ships is what this
      # commit would have built. Anything else and every build below runs as it always has.
      # The single-executable check still runs on the promoted tarballs.
      - name: Find the tag's renderers on renderer-dev
        id: promote
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./.github/scripts/schema-renderer.sh promote "$(cat compose-rust/schema-hash.txt)" \
            "$GITHUB_REF_NAME" "$(git rev-parse HEAD:renderer)" "$RUNNER_TEMP/promoted" | tee -a "$GITHUB_OUTPUT"

      # One artifact per target under the name its build job gives it, so the
      # single-executable check and the release take them exactly as they take a build's.
      - name: Hand on the promoted macOS renderer
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-rust-renderer-${{ github.ref_name }}-macos-aarch64
          path: |
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-macos-aarch64.tar.gz
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-macos-aarch64.tar.gz.sha256
          retention-days: 7
      - name: Hand on the promoted Linux x64 renderer
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-rust-renderer-${{ github.ref_name }}-linux-x64
          path: |
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-linux-x64.tar.gz
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-linux-x64.tar.gz.sha256
          retention-days: 7
      - name: Hand on the promoted Linux arm64 renderer
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-rust-renderer-${{ github.ref_name }}-linux-arm64
          path: |
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-linux-arm64.tar.gz
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-linux-arm64.tar.gz.sha256
          retention-days: 7
      - name: Hand on the promoted Windows renderer
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-rust-renderer-${{ github.ref_name }}-windows-x64
          path: |
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-windows-x64.tar.gz
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-windows-x64.tar.gz.sha256
          retention-days: 7
      - name: Hand on the promoted iOS renderer
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compose-rust-renderer-${{ github.ref_name }}-ios
          path: |
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-ios.tar.gz
            ${{ runner.temp }}/promoted/compose-rust-renderer-${{ github.ref_name }}-ios.tar.gz.sha256
          retention-days: 7

  # The renderers macOS and Linux ship: Kotlin/Native as a static archive, built and packaged
  # by static-renderer.yml, which test-samples.yml calls too. arm64 Linux is cross compiled on
  # x86-64 there, because Kotlin/Native has no arm64 Linux host.
  macos-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true' && needs.changed.outputs.macos != 'false' && needs.changed.outputs.promoted != 'true'
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: macos-aarch64

  linux-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true' && needs.changed.outputs.promoted != 'true'
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: linux-x64

  linux-arm64-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true' && needs.changed.outputs.promoted != 'true'
    uses: ./.github/workflows/static-renderer.yml
    with:
      target: linux-arm64

  # Every compose-rust desktop application is one executable. This builds one the way a
  # consumer does, with no build script of its own and no variable pointing anywhere, from
  # the tarball above exactly as the release will carry it: the tarball goes where a build
  # with no network looks for its download, and the build script verifies and unpacks it.
  # The executable has to name nothing but system libraries, and copied alone into an empty
  # directory it has to open its window and draw. A fresh checkout, so the only renderer
  # there is to find is the tarball.
  single-executable:
    # Each platform's check needs only its own artifact, so one platform failing to build
    # does not hide whether the others are one executable.
    needs: [changed, macos-static, linux-static, linux-arm64-static, windows-static]
    if: ${{ !cancelled() && needs.changed.outputs.renderer == 'true' }}
    name: One executable on ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed.outputs.executables) }}
    env:
      # Mesa draws with the processor; a hosted runner has no card.
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install the libraries an application links on Linux, and a virtual display
        # Development packages, because linking names libX11.so and friends; the runtime
        # halves are what a desktop already has.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libgl1-mesa-dev libegl-dev libfontconfig1-dev libfreetype-dev \
            fonts-noto-cjk libgl1-mesa-dri xvfb xauth

      - name: Download the renderer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: compose-rust-renderer-v*-${{ matrix.target }}
          path: artifact
          merge-multiple: true

      - name: Take every ICU data file off the runner
        # The executable has to find Korean words and line breaks with what is linked into
        # it. A hosted runner ships browsers that carry icudtl.dat, so they are removed and
        # the check below then confirms none is left.
        shell: bash
        run: |
          # find reports the directories it may not read and exits non-zero for them,
          # which is not a failure to find anything; what is left is checked afterwards.
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Git Bash's view of the drives; no sudo, the runner is an administrator.
            { find "/c/Program Files" "/c/Program Files (x86)" "/c/ProgramData" "/c/Users" \
                "/c/Windows" "/c/hostedtoolcache" "/c/msys64" "/d/a/_tool" "/d/a/_temp" \
                -name 'icudtl.dat' 2>/dev/null || true; } |
              while IFS= read -r file; do echo "removing $file"; rm -f "$file"; done
          else
            { find /usr /opt /Library /Applications /home /Users -name 'icudtl.dat' 2>/dev/null || true; } |
              while IFS= read -r file; do echo "removing $file"; sudo rm -f "$file"; done
          fi

      - name: Build it, check what it needs, and run it alone
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifact
          tarball="$(ls artifact/*.tar.gz)"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              ./.github/scripts/check-single-executable.sh "$tarball" "$RUNNER_TEMP/single-executable"
          else
            ./.github/scripts/check-single-executable.sh "$tarball" "$RUNNER_TEMP/single-executable"
          fi

  # The Windows twin of linux-static: the Kotlin/Native renderer linked into one MSVC
  # executable with the application, which then has to start from an empty directory with
  # nothing but Windows beneath it. Its own workflow, because Compose for mingwX64 is built
  # on Linux first and the two halves are two jobs; windows-static.yml says why.
  windows-static:
    needs: changed
    if: needs.changed.outputs.renderer == 'true' && !inputs.windows_kit_built && needs.changed.outputs.promoted != 'true'
    uses: ./.github/workflows/windows-static.yml

  # iOS is Kotlin/Native, not native-image, so it shares nothing with the jobs above
  # except the interpreter source. It builds both slices (simulator and device) and
  # runs the *desktop* C smoke host against the simulator archive, which is what makes
  # it evidence for PR-2: one unmodified host, two renderers, one ABI.
  ios:
    needs: changed
    if: needs.changed.outputs.renderer == 'true' && needs.changed.outputs.macos != 'false' && needs.changed.outputs.promoted != 'true'
    name: Build and smoke test the renderer (iOS, simulator)
    # macos-26, not macos-latest. Compose Multiplatform's iOS artifacts carry
    # precompiled Objective-C objects built against the iOS 26 SDK, and one of them
    # references UIViewLayoutRegion, a class that does not exist in the iOS 18 SDK on the
    # macos-15 image. Linking the smoke host there fails with an undefined symbol even
    # though both archives built cleanly.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Kotlin toolchain, konan and Maven dependencies
        id: cache-1
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: kotlin-ios-${{ hashFiles('renderer/kotlin', 'renderer/libs.versions.toml', 'renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-ios-

      - name: Protocol codec tests on Kotlin/Native (PR-4)
        working-directory: renderer
        env:
          DXC_RETRY_LOG: ${{ runner.temp }}/amper-test-retry.log
        run: ./scripts/retry-resolution.sh ./kotlin test -m ios

      - name: Build the simulator archive
        run: ./renderer/desktop/scripts/build-ios.sh

      - name: Build the device archive
        # Never run, only linked. It proves the arm64 device slice still compiles and
        # exports the PR-2 symbols; running it needs a signed app on real hardware.
        run: ./renderer/desktop/scripts/build-ios.sh --target device

      - name: Simulator smoke test (PR-2)
        run: ./renderer/desktop/scripts/ios-smoke-test.sh --screenshot "${RUNNER_TEMP}/ios-smoke.png"

      - name: Simulator screenshot of the system's navigation chrome
        # The default smoke tree has no navigation, so the screenshot above shows none of
        # the chrome iOS 26 draws as Liquid Glass. This run declares two destinations,
        # which is what the renderer turns into a UITabBarController and a title bar.
        run: |
          ./renderer/desktop/scripts/ios-smoke-test.sh \
            --navigation --screenshot "${RUNNER_TEMP}/ios-navigation.png"

      - name: Package the iOS renderer as an XCFramework
        # Both slices in one bundle, which is the only form Xcode links directly. A bare
        # .a would make every consumer pick the right slice by hand and would break the
        # moment they switched between a device and the simulator.
        if: startsWith(github.ref, 'refs/tags/v')
        id: package
        run: |
          set -euo pipefail
          name="compose-rust-renderer-${GITHUB_REF_NAME}-ios"
          ./.github/scripts/package-ios-renderer.sh "$name" renderer/build/ios .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload the release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

      - name: Upload the simulator screenshots
        # The one artifact a human can judge without a Mac to hand. Whether the bars are
        # really made of glass cannot be asserted, only looked at, so the navigation shot
        # is uploaded beside the plain one.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            ${{ runner.temp }}/ios-smoke.png
            ${{ runner.temp }}/ios-navigation.png
          retention-days: 7

      - name: Save the Kotlin toolchain, konan and Maven dependencies (not from a pull request)
        if: github.event_name != 'pull_request' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  # Everything below runs only for a version tag, and only after every platform above has
  # built and smoke tested. A crates.io version can be yanked but never replaced, and the
  # crate's build script points at the release artifact for its own version, so publishing
  # while a platform is missing would leave anyone on that platform with a version that can
  # never be made to work.
  release:
    name: Attach the renderer to the GitHub release
    needs: [changed, windows-static, macos-static, linux-static, linux-arm64-static, single-executable, ios]
    # Every job above has to have succeeded, as before. The one exception is a release
    # whose renderers were promoted from renderer-dev: then the build jobs did not run, and
    # what has to have succeeded is the promotion and the single-executable check of the
    # promoted tarballs.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      (
        (needs.changed.outputs.promoted == 'true' &&
          needs.changed.result == 'success' && needs.single-executable.result == 'success') ||
        (needs.changed.outputs.promoted != 'true' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          !contains(needs.*.result, 'skipped'))
      )
    runs-on: ubuntu-latest
    permissions:
      # The only write permission anywhere in this repository's workflows, and
      # it is scoped to this job: it creates a release and uploads files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download the platform artifacts
        # The release assets only. Every one is named after the file it carries, and the
        # per-run inspection uploads are not.
        uses: actions/download-artifact@v4
        with:
          pattern: compose-rust-renderer-v*
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Create or update the release
        # Published, not drafted. The crate that names these artifacts is uploaded to
        # crates.io by publish-crates.yml, and that cannot be undone, so a release left in draft
        # means the published crate points at a download page nobody outside this
        # repository can see. The gate is the tag: a tag only reaches here after all three
        # platforms built and smoke tested.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS --clobber
            # A release created by an earlier run of this tag may still be a draft.
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Renderer artifacts for \`$TAG\`. Verify with \`shasum -a 256 -c SHA256SUMS\`." \
              artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS
          fi
