[package]
name = "dioxus-compose-adapter"
# Versioned with compose-rust, whose boundary and records it writes through.
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Dioxus authoring layer for compose-rust: rsx!, hooks and a VirtualDom, drawn by the Compose renderer."
repository = "https://github.com/DarkPyonix/compose-rust"
keywords = ["ui", "gui", "dioxus", "compose", "desktop"]
categories = ["gui"]
# Not published from here. The adapter moves to the dioxus-compose repository, and until it
# does it exists to keep the Dioxus applications in this workspace building, among them the
# Dioxus baseline the compose-rust runtime is measured against.
publish = false

[lib]
name = "dioxus_compose_adapter"
# The lib has no #[bench] items, but `cargo bench` would still run its default test
# harness, which rejects Criterion's flags (--quick, --noplot). Benchmarks live in
# benches/host.rs with harness = false.
bench = false

[features]
# The renderer is compose-rust's to find, download and link. These only pass the choice
# through, so an application that names this crate alone gets the same defaults it got when
# this was part of compose-rust.
default = ["native-renderer"]
mock-renderer = ["compose-rust/mock-renderer"]
native-renderer = ["compose-rust/native-renderer"]

[dependencies]
compose-rust = { path = "../../compose-rust", default-features = false }
dioxus-core.workspace = true
dioxus-core-macro.workspace = true
dioxus-hooks.workspace = true
dioxus-signals.workspace = true

# Criterion is not built for the browser. Its default features pull in rayon, which
# refuses to compile for a wasm target, and building the Host as a wasm module compiles
# dev-dependencies because an example is a dev target. The benchmarks only ever run on the
# machine that records their numbers.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "host"
harness = false

[[example]]
name = "desktop_demo"
required-features = ["native-renderer"]

# The browser's Host is a wasm module the page fetches. It has no `main` either: the
# Renderer's module owns the loop, and `web_main!` registers this example's root component
# from the entry point the page calls once both modules exist.
[[example]]
name = "web_demo"
crate-type = ["cdylib"]
