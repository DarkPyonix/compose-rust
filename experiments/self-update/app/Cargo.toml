# The application the self-update rehearsal installs at one version and watches replace
# itself with the next.
#
# It depends on the published dioxus-compose, not the one in this checkout, and
# rehearse.sh fetches the renderer released for that version: building this needs no
# renderer build, and the two halves are guaranteed to be from the same schema. 0.0.0 does
# not fetch its renderer by itself, so the script does and names it with
# DIOXUS_COMPOSE_RENDERER_DIR.
[package]
name = "self-update-demo"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: this directory is inside the repository's but is not one of its
# members, and the repository's lock file should not carry a crate it only rehearses with.
[workspace]

[features]
default = ["sparkle"]
# The updater. Without it (default features off) the application does not update itself,
# and the packager makes it a bundle with no Sparkle in it.
sparkle = ["dep:dioxus-compose-update", "dep:objc2"]

[dependencies]
dioxus-compose = { version = "=0.0.0", features = ["native-renderer"] }
# The published 0.0.0's rsx! expands to paths in these two crates, so an application of
# that version names them itself. Later versions re-export what the macro needs.
dioxus-core = "0.7.10"
dioxus-signals = "0.7"
dioxus-compose-update = { path = "../../../dioxus-compose-update", optional = true }

# Only for the rehearsal's "quit after N seconds", which stands in for the person choosing
# Quit so that installing on quit can be watched without anyone at the keyboard.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
