# Standalone crate: deliberately NOT a member of the repository workspace so
# that `scripts/check.sh` (which runs over the workspace) is unaffected by this
# experiment. See ../README.md.
[workspace]

[package]
name = "web-interop-rust"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
